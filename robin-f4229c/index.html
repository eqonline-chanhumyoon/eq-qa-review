ght at the same hour.",0],["S40","sentence","The third, upon the next night when the last stroke of Twelve has ceased to vibrate.",0],["S41","sentence","Look to see me no more; and look that, for your own sake, you remember what has passed between us!\"",0],["S42","sentence","When it had said these words, the spectre took its wrapper from the table, and bound it round its head as before.",0],["S43","sentence","Scrooge",0]],"a-christmas-carol|L1:P13":[["S1","sentence","knew this by the smart sound its teeth made when the jaws were brought together by the bandage.",1],["S2","sentence","He ventured to raise his eyes again, and found his supernatural visitor confronting him in an erect attitude, with its chain wound over and about its arm.",0],["S3","sentence","The apparition walked backward from him; and, at every step it took, the window raised itself a little, so that, when the spectre reached it, it was wide open.",0],["S4","sentence","It beckoned Scrooge to approach, which he did.",0],["S5","sentence","When they were within two paces of each other, Marley's Ghost held up its hand, warning him to come no nearer.",0],["S6","sentence","Scrooge stopped.",0],["S7","sentence","Not so much in obedience as in surprise and fear; for, on the raising of the hand, he became sensible of confused noises in the air; incoherent sounds of lamentation and regret; wailings inexpressibly sorrowful and self-accusatory.",0],["S8","sentence","The spectre, after listening for a moment, joined in the mournful dirge; and floated out upon the bleak, dark night.",0],["S9","sentence","Scrooge followed to the window: desperate in his curiosity.",0],["S10","sentence","He looked out.",0],["S11","sentence","The air was filled with phantoms, wandering hither and thither in restless haste, and moaning as they went.",0],["S12","sentence","Every one of them wore chains like Marley's Ghost; some few (they might be guilty governments) were linked together; none were free.",0],["S13","sentence","Many had been personally known to Scrooge in their lives.",0],["S14","sentence","He had been quite familiar with one old ghost in a white waistcoat, with a monstrous iron safe attached to its ankle, who cried piteously at being unable to assist a wretched woman with an infant, whom it saw below upon a doorstep.",0],["S15","sentence","The misery with them all was, clearly, that they sought to interfere, for good, in human matters, and had lost the power for ever.",0],["S16","sentence","Whether these creatures faded into mist, or mist enshrouded them, he could not tell.",0],["S17","sentence","But they and their spirit voices faded together; and the night became as it had been when he walked home.",0],["S18","sentence","Scrooge closed the window, and examined the door by which the Ghost had entered.",0],["S19","sentence","It was double locked, as he had locked it with his own hands, and the bolts were undisturbed.",0],["S20","sentence","He tried to say \"Humbug!\" but stopped at the first syllable.",0],["S21","sentence","And being, from the emotion he had undergone, or the fatigues of the day, or his glimpse of the Invisible World, or the dull conversation of the Ghost, or the lateness of the hour, much in need of repose, went straight to bed without undressing, and fell asleep upon the instant.",0],["S22","heading","STAVE TWO",1],["S23","heading","THE FIRST OF THE THREE SPIRITS",1],["S24","sentence","When Scrooge awoke it was so dark, that, looking out of bed, he could scarcely distinguish the transparent window from the opaque walls of his chamber.",1],["S25","sentence","He was endeavouring to pierce the darkness with his ferret eyes, when the chimes of a neighbouring church struck the four quarters.",0],["S26","sentence","So he listened for the hour.",0],["S27","sentence","To his great astonishment, the heavy bell went on from six to seven, and from seven to eight, and regularly up to twelve; then stopped.",0],["S28","sentence","Twelve!",0],["S29","sentence","It",0]],"a-christmas-carol|L1:P18":[["S1","sentence","by the bridle an ass laden with wood.",1],["S2","sentence","\"Why, it's Ali Baba!\" Scrooge exclaimed in ecstasy.",0],["S3","sentence","\"It's dear old honest Ali Baba!",0],["S4","sentence","Yes, yes, I know.",0],["S5","sentence","One Christmas-time when yonder solitary child was left here all alone, he did come, for the first time, just like that.",0],["S6","sentence","Poor boy!",0],["S7","sentence","And Valentine,\" said Scrooge, \"and his wild brother, Orson; there they go!",0],["S8","sentence","And what's his name, who was put down in his drawers, asleep, at the gate of Damascus; don't you see him?",0],["S9","sentence","And the Sultan's Groom turned upside down by the Genii: there he is upon his head!",0],["S10","sentence","Serve him right!",0],["S11","sentence","I'm glad of it.",0],["S12","sentence","What business had he to be married to the Princess?\"",0],["S13","sentence","To hear Scrooge expending all the earnestness of his nature on such subjects, in a most extraordinary voice between laughing and crying; and to see his heightened and excited face; would have been a surprise to his business friends in the City, indeed.",0],["S14","sentence","\"There's the Parrot!\" cried Scrooge.",0],["S15","sentence","\"Green body and yellow tail, with a thing like a lettuce growing out of the top of his head; there he is!",0],["S16","sentence","Poor Robin Crusoe he called him, when he came home again after sailing round the island.",0],["S17","sentence","'Poor Robin Crusoe, where have you been, Robin Crusoe?'",0],["S18","sentence","The man thought he was dreaming, but he wasn't. It was the Parrot, you know.",0],["S19","sentence","There goes Friday, running for his life to the little creek!",0],["S20","sentence","Halloa!",0],["S21","sentence","Hoop!",0],["S22","sentence","Halloo!\"",0],["S23","sentence","Then, with a rapidity of transition very foreign to his usual character, he said, in pity for his former self, \"Poor boy!\" and cried again.",0],["S24","sentence","\"I wish,\" Scrooge muttered, putting his hand in his pocket, and looking about him, after drying his eyes with his cuff: \"but it's too late now.\"",0],["S25","sentence","\"What is the matter?\" asked the Spirit.",0],["S26","sentence","\"Nothing,\" said Scrooge.",0],["S27","sentence","\"Nothing.",0],["S28","sentence","There was a boy singing a Christmas Carol at my door last night.",0],["S29","sentence","I should like to have given him something: that's all.\"",0],["S30","sentence","The Ghost smiled thoughtfully, and waved its hand: saying, as it did so, \"Let us see another Christmas!\"",0],["S31","sentence","Scrooge's former self grew larger at the words, and the room became a little darker and more dirty.",0],["S32","sentence","The panels shrunk, the windows cracked; fragments of plaster fell out of the ceiling, and the naked laths were shown instead; but how all this was brought about Scrooge knew no more than you do.",0],["S33","sentence","He only knew that it was quite correct: that everything had happened so; that there he was, alone again, when all the other boys had gone home for the jolly holidays.",0],["S34","sentence","He was not reading now, but walking up and down despairingly.",0],["S35","sentence","Scrooge looked at the Ghost, and, with a mournful shaking of his head, glanced anxiously towards the door.",0],["S36","sentence","It opened; and a little girl, much younger than the boy, came darting in, and, putting her arms about his neck, and often kissing him, addressed him as her \"dear, dear brother.\"",0],["S37","sentence","\"I have come to bring you home, dear brother!\" said the child, clapping",0]],"a-christmas-carol|L1:P22":[["S1","sentence","and, shaking hands with every person individually as he or she went out, wished him or her a Merry Christmas.",1],["S2","sentence","When everybody had retired but the two 'prentices, they did the same to them; and thus the cheerful voices died away, and the lads were left to their beds; which were under a counter in the back-shop.",0],["S3","sentence","During the whole of this time Scrooge had acted like a man out of his wits.",0],["S4","sentence","His heart and soul were in the scene, and with his former self.",0],["S5","sentence","He corroborated everything, remembered everything, enjoyed everything, and underwent the strangest agitation.",0],["S6","sentence","It was not until now, when the bright faces of his former self and Dick were turned from them, that he remembered the Ghost, and became conscious that it was looking full upon him, while the light upon its head burnt very clear.",0],["S7","sentence","\"A small matter,\" said the Ghost, \"to make these silly folks so full of gratitude.\"",0],["S8","sentence","\"Small!\" echoed Scrooge.",0],["S9","sentence","The Spirit signed to him to listen to the two apprentices, who were pouring out their hearts in praise of Fezziwig; and, when he had done so, said:\n\"Why!",0],["S10","sentence","Is it not?",0],["S11","sentence","He has spent but a few pounds of your mortal money: three or four, perhaps.",0],["S12","sentence","Is that so much that he deserves this praise?\"",0],["S13","sentence","\"It isn't that,\" said Scrooge, heated by the remark, and speaking unconsciously like his former, not his latter self.",0],["S14","sentence","\"It isn't that, Spirit.",0],["S15","sentence","He has the power to render us happy or unhappy; to make our service light or burdensome; a pleasure or a toil.",0],["S16","sentence","Say that his power lies in words and looks; in things so slight and insignificant that it is impossible to add and count 'em up: what then?",0],["S17","sentence","The happiness he gives is quite as great as if it cost a fortune.\"",0],["S18","sentence","He felt the Spirit's glance, and stopped.",0],["S19","sentence","\"What is the matter?\" asked the Ghost.",0],["S20","sentence","\"Nothing particular,\" said Scrooge.",0],["S21","sentence","\"Something, I think?\" the Ghost insisted.",0],["S22","sentence","\"No,\" said Scrooge, \"no. I should like to be able to say a word or two to my clerk just now.",0],["S23","sentence","That's all.\"",0],["S24","sentence","His former self turned down the lamps as he gave utterance to the wish; and Scrooge and the Ghost again stood side by side in the open air.",0],["S25","sentence","\"My time grows short,\" observed the Spirit.",0],["S26","sentence","\"Quick!\"",0],["S27","sentence","This was not addressed to Scrooge, or to any one whom he could see, but it produced an immediate effect.",0],["S28","sentence","For again Scrooge saw himself.",0],["S29","sentence","He was older now; a man in the prime of life.",0],["S30","sentence","His face had not the harsh and rigid lines of later years; but it had begun to wear the signs of care and avarice.",0],["S31","sentence","There was an eager, greedy, restless motion in the eye, which showed the passion that had taken root, and where the shadow of the growing tree would fall.",0],["S32","sentence","He was not alone, but sat by the side of a fair young girl in a mourning dress: in whose eyes there were tears, which sparkled in the",0]],"a-christmas-carol|L1:P23":[["S1","sentence","light that shone out of the Ghost of Christmas Past.",1],["S2","sentence","\"It matters little,\" she said softly.",0],["S3","sentence","\"To you, very little.",0],["S4","sentence","Another idol has displaced me; and, if it can cheer and comfort you in time to come as I would have tried to do, I have no just cause to grieve.\"",0],["S5","sentence","\"What Idol has displaced you?\" he rejoined.",0],["S6","sentence","\"A golden one.\"",0],["S7","sentence","\"This is the even-handed dealing of the world!\" he said.",0],["S8","sentence","\"There is nothing on which it is so hard as poverty; and there is nothing it professes to condemn with such severity as the pursuit of wealth!\"",0],["S9","sentence","\"You fear the world too much,\" she answered gently.",0],["S10","sentence","\"All your other hopes have merged into the hope of being beyond the chance of its sordid reproach.",0],["S11","sentence","I have seen your nobler aspirations fall off one by one, until the master passion, Gain, engrosses you.",0],["S12","sentence","Have I not?\"",0],["S13","sentence","\"What then?\" he retorted.",0],["S14","sentence","\"Even if I have grown so much wiser, what then?",0],["S15","sentence","I am not changed towards you.\"",0],["S16","sentence","She shook her head.",0],["S17","sentence","\"Am I?\"",0],["S18","sentence","\"Our contract is an old one.",0],["S19","sentence","It was made when we were both poor, and content to be so, until, in good season, we could improve our worldly fortune by our patient industry.",0],["S20","sentence","You are changed.",0],["S21","sentence","When it was made you were another man.\"",0],["S22","sentence","\"I was a boy,\" he said impatiently.",0],["S23","sentence","\"Your own feeling tells you that you were not what you are,\" she returned.",0],["S24","sentence","\"I am.",0],["S25","sentence","That which promised happiness when we were one in heart is fraught with misery now that we are two.",0],["S26","sentence","How often and how keenly I have thought of this I will not say.",0],["S27","sentence","It is enough that I have thought of it, and can release you.\"",0],["S28","sentence","\"Have I ever sought release?\"",0],["S29","sentence","\"In words.",0],["S30","sentence","No. Never.\"",0],["S31","sentence","\"In what, then?\"",0],["S32","sentence","\"In a changed nature; in an altered spirit; in another atmosphere of life; another Hope as its great end.",0],["S33","sentence","In everything that made my love of any worth or value in your sight.",0],["S34","sentence","If this had never been between us,\" said the girl, looking mildly, but with steadiness, upon him, \"tell me, would you seek me out and try to win me now?",0],["S35","sentence","Ah, no!\"",0],["S36","sentence","He seemed to yield to the justice of this supposition in spite of himself.",0],["S37","sentence","But he said, with a struggle, \"You think not.\"",0],["S38","sentence","\"I would gladly think otherwise if I could,\" she answered.",0],["S39","sentence","\"Heaven knows!",0],["S40","sentence","When I have learned a Truth like this, I know how strong and irresistible it must be.",0],["S41","sentence","But if you were free to-day, to-morrow, yesterday, can even I believe that you would choose a dowerless girl—you who, in your very confidence with her, weigh everything by Gain: or, choosing her, if for a moment you were false enough to your one guiding principle to do so, do I not know that your repentance and regret would surely follow?",0],["S42","sentence","I do; and I release you.",0],["S43","sentence","With a full heart, for the love of him you once were.\"",0],["S44","sentence","He was about to speak; but, with",0]],"a-christmas-carol|L1:P9":[["S1","sentence","on every one.",1],["S2","sentence","\"Humbug!\" said Scrooge; and walked across the room.",0],["S3","sentence","After several turns he sat down again.",0],["S4","sentence","As he threw his head back in the chair, his glance happened to rest upon a bell, a disused bell, that hung in the room, and communicated, for some purpose now forgotten, with a chamber in the highest story of the building.",0],["S5","sentence","It was with great astonishment, and with a strange, inexplicable dread, that, as he looked, he saw this bell begin to swing.",0],["S6","sentence","It swung so softly in the outset that it scarcely made a sound; but soon it rang out loudly, and so did every bell in the house.",0],["S7","sentence","This might have lasted half a minute, or a minute, but it seemed an hour.",0],["S8","sentence","The bells ceased, as they had begun, together.",0],["S9","sentence","They were succeeded by a clanking noise, deep down below, as if some person were dragging a heavy chain over the casks in the wine merchant's cellar.",0],["S10","sentence","Scrooge then remembered to have heard that ghosts in haunted houses were described as dragging chains.",0],["S11","sentence","The cellar door flew open with a booming sound, and then he heard the noise much louder on the floors below; then coming up the stairs; then coming straight towards his door.",0],["S12","sentence","\"It's humbug still!\" said Scrooge.",0],["S13","sentence","\"I won't believe it.\"",0],["S14","sentence","His colour changed, though, when, without a pause, it came on through the heavy door, and passed into the room before his eyes.",0],["S15","sentence","Upon its coming in, the dying flame leaped up, as though it cried, \"I know him!",0],["S16","sentence","Marley's Ghost!\" and fell again.",0],["S17","sentence","The same face: the very same.",0],["S18","sentence","Marley in his pigtail, usual waistcoat, tights, and boots; the tassels on the latter bristling, like his pigtail, and his coat-skirts, and the hair upon his head.",0],["S19","sentence","The chain he drew was clasped about his middle.",0],["S20","sentence","It was long, and wound about him like a tail; and it was made (for Scrooge observed it closely) of cash-boxes, keys, padlocks, ledgers, deeds, and heavy purses wrought in steel.",0],["S21","sentence","His body was transparent; so that Scrooge, observing him, and looking through his waistcoat, could see the two buttons on his coat behind.",0],["S22","sentence","Scrooge had often heard it said that Marley had no bowels, but he had never believed it until now.",0],["S23","sentence","No, nor did he believe it even now.",0],["S24","sentence","Though he looked the phantom through and through, and saw it standing before him; though he felt the chilling influence of its death-cold eyes; and marked the very texture of the folded kerchief bound about its head and chin, which wrapper he had not observed before; he was still incredulous, and fought against his senses.",0],["S25","sentence","\"How now!\" said Scrooge, caustic and cold as ever.",0],["S26","sentence","\"What do you want with me?\"",0],["S27","sentence","\"Much!\"—",0],["S28","sentence","Marley's voice, no doubt about it.",0],["S29","sentence","\"Who are you?\"",0],["S30","sentence","\"Ask me who I was.\"",0],["S31","sentence","\"Who were you, then?\" said Scrooge, raising his voice.",0],["S32","sentence","\"You're particular, for a shade.\"",0],["S33","sentence","He was going to say \"to a shade,\" but substituted this, as more appropriate.",0],["S34","sentence","\"In life I was your",0]],"a-christmas-carol|L1:P11":[["S1","sentence","why do spirits walk the earth, and why do they come to me?\"",1],["S2","sentence","\"It is required of every man,\" the Ghost returned, \"that the spirit within him should walk abroad among his fellow-men, and travel far and wide; and, if that spirit goes not forth in life, it is condemned to do so after death.",0],["S3","sentence","It is doomed to wander through the world—oh, woe is me!—and witness what it cannot share, but might have shared on earth, and turned to happiness!\"",0],["S4","sentence","Again the spectre raised a cry, and shook its chain and wrung its shadowy hands.",0],["S5","sentence","\"You are fettered,\" said Scrooge, trembling.",0],["S6","sentence","\"Tell me why?\"",0],["S7","sentence","\"I wear the chain I forged in life,\" replied the Ghost.",0],["S8","sentence","\"I made it link by link, and yard by yard; I girded it on of my own free-will, and of my own free-will I wore it.",0],["S9","sentence","Is its pattern strange to you?\"",0],["S10","sentence","Scrooge trembled more and more.",0],["S11","sentence","\"Or would you know,\" pursued the Ghost, \"the weight and length of the strong coil you bear yourself?",0],["S12","sentence","It was full as heavy and as long as this, seven Christmas-eves ago.",0],["S13","sentence","You have laboured on it since.",0],["S14","sentence","It is a ponderous chain!\"",0],["S15","sentence","Scrooge glanced about him on the floor, in the expectation of finding himself surrounded by some fifty or sixty fathoms of iron cable, but he could see nothing.",0],["S16","sentence","\"Jacob!\" he said imploringly.",0],["S17","sentence","\"Old Jacob Marley, tell me more!",0],["S18","sentence","Speak comfort to me, Jacob!\"",0],["S19","sentence","\"I have none to give,\" the Ghost replied.",0],["S20","sentence","\"It comes from other regions, Ebenezer Scrooge, and is conveyed by other ministers, to other kinds of men.",0],["S21","sentence","Nor can I tell you what I would.",0],["S22","sentence","A very little more is all permitted to me.",0],["S23","sentence","I cannot rest, I cannot stay, I cannot linger anywhere.",0],["S24","sentence","My spirit never walked beyond our counting-house—mark me;—in life my spirit never roved beyond the narrow limits of our money-changing hole; and weary journeys lie before me!\"",0],["S25","sentence","It was a habit with Scrooge, whenever he became thoughtful, to put his hands in his breeches pockets.",0],["S26","sentence","Pondering on what the Ghost had said, he did so now, but without lifting up his eyes, or getting off his knees.",0],["S27","sentence","\"You must have been very slow about it, Jacob,\" Scrooge observed in a business-like manner, though with humility and deference.",0],["S28","sentence","\"Slow!\" the Ghost repeated.",0],["S29","sentence","\"Seven years dead,\" mused Scrooge.",0],["S30","sentence","\"And travelling all the time?\"",0],["S31","sentence","\"The whole time,\" said the Ghost.",0],["S32","sentence","\"No rest, no peace.",0],["S33","sentence","Incessant torture of remorse.\"",0],["S34","sentence","\"You travel fast?\" said Scrooge.",0],["S35","sentence","\"On the wings of the wind,\" replied the Ghost.",0],["S36","sentence","\"You might have got over a great quantity of ground in seven years,\" said Scrooge.",0],["S37","sentence","The Ghost, on hearing this, set up another cry, and clanked its chain so hideously in the dead silence of the night, that the Ward would have been justified in indicting it for a nuisance.",0],["S38","sentence","\"Oh! captive, bound, and double-ironed,\" cried the phantom, \"not to know that ages of incessant labour, by immortal creatures, for this earth must pass into eternity before the good of",0]],"a-christmas-carol|L1:P17":[["S1","sentence","and carts, driven by farmers.",1],["S2","sentence","All these boys were in great spirits, and shouted to each other, until the broad fields were so full of merry music, that the crisp air laughed to hear it.",0],["S3","sentence","\"These are but shadows of the things that have been,\" said the Ghost.",0],["S4","sentence","\"They have no consciousness of us.\"",0],["S5","sentence","The jocund travellers came on; and as they came, Scrooge knew and named them every one.",0],["S6","sentence","Why was he rejoiced beyond all bounds to see them?",0],["S7","sentence","Why did his cold eye glisten, and his heart leap up as they went past?",0],["S8","sentence","Why was he filled with gladness when he heard them give each other Merry Christmas, as they parted at cross-roads and by-ways for their several homes?",0],["S9","sentence","What was merry Christmas to Scrooge?",0],["S10","sentence","Out upon merry Christmas!",0],["S11","sentence","What good had it ever done to him?",0],["S12","sentence","\"The school is not quite deserted,\" said the Ghost.",0],["S13","sentence","\"A solitary child, neglected by his friends, is left there still.\"",0],["S14","sentence","Scrooge said he knew it.",0],["S15","sentence","And he sobbed.",0],["S16","sentence","They left the high-road by a well-remembered lane, and soon approached a mansion of dull red brick, with a little weather-cock surmounted cupola on the roof and a bell hanging in it.",0],["S17","sentence","It was a large house, but one of broken fortunes: for the spacious offices were little used, their walls were damp and mossy, their windows broken, and their gates decayed.",0],["S18","sentence","Fowls clucked and strutted in the stables; and the coach-houses and sheds were overrun with grass.",0],["S19","sentence","Nor was it more retentive of its ancient state within; for, entering the dreary hall, and glancing through the open doors of many rooms, they found them poorly furnished, cold, and vast.",0],["S20","sentence","There was an earthly savour in the air, a chilly bareness in the place, which associated itself somehow with too much getting up by candle-light, and not too much to eat.",0],["S21","sentence","They went, the Ghost and Scrooge, across the hall, to a door at the back of the house.",0],["S22","sentence","It opened before them, and disclosed a long, bare, melancholy room, made barer still by lines of plain deal forms and desks.",0],["S23","sentence","At one of these a lonely boy was reading near a feeble fire; and Scrooge sat down upon a form, and wept to see his poor forgotten self as he had used to be.",0],["S24","sentence","Not a latent echo in the house, not a squeak and scuffle from the mice behind the panelling, not a drip from the half-thawed water-spout in the dull yard behind, not a sigh among the leafless boughs of one despondent poplar, not the idle swinging of an empty storehouse door, no, not a clicking in the fire, but fell upon the heart of Scrooge with softening influence, and gave a freer passage to his tears.",0],["S25","sentence","The Spirit touched him on the arm, and pointed to his younger self, intent upon his reading.",0],["S26","sentence","Suddenly a man in foreign garments: wonderfully real and distinct to look at: stood outside the window, with an axe stuck in his belt, and leading",0]],"a-christmas-carol|L1:P19":[["S1","sentence","her tiny hands, and bending down to laugh.",1],["S2","sentence","\"To bring you home, home, home!\"",0],["S3","sentence","\"Home, little Fan?\" returned the boy.",0],["S4","sentence","\"Yes!\" said the child, brimful of glee.",0],["S5","sentence","\"Home for good and all.",0],["S6","sentence","Home for ever and ever.",0],["S7","sentence","Father is so much kinder than he used to be, that home's like Heaven!",0],["S8","sentence","He spoke so gently to me one dear night when I was going to bed, that I was not afraid to ask him once more if you might come home; and he said Yes, you should; and sent me in a coach to bring you.",0],["S9","sentence","And you're to be a man!\" said the child, opening her eyes; \"and are never to come back here; but first we're to be together all the Christmas long, and have the merriest time in all the world.\"",0],["S10","sentence","\"You are quite a woman, little Fan!\" exclaimed the boy.",0],["S11","sentence","She clapped her hands and laughed, and tried to touch his head; but, being too little, laughed again, and stood on tiptoe to embrace him.",0],["S12","sentence","Then she began to drag him, in her childish eagerness, towards the door; and he, nothing loath to go, accompanied her.",0],["S13","sentence","A terrible voice in the hall cried, \"Bring down Master Scrooge's box, there!\" and in the hall appeared the schoolmaster himself, who glared on Master Scrooge with a ferocious condescension, and threw him into a dreadful state of mind by shaking hands with him.",0],["S14","sentence","He then conveyed him and his sister into the veriest old well of a shivering best parlour that ever was seen, where the maps upon the wall, and the celestial and terrestrial globes in the windows, were waxy with cold.",0],["S15","sentence","Here he produced a decanter of curiously light wine, and a block of curiously heavy cake, and administered instalments of those dainties to the young people: at the same time sending out a meagre servant to offer a glass of \"something\" to the postboy who answered that he thanked the gentleman, but, if it was the same tap as he had tasted before, he had rather not.",0],["S16","sentence","Master Scrooge's trunk being by this time tied on to the top of the chaise, the children bade the schoolmaster good-bye right willingly; and, getting into it, drove gaily down the garden sweep; the quick wheels dashing the hoar frost and snow from off the dark leaves of the evergreens like spray.",0],["S17","sentence","\"Always a delicate creature, whom a breath might have withered,\" said the Ghost.",0],["S18","sentence","\"But she had a large heart!\"",0],["S19","sentence","\"So she had,\" cried Scrooge.",0],["S20","sentence","\"You're right.",0],["S21","sentence","I will not gainsay it, Spirit.",0],["S22","sentence","God forbid!\"",0],["S23","sentence","\"She died a woman,\" said the Ghost, \"and had, as I think, children.\"",0],["S24","sentence","\"One child,\" Scrooge returned.",0],["S25","sentence","\"True,\" said the Ghost.",0],["S26","sentence","\"Your nephew!\"",0],["S27","sentence","Scrooge seemed uneasy in his mind; and answered briefly, \"Yes.\"",0],["S28","sentence","Although they had but that moment left the school behind them, they were now in the busy thoroughfares of a city, where shadowy passengers passed and repassed; where shadowy carts and coaches battled for the way, and all the strife",0]],"a-christmas-carol|L2:P2":[["S1","sentence","it down with all his force, he could not hide the light, which streamed from under it in an unbroken flood upon the ground.",1],["S2","sentence","He was conscious of being exhausted, and overcome by an irresistible drowsiness; and, further, of being in his own bedroom.",0],["S3","sentence","He gave the cap a parting squeeze, in which his hand relaxed; and had barely time to reel to bed before he sank into a heavy sleep.",0],["S4","heading","STAVE THREE",1],["S5","heading","THE SECOND OF THE THREE SPIRITS",1],["S6","sentence","Awaking in the middle of a prodigiously tough snore, and sitting up in bed to get his thoughts together, Scrooge had no occasion to be told that the bell was again upon the stroke of One.",1],["S7","sentence","He felt that he was restored to consciousness in the right nick of time, for the especial purpose of holding a conference with the second messenger dispatched to him through Jacob Marley's intervention.",0],["S8","sentence","But, finding that he turned uncomfortably cold when he began to wonder which of his curtains this new spectre would draw back, he put them every one aside with his own hands, and, lying down again, established a sharp look-out all round the bed.",0],["S9","sentence","For he wished to challenge the Spirit on the moment of its appearance, and did not wish to be taken by surprise and made nervous.",0],["S10","sentence","Gentlemen of the free-and-easy sort, who plume themselves on being acquainted with a move or two, and being usually equal to the time of day, express the wide range of their capacity for adventure by observing that they are good for anything from pitch-and-toss to manslaughter; between which opposite extremes, no doubt, there lies a tolerably wide and comprehensive range of subjects.",0],["S11","sentence","Without venturing for Scrooge quite as hardily as this, I don't mind calling on you to believe that he was ready for a good broad field of strange appearances, and that nothing between a baby and a rhinoceros would have astonished him very much.",0],["S12","sentence","Now, being prepared for almost anything, he was not by any means prepared for nothing; and consequently, when the bell struck One, and no shape appeared, he was taken with a violent fit of trembling.",0],["S13","sentence","Five minutes, ten minutes, a quarter of an hour went by, yet nothing came.",0],["S14","sentence","All this time he lay upon his bed, the very core and centre of a blaze of ruddy light, which streamed upon it when the clock proclaimed the hour; and which, being only light, was more alarming than a dozen ghosts, as he was powerless to make out what it meant, or would be at; and was sometimes apprehensive that he might be at that very moment an interesting case of spontaneous combustion, without having the consolation of knowing it.",0],["S15","sentence","At last, however, he began to think—as you or I would have thought at first; for it is always the person not in the predicament who knows what ought to have been done in it, and would unquestionably have done it too—at last, I say, he began to think that the source and secret of this",0]],"a-christmas-carol|L2:P4":[["S1","sentence","\"I am afraid I have not.",1],["S2","sentence","Have you had many brothers, Spirit?\"",0],["S3","sentence","\"More than eighteen hundred,\" said the Ghost.",0],["S4","sentence","\"A tremendous family to provide for,\" muttered Scrooge.",0],["S5","sentence","The Ghost of Christmas Present rose.",0],["S6","sentence","\"Spirit,\" said Scrooge submissively, \"conduct me where you will.",0],["S7","sentence","I went forth last night on compulsion, and I learnt a lesson which is working now.",0],["S8","sentence","To-night, if you have aught to teach me, let me profit by it.\"",0],["S9","sentence","\"Touch my robe!\"",0],["S10","sentence","Scrooge did as he was told, and held it fast.",0],["S11","sentence","Holly, mistletoe, red berries, ivy, turkeys, geese, game, poultry, brawn, meat, pigs, sausages, oysters, pies, puddings, fruit, and punch, all vanished instantly.",0],["S12","sentence","So did the room, the fire, the ruddy glow, the hour of night, and they stood in the city streets on Christmas morning, where (for the weather was severe) the people made a rough, but brisk and not unpleasant kind of music, in scraping the snow from the pavement in front of their dwellings, and from the tops of their houses, whence it was mad delight to the boys to see it come plumping down into the road below, and splitting into artificial little snow-storms.",0],["S13","sentence","The house-fronts looked black enough, and the windows blacker, contrasting with the smooth white sheet of snow upon the roofs, and with the dirtier snow upon the ground; which last deposit had been ploughed up in deep furrows by the heavy wheels of carts and waggons; furrows that crossed and recrossed each other hundreds of times where the great streets branched off; and made intricate channels, hard to trace, in the thick yellow mud and icy water.",0],["S14","sentence","The sky was gloomy, and the shortest streets were choked up with a dingy mist, half thawed, half frozen, whose heavier particles descended in a shower of sooty atoms, as if all the chimneys in Great Britain had, by one consent, caught fire, and were blazing away to their dear hearts' content.",0],["S15","sentence","There was nothing very cheerful in the climate or the town, and yet was there an air of cheerfulness abroad that the clearest summer air and brightest summer sun might have endeavoured to diffuse in vain.",0],["S16","sentence","For, the people who were shovelling away on the housetops were jovial and full of glee; calling out to one another from the parapets, and now and then exchanging a facetious snowball—better-natured missile far than many a wordy jest—laughing heartily if it went right, and not less heartily if it went wrong.",0],["S17","sentence","The poulterers' shops were still half open, and the fruiterers' were radiant in their glory.",0],["S18","sentence","There were great, round, pot-bellied baskets of chestnuts, shaped like the waistcoats of jolly old gentlemen, lolling at the doors, and tumbling out into the street in their apoplectic opulence.",0],["S19","sentence","There were ruddy, brown-faced, broad-girthed Spanish onions, shining in the fatness of their growth like Spanish Friars, and winking from their shelves in wanton slyness at the girls as they went by, and glanced demurely at the hung-up mistletoe.",0],["S20","sentence","There were pears and apples clustered high in",0]],"a-christmas-carol|L2:P7":[["S1","sentence","himself; he pocketed on Saturdays but fifteen copies of his Christian name; and yet the Ghost of Christmas Present blessed his four-roomed house!",1],["S2","sentence","Then up rose Mrs. Cratchit, Cratchit's wife, dressed out but poorly in a twice-turned gown, but brave in ribbons, which are cheap, and make a goodly show for sixpence; and she laid the cloth, assisted by Belinda Cratchit, second of her daughters, also brave in ribbons; while Master Peter Cratchit plunged a fork into the saucepan of potatoes, and, getting the corners of his monstrous shirt collar (Bob's private property, conferred upon his son and heir in honour of the day) into his mouth, rejoiced to find himself so gallantly attired, and yearned to show his linen in the fashionable Parks.",0],["S3","sentence","And now two smaller Cratchits, boy and girl, came tearing in, screaming that outside the baker's they had smelt the goose, and known it for their own; and, basking in luxurious thoughts of sage and onion, these young Cratchits danced about the table, and exalted Master Peter Cratchit to the skies, while he (not proud, although his collars nearly choked him) blew the fire, until the slow potatoes, bubbling up, knocked loudly at the saucepan lid to be let out and peeled.",0],["S4","sentence","\"What has ever got your precious father, then?\" said Mrs. Cratchit.",0],["S5","sentence","\"And your brother, Tiny Tim?",0],["S6","sentence","And Martha warn't as late last Christmas-day by half an hour!\"",0],["S7","sentence","\"Here's Martha, mother!\" said a girl, appearing as she spoke.",0],["S8","sentence","\"Here's Martha, mother!\" cried the two young Cratchits.",0],["S9","sentence","\"Hurrah!",0],["S10","sentence","There's such a goose, Martha!\"",0],["S11","sentence","\"Why, bless your heart alive, my dear, how late you are!\" said Mrs. Cratchit, kissing her a dozen times, and taking off her shawl and bonnet for her with officious zeal.",0],["S12","sentence","\"We'd a deal of work to finish up last night,\" replied the girl, \"and had to clear away this morning, mother!\"",0],["S13","sentence","\"Well! never mind so long as you are come,\" said Mrs. Cratchit.",0],["S14","sentence","\"Sit ye down before the fire, my dear, and have a warm, Lord bless ye!\"",0],["S15","sentence","\"No, no!",0],["S16","sentence","There's father coming,\" cried the two young Cratchits, who were everywhere at once.",0],["S17","sentence","\"Hide, Martha, hide!\"",0],["S18","sentence","So Martha hid herself, and in came little Bob, the father, with at least three feet of comforter, exclusive of the fringe, hanging down before him; and his threadbare clothes darned up and brushed to look seasonable; and Tiny Tim upon his shoulder.",0],["S19","sentence","Alas for Tiny Tim, he bore a little crutch, and had his limbs supported by an iron frame!",0],["S20","sentence","\"Why, where's our Martha?\" cried Bob Cratchit, looking round.",0],["S21","sentence","\"Not coming,\" said Mrs. Cratchit.",0],["S22","sentence","\"Not coming!\" said Bob with a sudden declension in his high spirits; for he had been Tim's blood horse all the way from church, and had come home rampant.",0],["S23","sentence","\"Not coming upon Christmas-day!\"",0],["S24","sentence","Martha didn't like to see him disappointed, if it were only in joke; so she came out prematurely from behind the closet door, and ran into his arms, while the two young Cratchits hustled Tiny Tim, and bore",0]],"a-christmas-carol|L2:P8":[["S1","sentence","him off into the wash-house, that he might hear the pudding singing in the copper.",1],["S2","sentence","\"And how did little Tim behave?\" asked Mrs. Cratchit when she had rallied Bob on his credulity, and Bob had hugged his daughter to his heart's content.",0],["S3","sentence","\"As good as gold,\" said Bob, \"and better.",0],["S4","sentence","Somehow, he gets thoughtful, sitting by himself so much, and thinks the strangest things you ever heard.",0],["S5","sentence","He told me, coming home, that he hoped the people saw him in the church, because he was a cripple, and it might be pleasant to them to remember upon Christmas-day who made lame beggars walk and blind men see.\"",0],["S6","sentence","Bob's voice was tremulous when he told them this, and trembled more when he said that Tiny Tim was growing strong and hearty.",0],["S7","sentence","His active little crutch was heard upon the floor, and back came Tiny Tim before another word was spoken, escorted by his brother and sister to his stool beside the fire; and while Bob, turning up his cuffs—as if, poor fellow, they were capable of being made more shabby—compounded some hot mixture in a jug with gin and lemons, and stirred it round and round, and put it on the hob to simmer, Master Peter and the two ubiquitous young Cratchits went to fetch the goose, with which they soon returned in high procession.",0],["S8","sentence","Such a bustle ensued that you might have thought a goose the rarest of all birds; a feathered phenomenon, to which a black swan was a matter of course—and, in truth, it was something very like it in that house.",0],["S9","sentence","Mrs. Cratchit made the gravy (ready beforehand in a little saucepan) hissing hot; Master Peter mashed the potatoes with incredible vigour; Miss Belinda sweetened up the apple sauce; Martha dusted the hot plates; Bob took Tiny Tim beside him in a tiny corner at the table; the two young Cratchits set chairs for everybody, not forgetting themselves, and, mounting guard upon their posts, crammed spoons into their mouths, lest they should shriek for goose before their turn came to be helped.",0],["S10","sentence","At last the dishes were set on, and grace was said.",0],["S11","sentence","It was succeeded by a breathless pause, as Mrs. Cratchit, looking slowly all along the carving-knife, prepared to plunge it in the breast; but when she did, and when the long-expected gush of stuffing issued forth, one murmur of delight arose all round the board, and even Tiny Tim, excited by the two young Cratchits, beat on the table with the handle of his knife, and feebly cried Hurrah!",0],["S12","sentence","There never was such a goose.",0],["S13","sentence","Bob said he didn't believe there ever was such a goose cooked.",0],["S14","sentence","Its tenderness and flavour, size and cheapness, were the themes of universal admiration.",0],["S15","sentence","Eked out by apple sauce and mashed potatoes, it was a sufficient dinner for the whole family; indeed, as Mrs. Cratchit said with great delight (surveying one small atom of a bone upon the dish), they hadn't ate it all at last!",0],["S16","sentence","Yet every",0]],"a-christmas-carol|L2:P9":[["S1","sentence","one had had enough, and the youngest Cratchits, in particular, were steeped in sage and onion to the eyebrows!",1],["S2","sentence","But now, the plates being changed by Miss Belinda, Mrs. Cratchit left the room alone—too nervous to bear witnesses—to take the pudding up, and bring it in.",0],["S3","sentence","Suppose it should not be done enough!",0],["S4","sentence","Suppose it should break in turning out!",0],["S5","sentence","Suppose somebody should have got over the wall of the back-yard and stolen it, while they were merry with the goose—a supposition at which the two young Cratchits became livid!",0],["S6","sentence","All sorts of horrors were supposed.",0],["S7","sentence","Hallo!",0],["S8","sentence","A great deal of steam!",0],["S9","sentence","The pudding was out of the copper.",0],["S10","sentence","A smell like a washing-day!",0],["S11","sentence","That was the cloth.",0],["S12","sentence","A smell like an eating-house and a pastrycook's next door to each other, with a laundress's next door to that!",0],["S13","sentence","That was the pudding!",0],["S14","sentence","In half a minute Mrs. Cratchit entered—flushed, but smiling proudly—with the pudding, like a speckled cannon-ball, so hard and firm, blazing in half of half-a-quartern of ignited brandy, and bedight with Christmas holly stuck into the top.",0],["S15","sentence","Oh, a wonderful pudding!",0],["S16","sentence","Bob Cratchit said, and calmly too, that he regarded it as the greatest success achieved by Mrs. Cratchit since their marriage.",0],["S17","sentence","Mrs. Cratchit said that, now the weight was off her mind, she would confess she had her doubts about the quantity of flour.",0],["S18","sentence","Everybody had something to say about it, but nobody said or thought it was at all a small pudding for a large family.",0],["S19","sentence","It would have been flat heresy to do so.",0],["S20","sentence","Any Cratchit would have blushed to hint at such a thing.",0],["S21","sentence","At last the dinner was all done, the cloth was cleared, the hearth swept, and the fire made up.",0],["S22","sentence","The compound in the jug being tasted, and considered perfect, apples and oranges were put upon the table, and a shovel full of chestnuts on the fire.",0],["S23","sentence","Then all the Cratchit family drew round the hearth in what Bob Cratchit called a circle, meaning half a one; and at Bob Cratchit's elbow stood the family display of glass.",0],["S24","sentence","Two tumblers and a custard cup without a handle.",0],["S25","sentence","These held the hot stuff from the jug, however, as well as golden goblets would have done; and Bob served it out with beaming looks, while the chestnuts on the fire sputtered and cracked noisily.",0],["S26","sentence","Then Bob proposed:\n\"A merry Christmas to us all, my dears.",0],["S27","sentence","God bless us!\"",0],["S28","sentence","Which all the family re-echoed.",0],["S29","sentence","\"God bless us every one!\" said Tiny Tim, the last of all.",0],["S30","sentence","He sat very close to his father's side, upon his little stool.",0],["S31","sentence","Bob held his withered little hand in his, as if he loved the child, and wished to keep him by his side, and dreaded that he might be taken from him.",0],["S32","sentence","\"Spirit,\" said Scrooge with an interest he had never felt before, \"tell me if Tiny Tim will live.\"",0],["S33","sentence","\"I see a vacant seat,\" replied the Ghost, \"in the poor chimney-corner, and a crutch without an",0]],"a-christmas-carol|L2:P10":[["S1","sentence","owner, carefully preserved.",1],["S2","sentence","If these shadows remain unaltered by the Future, the child will die.\"",0],["S3","sentence","\"No, no,\" said Scrooge.",0],["S4","sentence","\"Oh, no, kind Spirit! say he will be spared.\"",0],["S5","sentence","\"If these shadows remain unaltered by the Future, none other of my race,\" returned the Ghost, \"will find him here.",0],["S6","sentence","What then?",0],["S7","sentence","If he be like to die, he had better do it, and decrease the surplus population.\"",0],["S8","sentence","Scrooge hung his head to hear his own words quoted by the Spirit, and was overcome with penitence and grief.",0],["S9","sentence","\"Man,\" said the Ghost, \"if man you be in heart, not adamant, forbear that wicked cant until you have discovered What the surplus is, and Where it is.",0],["S10","sentence","Will you decide what men shall live, what men shall die?",0],["S11","sentence","It may be that, in the sight of Heaven, you are more worthless and less fit to live than millions like this poor man's child.",0],["S12","sentence","Oh God! to hear the Insect on the leaf pronouncing on the too much life among his hungry brothers in the dust!\"",0],["S13","sentence","Scrooge bent before the Ghost's rebuke, and, trembling, cast his eyes upon the ground.",0],["S14","sentence","But he raised them speedily on hearing his own name.",0],["S15","sentence","\"Mr. Scrooge!\" said Bob.",0],["S16","sentence","\"I'll give you Mr. Scrooge, the Founder of the Feast!\"",0],["S17","sentence","\"The Founder of the Feast, indeed!\" cried Mrs. Cratchit, reddening.",0],["S18","sentence","\"I wish I had him here.",0],["S19","sentence","I'd give him a piece of my mind to feast upon, and I hope he'd have a good appetite for it.\"",0],["S20","sentence","\"My dear,\" said Bob, \"the children!",0],["S21","sentence","Christmas-day.\"",0],["S22","sentence","\"It should be Christmas-day, I am sure,\" said she, \"on which one drinks the health of such an odious, stingy, hard, unfeeling man as Mr. Scrooge.",0],["S23","sentence","You know he is, Robert!",0],["S24","sentence","Nobody knows it better than you do, poor fellow!\"",0],["S25","sentence","\"My dear!\" was Bob's mild answer.",0],["S26","sentence","\"Christmas-day.\"",0],["S27","sentence","\"I'll drink his health for your sake and the Day's,\" said Mrs. Cratchit, \"not for his.",0],["S28","sentence","Long life to him!",0],["S29","sentence","A merry Christmas and a happy New Year!",0],["S30","sentence","He'll be very merry and very happy, I have no doubt!\"",0],["S31","sentence","The children drank the toast after her.",0],["S32","sentence","It was the first of their proceedings which had no heartiness in it.",0],["S33","sentence","Tiny Tim drank it last of all, but he didn't care twopence for it.",0],["S34","sentence","Scrooge was the Ogre of the family.",0],["S35","sentence","The mention of his name cast a dark shadow on the party, which was not dispelled for full five minutes.",0],["S36","sentence","After it had passed away they were ten times merrier than before, from the mere relief of Scrooge the Baleful being done with.",0],["S37","sentence","Bob Cratchit told them how he had a situation in his eye for Master Peter, which would bring in, if obtained, full five-and-sixpence weekly.",0],["S38","sentence","The two young Cratchits laughed tremendously at the idea of Peter's being a man of business; and Peter himself looked thoughtfully at the fire from between his collars, as if he were deliberating what particular investments he should favour when he came into the receipt of that bewildering income.",0],["S39","sentence","Martha, who was",0]],"a-christmas-carol|L2:P11":[["S1","sentence","a poor apprentice at a milliner's, then told them what kind of work she had to do, and how many hours she worked at a stretch, and how she meant to lie abed to-morrow morning for a good long rest; to-morrow being a holiday she passed at home.",1],["S2","sentence","Also how she had seen a countess and a lord some days before, and how the lord \"was much about as tall as Peter\"; at which Peter pulled up his collars so high, that you couldn't have seen his head if you had been there.",0],["S3","sentence","All this time the chestnuts and the jug went round and round; and by-and-by they had a song, about a lost child travelling in the snow, from Tiny Tim, who had a plaintive little voice, and sang it very well indeed.",0],["S4","sentence","There was nothing of high mark in this.",0],["S5","sentence","They were not a handsome family; they were not well dressed; their shoes were far from being waterproof; their clothes were scanty; and Peter might have known, and very likely did, the inside of a pawn-broker's. But they were happy, grateful, pleased with one another, and contented with the time; and when they faded, and looked happier yet in the bright sprinklings of the Spirit's torch at parting, Scrooge had his eye upon them, and especially on Tiny Tim, until the last.",0],["S6","sentence","By this time it was getting dark, and snowing pretty heavily; and as Scrooge and the Spirit went along the streets, the brightness of the roaring fires in kitchens, parlours, and all sorts of rooms was wonderful.",0],["S7","sentence","Here, the flickering of the blaze showed preparations for a cosy dinner, with hot plates baking through and through before the fire, and deep red curtains, ready to be drawn to shut out cold and darkness.",0],["S8","sentence","There, all the children of the house were running out into the snow to meet their married sisters, brothers, cousins, uncles, aunts, and be the first to greet them.",0],["S9","sentence","Here, again, were shadows on the window blinds of guests assembling; and there a group of handsome girls, all hooded and fur-booted, and all chattering at once, tripped lightly off to some near neighbour's house; where, woe upon the single man who saw them enter—artful witches, well they knew it—in a glow!",0],["S10","sentence","But, if you had judged from the numbers of people on their way to friendly gatherings, you might have thought that no one was at home to give them welcome when they got there, instead of every house expecting company, and piling up its fires half-chimney high.",0],["S11","sentence","Blessings on it, how the Ghost exulted!",0],["S12","sentence","How it bared its breadth of breast, and opened its capacious palm, and floated on, outpouring, with a generous hand, its bright and harmless mirth on everything within its reach!",0],["S13","sentence","The very lamp-lighter, who ran on before, dotting the dusky street with specks of light, and who was dressed to spend the evening somewhere, laughed out loudly as the Spirit passed, though little kenned the lamp-lighter that he",0]],"a-christmas-carol|L2:P14":[["S1","sentence","might be.",1],["S2","sentence","However, his offences carry their own punishment, and I have nothing to say against him.\"",0],["S3","sentence","\"I'm sure he is very rich, Fred,\" hinted Scrooge's niece.",0],["S4","sentence","\"At least, you always tell me so.\"",0],["S5","sentence","\"What of that, my dear?\" said Scrooge's nephew.",0],["S6","sentence","\"His wealth is of no use to him.",0],["S7","sentence","He don't do any good with it.",0],["S8","sentence","He don't make himself comfortable with it.",0],["S9","sentence","He hasn't the satisfaction of thinking—ha, ha, ha!—that he is ever going to benefit Us with it.\"",0],["S10","sentence","\"I have no patience with him,\" observed Scrooge's niece.",0],["S11","sentence","Scrooge's niece's sisters, and all the other ladies, expressed the same opinion.",0],["S12","sentence","\"Oh, I have!\" said Scrooge's nephew.",0],["S13","sentence","\"I am sorry for him; I couldn't be angry with him if I tried.",0],["S14","sentence","Who suffers by his ill whims?",0],["S15","sentence","Himself always.",0],["S16","sentence","Here he takes it into his head to dislike us, and he won't come and dine with us.",0],["S17","sentence","What's the consequence?",0],["S18","sentence","He don't lose much of a dinner.\"",0],["S19","sentence","\"Indeed, I think he loses a very good dinner,\" interrupted Scrooge's niece.",0],["S20","sentence","Everybody else said the same, and they must be allowed to have been competent judges, because they had just had dinner; and, with the dessert upon the table, were clustered round the fire, by lamp-light.",0],["S21","sentence","\"Well!",0],["S22","sentence","I am very glad to hear it,\" said Scrooge's nephew, \"because I haven't any great faith in these young housekeepers.",0],["S23","sentence","What do you say, Topper?\"",0],["S24","sentence","Topper had clearly got his eye upon one of Scrooge's niece's sisters, for he answered that a bachelor was a wretched outcast, who had no right to express an opinion on the subject.",0],["S25","sentence","Whereat Scrooge's niece's sister—the plump one with the lace tucker, not the one with the roses—blushed.",0],["S26","sentence","\"Do go on, Fred,\" said Scrooge's niece, clapping her hands.",0],["S27","sentence","\"He never finishes what he begins to say!",0],["S28","sentence","He is such a ridiculous fellow!\"",0],["S29","sentence","Scrooge's nephew revelled in another laugh, and, as it was impossible to keep the infection off, though the plump sister tried hard to do it with aromatic vinegar, his example was unanimously followed.",0],["S30","sentence","\"I was only going to say,\" said Scrooge's nephew, \"that the consequence of his taking a dislike to us, and not making merry with us, is, as I think, that he loses some pleasant moments, which could do him no harm.",0],["S31","sentence","I am sure he loses pleasanter companions than he can find in his own thoughts, either in his mouldy old office or his dusty chambers.",0],["S32","sentence","I mean to give him the same chance every year, whether he likes it or not, for I pity him.",0],["S33","sentence","He may rail at Christmas till he dies, but he can't help thinking better of it—I defy him—if he finds me going there in good temper, year after year, and saying, 'Uncle Scrooge, how are you?'",0],["S34","sentence","If it only puts him in the vein to leave his poor clerk fifty pounds, that's something; and I think I shook him yesterday.\"",0],["S35","sentence","It was their turn to laugh, now, at the notion of his shaking Scrooge.",0],["S36","sentence","But, being thoroughly",0]],"a-christmas-carol|L2:P19":[["S1","sentence","found that he could hardly stand when he prepared to follow it.",1],["S2","sentence","The Spirit paused a moment, as observing his condition, and giving him time to recover.",0],["S3","sentence","But Scrooge was all the worse for this.",0],["S4","sentence","It thrilled him with a vague uncertain horror to know that, behind the dusky shroud, there were ghostly eyes intently fixed upon him, while he, though he stretched his own to the utmost, could see nothing but a spectral hand and one great heap of black.",0],["S5","sentence","\"Ghost of the Future!\" he exclaimed, \"I fear you more than any spectre I have seen.",0],["S6","sentence","But, as I know your purpose is to do me good, and as I hope to live to be another man from what I was, I am prepared to bear you company, and do it with a thankful heart.",0],["S7","sentence","Will you not speak to me?\"",0],["S8","sentence","It gave him no reply.",0],["S9","sentence","The hand was pointed straight before them.",0],["S10","sentence","\"Lead on!\" said Scrooge.",0],["S11","sentence","\"Lead on!",0],["S12","sentence","The night is waning fast, and it is precious time to me, I know.",0],["S13","sentence","Lead on, Spirit!\"",0],["S14","sentence","The phantom moved away as it had come towards him.",0],["S15","sentence","Scrooge followed in the shadow of its dress, which bore him up, he thought, and carried him along.",0],["S16","sentence","They scarcely seemed to enter the City; for the City rather seemed to spring up about them, and encompass them of its own act.",0],["S17","sentence","But there they were in the heart of it; on 'Change, amongst the merchants; who hurried up and down, and chinked the money in their pockets, and conversed in groups, and looked at their watches, and trifled thoughtfully with their great gold seals; and so forth, as Scrooge had seen them often.",0],["S18","sentence","The Spirit stopped beside one little knot of business men.",0],["S19","sentence","Observing that the hand was pointed to them, Scrooge advanced to listen to their talk.",0],["S20","sentence","\"No,\" said a great fat man with a monstrous chin, \"I don't know much about it either way.",0],["S21","sentence","I only know he's dead.\"",0],["S22","sentence","\"When did he die?\" inquired another.",0],["S23","sentence","\"Last night, I believe.\"",0],["S24","sentence","\"Why, what was the matter with him?\" asked a third, taking a vast quantity of snuff out of a very large snuff-box.",0],["S25","sentence","\"I thought he'd never die.\"",0],["S26","sentence","\"God knows,\" said the first with a yawn.",0],["S27","sentence","\"What has he done with his money?\" asked a red-faced gentleman with a pendulous excrescence on the end of his nose, that shook like the gills of a turkey-cock.",0],["S28","sentence","\"I haven't heard,\" said the man with the large chin, yawning again.",0],["S29","sentence","\"Left it to his company, perhaps.",0],["S30","sentence","He hasn't left it to me.",0],["S31","sentence","That's all I know.\"",0],["S32","sentence","This pleasantry was received with a general laugh.",0],["S33","sentence","\"It's likely to be a very cheap funeral,\" said the same speaker; \"for, upon my life, I don't know of anybody to go to it.",0],["S34","sentence","Suppose we make up a party, and volunteer?\"",0],["S35","sentence","\"I don't mind going if a lunch is provided,\" observed the gentleman with the excrescence on his nose.",0],["S36","sentence","\"But I must be fed if I make one.\"",0],["S37","sentence","Another",0]],"a-christmas-carol|L2:P20":[["S1","sentence","laugh.",1],["S2","sentence","\"Well, I am the most disinterested among you, after all,\" said the first speaker, \"for I never wear black gloves, and I never eat lunch.",0],["S3","sentence","But I'll offer to go if anybody else will.",0],["S4","sentence","When I come to think of it, I'm not at all sure that I wasn't his most particular friend; for we used to stop and speak whenever we met.",0],["S5","sentence","Bye, bye!\"",0],["S6","sentence","Speakers and listeners strolled away, and mixed with other groups.",0],["S7","sentence","Scrooge knew the men, and looked towards the Spirit for an explanation.",0],["S8","sentence","The Phantom glided on into a street.",0],["S9","sentence","Its finger pointed to two persons meeting.",0],["S10","sentence","Scrooge listened again, thinking that the explanation might lie here.",0],["S11","sentence","He knew these men, also, perfectly.",0],["S12","sentence","They were men of business: very wealthy, and of great importance.",0],["S13","sentence","He had made a point always of standing well in their esteem: in a business point of view, that is; strictly in a business point of view.",0],["S14","sentence","\"How are you?\" said one.",0],["S15","sentence","\"How are you?\" returned the other.",0],["S16","sentence","\"Well!\" said the first.",0],["S17","sentence","\"Old Scratch has got his own at last, hey?\"",0],["S18","sentence","\"So I am told,\" returned the second.",0],["S19","sentence","\"Cold, isn't it?\"",0],["S20","sentence","\"Seasonable for Christmas-time.",0],["S21","sentence","You are not a skater, I suppose?\"",0],["S22","sentence","\"No. No. Something else to think of.",0],["S23","sentence","Good morning!\"",0],["S24","sentence","Not another word.",0],["S25","sentence","That was their meeting, their conversation, and their parting.",0],["S26","sentence","Scrooge was at first inclined to be surprised that the Spirit should attach importance to conversations apparently so trivial; but, feeling assured that they must have some hidden purpose, he set himself to consider what it was likely to be.",0],["S27","sentence","They could scarcely be supposed to have any bearing on the death of Jacob, his old partner, for that was Past, and this Ghost's province was the Future.",0],["S28","sentence","Nor could he think of any one immediately connected with himself, to whom he could apply them.",0],["S29","sentence","But nothing doubting that, to whomsoever they applied, they had some latent moral for his own improvement, he resolved to treasure up every word he heard, and everything he saw; and especially to observe the shadow of himself when it appeared.",0],["S30","sentence","For he had an expectation that the conduct of his future self would give him the clue he missed, and would render the solution of these riddles easy.",0],["S31","sentence","He looked about in that very place for his own image, but another man stood in his accustomed corner, and, though the clock pointed to his usual time of day for being there, he saw no likeness of himself among the multitudes that poured in through the Porch.",0],["S32","sentence","It gave him little surprise, however; for he had been revolving in his mind a change of life, and thought and hoped he saw his new-born resolutions carried out in this.",0],["S33","sentence","Quiet and dark, beside him stood the Phantom, with its outstretched hand.",0],["S34","sentence","When he roused himself from his thoughtful quest, he fancied, from the turn of the hand, and its situation in reference to himself, that the Unseen Eyes were looking at him keenly.",0],["S35","sentence","It made",0]],"a-christmas-carol|L2:P22":[["S1","sentence","the woman who had already spoken threw her bundle on the floor, and sat down in a flaunting manner on a stool; crossing her elbows on her knees, and looking with a bold defiance at the other two.",1],["S2","sentence","\"What odds, then?",0],["S3","sentence","What odds, Mrs. Dilber?\" said the woman.",0],["S4","sentence","\"Every person has a right to take care of themselves.",0],["S5","sentence","He always did!\"",0],["S6","sentence","\"That's true, indeed!\" said the laundress.",0],["S7","sentence","\"No man more so.\"",0],["S8","sentence","\"Why, then, don't stand staring as if you was afraid, woman!",0],["S9","sentence","Who's the wiser?",0],["S10","sentence","We're not going to pick holes in each other's coats, I suppose?\"",0],["S11","sentence","\"No, indeed!\" said Mrs. Dilber and the man together.",0],["S12","sentence","\"We should hope not.\"",0],["S13","sentence","\"Very well, then!\" cried the woman.",0],["S14","sentence","\"That's enough.",0],["S15","sentence","Who's the worse for the loss of a few things like these?",0],["S16","sentence","Not a dead man, I suppose?\"",0],["S17","sentence","\"No, indeed,\" said Mrs. Dilber, laughing.",0],["S18","sentence","\"If he wanted to keep 'em after he was dead, a wicked old screw,\" pursued the woman, \"why wasn't he natural in his lifetime?",0],["S19","sentence","If he had been, he'd have had somebody to look after him when he was struck with Death, instead of lying gasping out his last there, alone by himself.\"",0],["S20","sentence","\"It's the truest word that ever was spoke,\" said Mrs. Dilber, \"It's a judgment on him.\"",0],["S21","sentence","\"I wish it was a little heavier judgment,\" replied the woman; \"and it should have been, you may depend upon it, if I could have laid my hands on anything else.",0],["S22","sentence","Open that bundle, old Joe, and let me know the value of it.",0],["S23","sentence","Speak out plain.",0],["S24","sentence","I'm not afraid to be the first, nor afraid for them to see it.",0],["S25","sentence","We knew pretty well that we were helping ourselves before we met here, I believe.",0],["S26","sentence","It's no sin.",0],["S27","sentence","Open the bundle, Joe.\"",0],["S28","sentence","But the gallantry of her friends would not allow of this; and the man in faded black, mounting the breach first, produced his plunder.",0],["S29","sentence","It was not extensive.",0],["S30","sentence","A seal or two, a pencil-case, a pair of sleeve-buttons, and a brooch of no great value, were all.",0],["S31","sentence","They were severally examined and appraised by old Joe, who chalked the sums he was disposed to give for each upon the wall, and added them up into a total when he found that there was nothing more to come.",0],["S32","sentence","\"That's your account,\" said Joe, \"and I wouldn't give another sixpence, if I was to be boiled for not doing it.",0],["S33","sentence","Who's next?\"",0],["S34","sentence","Mrs. Dilber was next.",0],["S35","sentence","Sheets and towels, a little wearing apparel, two old-fashioned silver tea-spoons, a pair of sugar-tongs, and a few boots.",0],["S36","sentence","Her account was stated on the wall in the same manner.",0],["S37","sentence","\"I always give too much to ladies.",0],["S38","sentence","It's a weakness of mine, and that's the way I ruin myself,\" said old Joe.",0],["S39","sentence","\"That's your account.",0],["S40","sentence","If you asked me for another penny, and made it an open question, I'd repent of being so liberal, and knock off half-a-crown.\"",0],["S41","sentence","\"And now undo my bundle, Joe,\" said the first woman.",0],["S42","sentence","Joe went down on",0]],"a-christmas-carol|L2:P23":[["S1","sentence","his knees for the greater convenience of opening it, and, having unfastened a great many knots, dragged out a large heavy roll of some dark stuff.",1],["S2","sentence","\"What do you call this?\" said Joe.",0],["S3","sentence","\"Bed-curtains?\"",0],["S4","sentence","\"Ah!\" returned the woman, laughing and leaning forward on her crossed arms.",0],["S5","sentence","\"Bed-curtains!\"",0],["S6","sentence","\"You don't mean to say you took 'em down, rings and all, with him lying there?\" said Joe.",0],["S7","sentence","\"Yes, I do,\" replied the woman.",0],["S8","sentence","\"Why not?\"",0],["S9","sentence","\"You were born to make your fortune,\" said Joe, \"and you'll certainly do it.\"",0],["S10","sentence","\"I certainly shan't hold my hand, when I can get anything in it by reaching it out, for the sake of such a man as He was, I promise you, Joe,\" returned the woman coolly.",0],["S11","sentence","\"Don't drop that oil upon the blankets, now.\"",0],["S12","sentence","\"His blankets?\" asked Joe.",0],["S13","sentence","\"Whose else's do you think?\" replied the woman.",0],["S14","sentence","\"He isn't likely to take cold without 'em, I dare say.\"",0],["S15","sentence","\"I hope he didn't die of anything catching?",0],["S16","sentence","Eh?\" said old Joe, stopping in his work, and looking up.",0],["S17","sentence","\"Don't you be afraid of that,\" returned the woman.",0],["S18","sentence","\"I an't so fond of his company that I'd loiter about him for such things, if he did.",0],["S19","sentence","Ah!",0],["S20","sentence","You may look through that shirt till your eyes ache; but you won't find a hole in it, nor a threadbare place.",0],["S21","sentence","It's the best he had, and a fine one too.",0],["S22","sentence","They'd have wasted it, if it hadn't been for me.\"",0],["S23","sentence","\"What do you call wasting of it?\" asked old Joe.",0],["S24","sentence","\"Putting it on him to be buried in, to be sure,\" replied the woman with a laugh.",0],["S25","sentence","\"Somebody was fool enough to do it, but I took it off again.",0],["S26","sentence","If calico an't good enough for such a purpose, it isn't good enough for anything.",0],["S27","sentence","It's quite as becoming to the body.",0],["S28","sentence","He can't look uglier than he did in that one.\"",0],["S29","sentence","Scrooge listened to this dialogue in horror.",0],["S30","sentence","As they sat grouped about their spoil, in the scanty light afforded by the old man's lamp, he viewed them with a detestation and disgust which could hardly have been greater, though they had been obscene demons, marketing the corpse itself.",0],["S31","sentence","\"Ha, ha!\" laughed the same woman when old Joe, producing a flannel bag with money in it, told out their several gains upon the ground.",0],["S32","sentence","\"This is the end of it, you see!",0],["S33","sentence","He frightened every one away from him when he was alive, to profit us when he was dead!",0],["S34","sentence","Ha, ha, ha!\"",0],["S35","sentence","\"Spirit!\" said Scrooge, shuddering from head to foot.",0],["S36","sentence","\"I see, I see.",0],["S37","sentence","The case of this unhappy man might be my own.",0],["S38","sentence","My life tends that way now.",0],["S39","sentence","Merciful Heaven, what is this?\"",0],["S40","sentence","He recoiled in terror, for the scene had changed, and now he almost touched a bed: a bare, uncurtained bed: on which, beneath a ragged sheet, there lay a something covered up, which, though it was dumb, announced itself in awful language.",0],["S41","sentence","The room was very dark, too dark to be",0]],"a-christmas-carol|L2:P24":[["S1","sentence","observed with any accuracy, though Scrooge glanced round it in obedience to a secret impulse, anxious to know what kind of room it was.",1],["S2","sentence","A pale light, rising in the outer air, fell straight upon the bed: and on it, plundered and bereft, unwatched, unwept, uncared for, was the body of this man.",0],["S3","sentence","Scrooge glanced towards the Phantom.",0],["S4","sentence","Its steady hand was pointed to the head.",0],["S5","sentence","The cover was so carelessly adjusted that the slightest raising of it, the motion of a finger upon Scrooge's part, would have disclosed the face.",0],["S6","sentence","He thought of it, felt how easy it would be to do, and longed to do it; but had no more power to withdraw the veil than to dismiss the spectre at his side.",0],["S7","sentence","Oh, cold, cold, rigid, dreadful Death, set up thine altar here, and dress it with such terrors as thou hast at thy command: for this is thy dominion!",0],["S8","sentence","But of the loved, revered, and honoured head thou canst not turn one hair to thy dread purposes, or make one feature odious.",0],["S9","sentence","It is not that the hand is heavy, and will fall down when released; it is not that the heart and pulse are still; but that the hand WAS open, generous, and true; the heart brave, warm, and tender; and the pulse a man's. Strike, Shadow, strike!",0],["S10","sentence","And see his good deeds springing from the wound, to sow the world with life immortal!",0],["S11","sentence","No voice pronounced these words in Scrooge's ears, and yet he heard them when he looked upon the bed.",0],["S12","sentence","He thought, if this man could be raised up now, what would be his foremost thoughts?",0],["S13","sentence","Avarice, hard dealing, griping cares?",0],["S14","sentence","They have brought him to a rich end, truly!",0],["S15","sentence","He lay, in the dark, empty house, with not a man, a woman, or a child to say he was kind to me in this or that, and for the memory of one kind word I will be kind to him.",0],["S16","sentence","A cat was tearing at the door, and there was a sound of gnawing rats beneath the hearth-stone.",0],["S17","sentence","What they wanted in the room of death, and why they were so restless and disturbed, Scrooge did not dare to think.",0],["S18","sentence","\"Spirit!\" he said, \"this is a fearful place.",0],["S19","sentence","In leaving it, I shall not leave its lesson, trust me.",0],["S20","sentence","Let us go!\"",0],["S21","sentence","Still the Ghost pointed with an unmoved finger to the head.",0],["S22","sentence","\"I understand you,\" Scrooge returned, \"and I would do it if I could.",0],["S23","sentence","But I have not the power, Spirit.",0],["S24","sentence","I have not the power.\"",0],["S25","sentence","Again it seemed to look upon him.",0],["S26","sentence","\"If there is any person in the town who feels emotion caused by this man's death,\" said Scrooge, quite agonised, \"show that person to me, Spirit!",0],["S27","sentence","I beseech you.\"",0],["S28","sentence","The Phantom spread its dark robe before him for a moment, like a wing; and, withdrawing it, revealed a room by daylight, where a mother and her children were.",0],["S29","sentence","She was expecting some one, and with anxious",0]],"a-christmas-carol|L3:P1":[["S1","sentence","eagerness; for she walked up and down the room; started at every sound; looked out from the window; glanced at the clock; tried, but in vain, to work with her needle; and could hardly bear the voices of her children in their play.",1],["S2","sentence","At length the long-expected knock was heard.",0],["S3","sentence","She hurried to the door, and met her husband; a man whose face was careworn and depressed, though he was young.",0],["S4","sentence","There was a remarkable expression in it now; a kind of serious delight of which he felt ashamed, and which he struggled to repress.",0],["S5","sentence","He sat down to the dinner that had been hoarding for him by the fire, and, when she asked him faintly what news (which was not until after a long silence), he appeared embarrassed how to answer.",0],["S6","sentence","\"Is it good,\" she said, \"or bad?\" to help him.",0],["S7","sentence","\"Bad,\" he answered.",0],["S8","sentence","\"We are quite ruined?\"",0],["S9","sentence","\"No. There is hope yet, Caroline.\"",0],["S10","sentence","\"If he relents,\" she said, amazed, \"there is!",0],["S11","sentence","Nothing is past hope, if such a miracle has happened.\"",0],["S12","sentence","\"He is past relenting,\" said her husband.",0],["S13","sentence","\"He is dead.\"",0],["S14","sentence","She was a mild and patient creature, if her face spoke truth; but she was thankful in her soul to hear it, and she said so with clasped hands.",0],["S15","sentence","She prayed forgiveness the next moment, and was sorry; but the first was the emotion of her heart.",0],["S16","sentence","\"What the half-drunken woman, whom I told you of last night, said to me when I tried to see him and obtain a week's delay, and what I thought was a mere excuse to avoid me, turns out to have been quite true.",0],["S17","sentence","He was not only very ill, but dying, then.\"",0],["S18","sentence","\"To whom will our debt be transferred?\"",0],["S19","sentence","\"I don't know.",0],["S20","sentence","But, before that time, we shall be ready with the money; and, even though we were not, it would be bad fortune indeed to find so merciless a creditor in his successor.",0],["S21","sentence","We may sleep to-night with light hearts, Caroline!\"",0],["S22","sentence","Yes.",0],["S23","sentence","Soften it as they would, their hearts were lighter.",0],["S24","sentence","The children's faces, hushed and clustered round to hear what they so little understood, were brighter; and it was a happier house for this man's death!",0],["S25","sentence","The only emotion that the Ghost could show him, caused by the event, was one of pleasure.",0],["S26","sentence","\"Let me see some tenderness connected with a death,\" said Scrooge; \"or that dark chamber, Spirit, which we left just now, will be for ever present to me.\"",0],["S27","sentence","The Ghost conducted him through several streets familiar to his feet; and, as they went along, Scrooge looked here and there to find himself, but nowhere was he to be seen.",0],["S28","sentence","They entered poor Bob Cratchit's house,—the dwelling he had visited before,—and found the mother and the children seated round the fire.",0],["S29","sentence","Quiet.",0],["S30","sentence","Very quiet.",0],["S31","sentence","The noisy little Cratchits were as still as statues in one corner, and sat looking up at Peter, who had a book before him.",0],["S32","sentence","The mother and her daughters were engaged in",0]],"a-christmas-carol|L3:P2":[["S1","sentence","sewing.",1],["S2","sentence","But surely they were very quiet!",0],["S3","sentence","\"'And he took a child, and set him in the midst of them.'\"",0],["S4","sentence","Where had Scrooge heard those words?",0],["S5","sentence","He had not dreamed them.",0],["S6","sentence","The boy must have read them out, as he and the Spirit crossed the threshold.",0],["S7","sentence","Why did he not go on?",0],["S8","sentence","The mother laid her work upon the table, and put her hand up to her face.",0],["S9","sentence","\"The colour hurts my eyes,\" she said.",0],["S10","sentence","The colour?",0],["S11","sentence","Ah, poor Tiny Tim!",0],["S12","sentence","\"They're better now again,\" said Cratchit's wife.",0],["S13","sentence","\"It makes them weak by candle-light; and I wouldn't show weak eyes to your father, when he comes home, for the world.",0],["S14","sentence","It must be near his time.\"",0],["S15","sentence","\"Past it rather,\" Peter answered, shutting up his book.",0],["S16","sentence","\"But I think he has walked a little slower than he used, these few last evenings, mother.\"",0],["S17","sentence","They were very quiet again.",0],["S18","sentence","At last she said, and in a steady, cheerful voice, that only faltered once:\n\"I have known him walk with—I have known him walk with Tiny Tim upon his shoulder very fast indeed.\"",0],["S19","sentence","\"And so have I,\" cried Peter.",0],["S20","sentence","\"Often.\"",0],["S21","sentence","\"And so have I,\" exclaimed another.",0],["S22","sentence","So had all.",0],["S23","sentence","\"But he was very light to carry,\" she resumed, intent upon her work, \"and his father loved him so, that it was no trouble: no trouble.",0],["S24","sentence","And there is your father at the door!\"",0],["S25","sentence","She hurried out to meet him; and little Bob in his comforter—he had need of it, poor fellow—came in.",0],["S26","sentence","His tea was ready for him on the hob, and they all tried who should help him to it most.",0],["S27","sentence","Then the two young Cratchits got upon his knees, and laid, each child, a little cheek against his face, as if they sa
