-dr-jekyll-and-mr-hyde","level":1,"page":3,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P3","type":"Vocab","question":"As used in this excerpt, \"stiff\" most nearly means","options":["fixed","large","rigid","formal"],"option_sids":null,"answer":1,"highlight":["S21"],"target":"stiff","evidence":["S21"],"why_en":"Reading 'stiff' in its common sense of \"rigid\" derails the discussion of money; only by connecting it to the following 'good for more than that' does the sense \"a large sum\" emerge.","method":"raw","spec":"v1","no":4},{"item_id":"gen1-the-strange--L1P3-kg-Evidence","uid":"1c37fe8359","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":3,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P3","type":"Evidence","question":"Which sentence from the passage best supports the claim that simply seeing the man was enough to stir a violent urge in everyone present, even an outsider to the accident?","options":["He was perfectly cool and made no resistance, but gave me one look, so ugly that it brought out the sweat on me like running.","I had taken a loathing to my gentleman at first sight.","Well, sir, he was like the rest of us; every time he looked at my prisoner, I saw that Sawbones turn sick and white with the desire to kill him.","I never saw a circle of such hateful faces; and there was the man in the middle, with a kind of black sneering coolness—frightened too, I could see that—but carrying it off, sir, really like Satan."],"option_sids":["S2","S6","S10","S15"],"answer":2,"highlight":["S2","S6","S10","S15"],"target":null,"evidence":["S10"],"why_en":"Given the interpretation that merely seeing the man stirs a violent impulse in everyone, even those with no connection to the incident, the item asks whether students can choose the evidence that contains \"merely seeing,\" \"everyone,\" and \"violent impulse\" all in one sentence.","method":"kg","spec":"v1","no":5},{"item_id":"gen1-the-strange--L1P3-raw-Evidence","uid":"808c49c919","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":3,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P3","type":"Evidence","question":"Which sentence from the passage best supports the claim that the men's actions against Hyde are a substitute for what they truly wish to do to him?","options":["Well, sir, he was like the rest of us; every time he looked at my prisoner, I saw that Sawbones turn sick and white with the desire to kill him.","I knew what was in his mind, just as he knew what was in mine; and killing being out of the question, we did the next best.","We told the man we could and would make such a scandal out of this as should make his name stink from one end of London to the other.","And all the time, as we were pitching it in red hot, we were keeping the women off him as best we could for they were as wild as harpies."],"option_sids":["S10","S11","S12","S14"],"answer":1,"highlight":["S10","S11","S12","S14"],"target":null,"evidence":["S11"],"why_en":"The item asks whether students can locate support for the reading that the bystanders' threats are a second-best substitute for the wish to kill, in S11 ('killing being out of the question, we did the next best'), which makes that link directly.","method":"raw","spec":"v1","no":6},{"item_id":"gen1-the-strange--L1P4-raw-Analysis","uid":"48f0a03ab7","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":4,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P4","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Enfield avoids questions only here, to protect the good name of the cheque's signer.","Enfield thinks one question can spread, but it only hurts the person who did wrong.","Enfield avoids questions because one question can spread and hurt someone nobody suspected.","Enfield avoids questions because asking them could drag him into the scandal himself."],"option_sids":null,"answer":2,"highlight":["S19","S20","S21","S22","S23"],"target":null,"evidence":["S21","S22","S23"],"why_en":"Only by unpacking the image of a stone rolled down a hill that knocks over others does Enfield's rule of 'not asking' reveal itself as a way of preventing a scandal that might spread to unexpected, innocent people. That makes this a good spot to measure the ability to read meaning beneath the surface.","method":"raw","spec":"v1","no":7},{"item_id":"gen1-the-strange--L1P4-kg-Analysis","uid":"a8293826f7","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":4,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P4","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Enfield won't ask, because questions would hurt the cheque writer he knows; Utterson agrees.","Enfield won't ask, because one question can spread and hurt someone unexpected; Utterson agrees.","Enfield won't ask, because a question could pull him into a scandal; Utterson agrees.","Enfield won't ask, because asking questions is simply bad manners; Utterson agrees."],"option_sids":null,"answer":1,"highlight":["S19","S20","S21","S22","S23","S24"],"target":null,"evidence":["S21","S22","S23"],"why_en":"Measures whether students, reading the image of the rolling stone and the story of the old gentleman \"one would never have thought of,\" can see that Enfield refrains from asking because a single question could spread beyond control and ruin the good name of an unsuspecting person.","method":"kg","spec":"v1","no":8},{"item_id":"gen1-the-strange--L1P5-raw-Evidence","uid":"23c530b423","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":5,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P5","type":"Evidence","question":"Which sentence from the passage best supports the claim that Utterson knows more about the people in Enfield's story than Enfield realized?","options":["Mr. Utterson again walked some way in silence and obviously under a weight of consideration.","“Yes, I know,” said Utterson; “I know it must seem strange.","The fact is, if I do not ask you the name of the other party, it is because I know it already.","Mr. Utterson sighed deeply but said never a word; and the young man presently resumed."],"option_sids":["S17","S20","S21","S28"],"answer":2,"highlight":["S17","S20","S21","S28"],"target":null,"evidence":["S21"],"why_en":"Utterson questions Enfield as if hearing the story for the first time, but he already knows the person involved. The item measures whether students can find the sentence that reveals this knowledge directly, without being drawn to gestures of worry or to words like \"know.\"","method":"raw","spec":"v1","no":9},{"item_id":"gen1-the-strange--L1P5-kg-Evidence","uid":"ed714f4144","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":5,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P5","type":"Evidence","question":"Which sentence from the passage best supports the claim that Enfield's distaste for Hyde goes far beyond any reason he is able to give for it?","options":["There is something wrong with his appearance; something displeasing, something down-right detestable.","I never saw a man I so disliked, and yet I scarce know why.","He must be deformed somewhere; he gives a strong feeling of deformity, although I couldn’t specify the point.","No, sir; I can make no hand of it; I can’t describe him."],"option_sids":["S11","S12","S13","S15"],"answer":1,"highlight":["S11","S12","S13","S15"],"target":null,"evidence":["S12"],"why_en":"Students must defend with evidence the interpretation that Enfield's feeling far outweighs his reasons. Against sentences that show only the intensity of his loathing, or that say only that he cannot describe it, they must identify the evidence that captures both the size of the feeling and its lack of reason in a single sentence.","method":"kg","spec":"v1","no":10},{"item_id":"gen1-the-strange--L1P7-kg-Evidence","uid":"193c8d6d6f","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":7,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P7","type":"Evidence","question":"Which sentence from the passage best supports the claim that Utterson had been afraid that the falling-out between the two old friends hid something darker?","options":["He began to go wrong, wrong in mind; and though of course I continue to take an interest in him for old sake’s sake, as they say, I see and I have seen devilish little of the man.","“They have only differed on some point of science,” he thought; and being a man of no scientific passions (except in the matter of conveyancing), he even added: “It is nothing worse than that!”","That was the amount of information that the lawyer carried back with him to the great, dark bed on which he tossed to and fro, until the small hours of the morning began to grow large.","It was a night of little ease to his toiling mind, toiling in mere darkness and besieged by questions."],"option_sids":["S8","S11","S17","S18"],"answer":1,"highlight":["S8","S11","S17","S18"],"target":null,"evidence":["S11"],"why_en":"Looks at whether students can read, in Utterson's exclamation that it is nothing worse than that, the hidden feeling that he had already been fearing something worse.","method":"kg","spec":"v1","no":11},{"item_id":"gen1-the-strange--L1P8-raw-Vocab","uid":"e5c7e3628a","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":8,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P8","type":"Vocab","question":"As used in this excerpt, \"rumour\" most nearly means","options":["sound","fear","shadow","gossip"],"option_sids":null,"answer":0,"highlight":["S12"],"target":"rumour","evidence":["S12","S11"],"why_en":"Reading 'rumour' in its common sense of \"gossip\" derails the sentence; only the surrounding context, small noises carrying far through a silent night street, yields the sense \"sound.\"","method":"raw","spec":"v1","no":12},{"item_id":"gen1-the-strange--L1P8-kg-Vocab","uid":"47bf8549e0","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":8,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P8","type":"Vocab","question":"As used in this excerpt, \"rumour\" most nearly means","options":["sound","hint","gossip","warning"],"option_sids":null,"answer":0,"highlight":["S12"],"target":"rumour","evidence":["S12"],"why_en":"The sentence seems to make sense even with the common meaning \"gossip.\" But only by reading the immediately preceding context, a hushed street where small sounds carry far, does the meaning \"sound\" emerge.","method":"kg","spec":"v1","no":13},{"item_id":"gen1-the-strange--L1P9-kg-Craft","uid":"8482119c36","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":9,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P9","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shows Hyde openly mocking the lawyer's polite scolding as silly.","It makes Hyde's exit feel like a quick escape from being caught.","It shows Hyde covering his earlier fear with a tough, bold act.","It makes Hyde's anger sound like a wild animal's, not a person's."],"option_sids":null,"answer":3,"highlight":["S32"],"target":"The other snarled aloud into a savage laugh","evidence":["S32","S31"],"why_en":"Asks whether students read how the sound description that renders the laugh as a \"snarl\" and \"savage\" makes Hyde feel closer to a beast than a man.","method":"kg","spec":"v1","no":14},{"item_id":"gen1-the-strange--L1P9-raw-Craft","uid":"8369b93e22","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":9,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P9","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shows Hyde laughing to hide the fear he felt earlier","It shows Hyde enjoying his win after catching Utterson's lie","It makes Hyde seem more like a wild animal than a man","It warns readers that Hyde is about to attack Utterson"],"option_sids":null,"answer":2,"highlight":["S32"],"target":"snarled aloud into a savage laugh","evidence":["S32","S31","S29"],"why_en":"The laugh is rendered in animal words, 'snarled' and 'savage,' and the item asks students to read how that detail makes Hyde seem closer to a beast than a man.","method":"raw","spec":"v1","no":15},{"item_id":"gen1-the-strange--L1P10-kg-Analysis","uid":"44fad0509f","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":10,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P10","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Utterson feels sorry for Hyde and worries that Jekyll will treat his new friend unkindly.","Utterson calmly lists clear facts about Hyde's looks to show that Hyde is a bad man.","Utterson decides that Hyde looks like a cave dweller, so he is primitive rather than evil.","Unable to explain his disgust, Utterson concludes that something evil inside Hyde shows on the outside."],"option_sids":null,"answer":3,"highlight":["S2","S3","S4","S5","S6"],"target":null,"evidence":["S3","S5","S6"],"why_en":"The line of thought in which an ever-rational lawyer, unable to put his loathing into words, fumbles through several explanations before concluding that evil shows through on the surface is not written directly into the dialogue; it is meaning that must be read out of it.","method":"kg","spec":"v1","no":16},{"item_id":"gen1-the-strange--L1P11-raw-Vocab","uid":"483470a400","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":11,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P11","type":"Vocab","question":"As used in this excerpt, \"dry\" most nearly means","options":["sharp and witty","cold and unfriendly","dull and boring","quiet and serious"],"option_sids":null,"answer":3,"highlight":["S21"],"target":"dry","evidence":["S21"],"why_en":"Reading 'dry' in the senses commonly applied to people (witty, dull, cold) goes astray here. Students must read Utterson's quiet, serious temperament, set against the excitable, talkative guests, to see why the hosts want him to stay.","method":"raw","spec":"v1","no":17},{"item_id":"gen1-the-strange--L1P11-kg-Vocab","uid":"1426aa9d48","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":11,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P11","type":"Vocab","question":"As used in this excerpt, \"dry\" most nearly means","options":["free of alcohol","quiet and serious","thin and wiry","dull and boring"],"option_sids":null,"answer":1,"highlight":["S21"],"target":"dry","evidence":["S21"],"why_en":"'Dry' is easily read as \"parched\" or \"dull,\" but the context, in which guests deliberately want to keep him with them, yields the meaning of a calm temperament that does not show its feelings.","method":"kg","spec":"v1","no":18},{"item_id":"gen1-the-strange--L1P12-raw-Analysis","uid":"330248ad3b","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":12,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P12","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Jekyll is grateful for the offer but annoyed that Utterson raised Hyde again","Jekyll trusts Utterson more than himself, so he accepts Utterson's help with Hyde","Jekyll promises to drop Hyde right away so that Utterson will stop worrying","Jekyll's warm thanks politely hide his refusal to explain his tie to Hyde"],"option_sids":null,"answer":3,"highlight":["S24","S25","S26"],"target":null,"evidence":["S24","S25","S26"],"why_en":"Effusively grateful, affectionate words wrap a refusal to explain the relationship with Hyde. Because the words and the intent diverge, the passage can measure the ability to read beneath the surface.","method":"raw","spec":"v1","no":19},{"item_id":"gen1-the-strange--L1P12-kg-Analysis","uid":"916e64312f","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":12,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P12","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Jekyll resents Utterson's questions, so he coldly turns down the lawyer's offer of help.","Jekyll trusts Utterson fully, so he lets the lawyer take charge of the Hyde problem.","Jekyll is upset about Hyde, but he truly thinks the problem is not very serious.","Jekyll avoids explaining his troubling situation, yet insists he can end it whenever he chooses."],"option_sids":null,"answer":3,"highlight":["S19","S20","S21","S22","S23","S24","S25"],"target":null,"evidence":["S19","S20","S21","S25"],"why_en":"This spot looks at whether students can read the contradiction in Jekyll's avoiding explanation, claiming his situation cannot be put into words, while insisting he can be rid of Hyde at any moment.","method":"kg","spec":"v1","no":20},{"item_id":"gen1-the-strange--L1P13-raw-Vocab","uid":"f8da57e8e3","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":13,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P13","type":"Vocab","question":"As used in this excerpt, \"accosted\" most nearly means","options":["begged money from","stopped and challenged","greeted and spoke to","praised and flattered"],"option_sids":null,"answer":2,"highlight":["S16"],"target":"accosted","evidence":["S16","S17"],"why_en":"Reading the word in its common modern sense (\"to approach aggressively and confront\") reverses the old gentleman's courtesy and Hyde's ensuing outburst, so students need the word's exact meaning to read the contrast in the scene.","method":"raw","spec":"v1","no":21},{"item_id":"gen1-the-strange--L1P13-kg-Vocab","uid":"5026a85e84","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":13,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P13","type":"Vocab","question":"As used in this excerpt, \"accosted\" most nearly means","options":["walked past","argued with","spoke to","rudely stopped"],"option_sids":null,"answer":2,"highlight":["S16"],"target":"accosted","evidence":["S16","S17"],"why_en":"Reading 'accosted' by its common impression as \"confronted aggressively\" makes it seem the old gentleman was rude first; only reading it as a polite approach reveals that Hyde's rage was unprovoked.","method":"kg","spec":"v1","no":22},{"item_id":"gen1-the-strange--L1P15-raw-Evidence","uid":"f0579a3c0b","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":15,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P15","type":"Evidence","question":"Which sentence from the passage best supports the claim that Hyde's housekeeper feels no loyalty toward him?","options":["She had an evil face, smoothed by hypocrisy: but her manners were excellent.","A flash of odious joy appeared upon the woman’s face.","What has he done?”","“He don’t seem a very popular character,” observed the latter."],"option_sids":["S7","S11","S13","S15"],"answer":1,"highlight":["S7","S11","S13","S15"],"target":null,"evidence":["S11"],"why_en":"Students infer, in one step, from the maid's delight at the arrival of the police that she has no loyalty to her master, and must distinguish that evidence from another character's guess, a description of appearance, and a question that only looks like concern.","method":"raw","spec":"v1","no":23},{"item_id":"gen1-the-strange--L1P17-raw-Vocab","uid":"ae81877ffb","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":17,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P17","type":"Vocab","question":"As used in this excerpt, \"character\" most nearly means","options":["reputation","honesty","role","personality"],"option_sids":null,"answer":0,"highlight":["S25"],"target":"character","evidence":["S25"],"why_en":"Read in its common sense (personality, or a person in a story), the word causes students to miss the core of this page: Jekyll worries more about his own reputation than about the culprit, the 'selfishness' that startles Utterson.","method":"raw","spec":"v1","no":24},{"item_id":"gen1-the-strange--L1P17-kg-Vocab","uid":"55f235a960","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":17,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P17","type":"Vocab","question":"As used in this excerpt, \"character\" most nearly means","options":["reputation","role","honesty","personality"],"option_sids":null,"answer":0,"highlight":["S25"],"target":"character","evidence":["S24","S25"],"why_en":"The item asks about this spot because reading the word in its common sense of \"personality\" misses the heart of the page: Jekyll worries about his standing in the world before he worries about Hyde.","method":"kg","spec":"v1","no":25},{"item_id":"gen1-the-strange--L1P18-kg-Craft","uid":"1fd1d44c23","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":18,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P18","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shows Jekyll admitting the truth while too shaken to say it aloud.","It shows Jekyll feels physically sick, too weak and dizzy to speak.","It shows Jekyll staying quiet to keep Hyde safe from the lawyer's questions.","It shows Jekyll admitting the truth but angry at Utterson for asking it."],"option_sids":null,"answer":0,"highlight":["S9"],"target":"he shut his mouth tight and nodded","evidence":["S8","S9","S10"],"why_en":"Students must read whether what Jekyll leaves unsaid, pressing his lips together and only nodding, reveals both acknowledgment and a fear he cannot voice, distinguishing it from other emotions and motives that look similar.","method":"kg","spec":"v1","no":26},{"item_id":"gen1-the-strange--L1P18-raw-Craft","uid":"0f10bbc3a4","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":18,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P18","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["Jekyll answers without a word, showing he fears Hyde might overhear him.","Jekyll answers with a nod, showing he is simply too weak to talk.","Jekyll answers with a nod, showing he is trying to keep the truth from Utterson.","Jekyll answers without a word, showing how painful it is to admit the truth."],"option_sids":null,"answer":3,"highlight":["S9"],"target":"he shut his mouth tight and nodded","evidence":["S8","S9"],"why_en":"Instead of speaking, Jekyll presses his lips shut and only nods, admitting the fact while avoiding saying it aloud. Sixth graders must read the effect of what is left unsaid.","method":"raw","spec":"v1","no":27},{"item_id":"gen1-the-strange--L1P19-raw-Evidence","uid":"1cd7754ecc","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":19,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P19","type":"Evidence","question":"Which sentence from the passage best supports the claim that Guest quietly suspects a link between the murderer and Dr. Jekyll before he says anything about it?","options":["“I thought I knew the writing.","I thank you, sir;” and the clerk laid the two sheets of paper alongside and sedulously compared their contents.","“Well, sir,” returned the clerk, “there’s a rather singular resemblance; the two hands are in many points identical: only differently sloped.”","“Henry Jekyll forge for a murderer!”"],"option_sids":["S16","S22","S26","S34"],"answer":1,"highlight":["S16","S22","S26","S34"],"target":null,"evidence":["S22"],"why_en":"Unasked, Guest sets the two handwritings side by side and compares them closely, an action that reveals suspicion before any words do. Students must therefore choose this as the evidence over the sentence that states the suspicion outright (S26) and the sentence that merely repeats the words 'Jekyll' and 'murderer' (S34).","method":"raw","spec":"v1","no":28},{"item_id":"gen1-the-strange--L1P22-raw-Analysis","uid":"429b1f66f1","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":22,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P22","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Utterson feels his fear is disloyal, so he makes himself keep visiting Jekyll.","Utterson still cares for Jekyll, but uneasiness makes him glad to be kept away.","Utterson is uneasy about Jekyll, so he decides to stop visiting him completely.","Utterson still wants the packet's secret, so he visits Jekyll hoping to learn it."],"option_sids":null,"answer":1,"highlight":["S11","S12","S13"],"target":null,"evidence":["S11","S12","S13"],"why_en":"Utterson resisted opening the envelope, but his curiosity and unease remain. So while he outwardly visits his friend, inwardly he wants to avoid him, and the passage requires reading these conflicting feelings.","method":"raw","spec":"v1","no":29},{"item_id":"gen1-the-strange--L1P22-kg-Analysis","uid":"355f91f8ad","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":22,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P22","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Utterson suspects Jekyll of a crime, and his anger keeps him away from the house.","Utterson still cares for Jekyll, but he feels hurt and rejected when Poole turns him away.","Utterson keeps the packet sealed from duty, but the unsolved mystery slowly cools his friendship.","Utterson keeps the packet sealed from duty, and once it is locked away his curiosity fades."],"option_sids":null,"answer":2,"highlight":["S10","S11","S12","S13"],"target":null,"evidence":["S10","S11","S12","S13"],"why_en":"Students must read a meaning the passage does not state directly: the curiosity Utterson has suppressed out of duty does not go away, and it changes how he feels toward Jekyll.","method":"kg","spec":"v1","no":30},{"item_id":"gen1-the-strange--L1P23-kg-Craft","uid":"38e96a46f8","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":23,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P23","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It ends a friendly talk so fast that Utterson's last words seem to have hurt Jekyll","It strips off a friendly mask so fast that Jekyll's earlier gladness seems only pretend","It turns a friendly talk into quiet sadness, so readers mainly pity Jekyll's long illness","It turns a friendly talk into terror so fast that something unseen seems to grip Jekyll"],"option_sids":null,"answer":3,"highlight":["S23"],"target":"the smile was struck out of his face","evidence":["S22","S23","S24"],"why_en":"The smile does not simply fade; it is 'struck out,' as if by a blow, and that detail wrenches a friendly conversation into terror in an instant. Students must register the chill this sudden turn leaves on the reader.","method":"kg","spec":"v1","no":31},{"item_id":"gen1-the-strange--L2P1-kg-Evidence","uid":"4196215ac6","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":1,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P1","type":"Evidence","question":"Which sentence from the passage best supports the claim that Utterson has to struggle to stay brave once he is frightened?","options":["At the sight of Mr. Utterson, the housemaid broke into hysterical whimpering; and the cook, crying out “Bless God! it’s Mr. Utterson,” ran forward as if to take him in her arms.","“Hold your tongue!” Poole said to her, with a ferocity of accent that testified to his own jangled nerves; and indeed, when the girl had so suddenly raised the note of her lamentation, they had all started and turned towards the inner door with faces of dreadful expectation.","Mr. Utterson’s nerves, at this unlooked-for termination, gave a jerk that nearly threw him from his balance; but he recollected his courage and followed the butler into the laboratory building through the surgical theatre, with its lumber of crates and bottles, to the foot of the stair.","Here Poole motioned him to stand on one side and listen; while he himself, setting down the candle and making a great and obvious call on his resolution, mounted the steps and knocked with a somewhat uncertain hand on the red baize of the cabinet door."],"option_sids":["S8","S14","S20","S21"],"answer":2,"highlight":["S8","S14","S20","S21"],"target":null,"evidence":["S20"],"why_en":"Utterson appears to lean on the servants, but in fact he is frightened and forcing himself to hold firm; students must defend this with a single sentence, separating it from Poole's sentences, which show similar gestures.","method":"kg","spec":"v1","no":32},{"item_id":"gen1-the-strange--L2P2-kg-Vocab","uid":"71ce73841e","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":2,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P2","type":"Vocab","question":"As used in this excerpt, \"smuggled\" most nearly means","options":["imported illegally","pushed roughly","stolen quickly","brought secretly"],"option_sids":null,"answer":3,"highlight":["S13"],"target":"smuggled","evidence":["S13"],"why_en":"Reading the word in its familiar sense \"to smuggle\" derails the sentence; read as \"to bring in without anyone knowing,\" it shows that the presence in the cabinet is hiding from others' eyes.","method":"kg","spec":"v1","no":33},{"item_id":"gen1-the-strange--L2P2-kg-Craft","uid":"a26efa06aa","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":2,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P2","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shows the polite, formal note suddenly breaking down into desperate pleading.","It shows the writer growing too sick and weak to keep his handwriting neat.","It shows the writer's sudden anger at Maw's for sending useless samples.","It shows the writer staying polite while stressing how important his order is."],"option_sids":null,"answer":0,"highlight":["S24"],"target":"with a sudden splutter of the pen, the writer’s emotion had broken loose","evidence":["S23","S24","S25"],"why_en":"A decorous, formal note turns into a cry as the pen sputters. The item asks whether students can read the device by which the breakdown of the writing's form alone conveys the writer's desperation.","method":"kg","spec":"v1","no":34},{"item_id":"gen1-the-strange--L2P5-kg-Craft","uid":"5702da27a8","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":5,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P5","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It uses sound to suggest that the walker cannot rest because of guilt.","It uses sound to suggest that Poole has misheard his own master's steps.","It uses sound to suggest that someone other than Jekyll is in the room.","It uses sound to suggest that Jekyll has grown weak from a long illness."],"option_sids":null,"answer":2,"highlight":["S13"],"target":"The steps fell lightly and oddly, with a certain swing, for all they went so slowly; it was different indeed from the heavy creaking tread of Henry Jekyll.","evidence":["S12","S13"],"why_en":"The item asks whether students can read how, without showing a face, the footsteps alone make the reader sense that the presence inside is not Jekyll.","method":"kg","spec":"v1","no":35},{"item_id":"gen1-the-strange--L2P6-kg-Craft","uid":"ba42f9b67f","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":6,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P6","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It makes the room seem calm, showing that Hyde felt safe and at peace there.","It shows the quiet after all the noise, so the men's fear begins to fade.","It makes the room seem calm and ordinary, so the twisted body comes as a shock.","It points to the chemicals, hinting that science is the hidden danger in the room."],"option_sids":null,"answer":2,"highlight":["S3"],"target":"the quietest room, you would have said, and, but for the glazed presses full of chemicals, the most commonplace that night in London","evidence":["S3","S4"],"why_en":"The item asks whether students can read the effect on the reader of first presenting a calm, ordinary room and then placing the contorted body in the very next sentence.","method":"kg","spec":"v1","no":36},{"item_id":"gen1-the-strange--L2P10-kg-Vocab","uid":"6e8046b64e","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":10,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P10","type":"Vocab","question":"As used in this excerpt, \"liquor\" most nearly means","options":["liquid","blood","alcohol","medicine"],"option_sids":null,"answer":0,"highlight":["S13"],"target":"liquor","evidence":["S13"],"why_en":"Reading the word in its common sense \"liquor\" distorts the scene in which Lanyon examines an unidentified experimental liquid in a phial, so the item can separate students who assume they know the word.","method":"kg","spec":"v1","no":37},{"item_id":"gen1-the-strange--L2P11-kg-Evidence","uid":"816e050d86","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":11,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P11","type":"Evidence","question":"Which sentence from the passage best supports the claim that Lanyon now thinks his first explanation for his strange feelings about the visitor was too simple?","options":["The more I reflected the more convinced I grew that I was dealing with a case of cerebral disease; and though I dismissed my servants to bed, I loaded an old revolver, that I might be found in some posture of self-defence.","He was small, as I have said; I was struck besides with the shocking expression of his face, with his remarkable combination of great muscular activity and great apparent debility of constitution, and—last but not least—with the odd, subjective disturbance caused by his neighbourhood.","At the time, I set it down to some idiosyncratic, personal distaste, and merely wondered at the acuteness of the symptoms; but I have since had reason to believe the cause to lie much deeper in the nature of man, and to turn on some nobler hinge than the principle of hatred.","Strange to relate, this ludicrous accoutrement was far from moving me to laughter."],"option_sids":["S5","S14","S16","S18"],"answer":2,"highlight":["S5","S14","S16","S18"],"target":null,"evidence":["S16"],"why_en":"That the retrospective narrator is now revising his judgment of that night is not stated outright; it must be inferred in one step from the contrast between \"then\" and \"since.\" Students must pick out that evidence from among sentences that deal with the same reactions and judgments.","method":"kg","spec":"v1","no":38},{"item_id":"gen1-the-strange--L2P12-kg-Craft","uid":"5181c015c6","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":12,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P12","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It makes him seem in pain, explaining why Lanyon treats him like one of his patients","It makes his body seem beyond his control, building suspense right before the sheet comes off","It makes him seem ready to attack, warning that Lanyon himself is now in real danger","It makes him seem joyful, sharing the relief of finally getting what Jekyll sent him for"],"option_sids":null,"answer":1,"highlight":["S17"],"target":"I could hear his teeth grate with the convulsive action of his jaws","evidence":["S17","S18"],"why_en":"A bodily detail conveyed through sound rather than words (the grinding of teeth) builds the tension just before the drawer is opened, so the item can measure whether students read the effect of a detail on the reader.","method":"kg","spec":"v1","no":39},{"item_id":"gen1-the-strange--L2P16-kg-Vocab","uid":"dc5fe4602a","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":16,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P16","type":"Vocab","question":"As used in this excerpt, \"inmates\" most nearly means","options":["household members","jailed prisoners","overnight guests","hospital patients"],"option_sids":null,"answer":0,"highlight":["S13"],"target":"inmates","evidence":["S13","S14"],"why_en":"Appearing alongside 'locked,' the word is easily read in its common sense \"prisoners,\" but it must be read as \"those living under the same roof\" to understand that Jekyll slips to his bedroom unseen by the sleeping household.","method":"kg","spec":"v1","no":40},{"item_id":"gen1-the-strange--L2P17-kg-Analysis","uid":"415921be8b","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":17,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P17","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Jekyll sees the ugly figure in the glass as natural and human, so he thinks Hyde is harmless.","Jekyll embraces his dark side as truly his own, finding it less mixed than his usual face.","Jekyll decides the livelier image in the glass is his only self, and his old face was false.","Jekyll feels a leap of welcome mainly because his experiment has finally worked as planned."],"option_sids":null,"answer":1,"highlight":["S6","S7","S8","S9"],"target":null,"evidence":["S6","S7","S9"],"why_en":"Seeing the ugly Hyde, Jekyll feels not revulsion but welcome and accepts him as \"this, too, was myself.\" Students must read in this reaction the implication that the evil he has long suppressed is also part of himself.","method":"kg","spec":"v1","no":41},{"item_id":"gen1-the-strange--L2P19-kg-Analysis","uid":"7557fcc55a","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":19,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P19","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["By pinning the blame on his other self, the narrator excuses wrongs he knowingly allowed.","Jekyll stays silent about Hyde's acts mainly to protect his good name in society.","Jekyll is aghast at Hyde's acts and rushes to undo the evil, so his conscience stays awake.","Jekyll is no worse after Hyde's acts, so the guilt truly belongs to Hyde alone."],"option_sids":null,"answer":0,"highlight":["S2","S3","S4","S5","S6"],"target":null,"evidence":["S3","S5","S6"],"why_en":"Taking at face value the excuse Jekyll recounts in the third person ('Hyde alone') leads to the wrong answer. Only by reading 'slumbered' and 'connived' as well does the implication emerge that the excuse is self-deception.","method":"kg","spec":"v1","no":42},{"item_id":"gen1-the-strange--L2P22-kg-Craft","uid":"20fcb09bd6","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":22,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P22","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shows Hyde singing to stay brave, hiding how much he fears the avenger.","It shows Hyde's joy slowly fading, so the move to Jekyll's tears feels gentle.","It shows Hyde mocking his victim, so Jekyll's sudden tears feel shockingly different.","It shows Hyde's cheerful mood, so Jekyll's tears seem to come from relief alone."],"option_sids":null,"answer":2,"highlight":["S11"],"target":"Hyde had a song upon his lips as he compounded the draught, and as he drank it, pledged the dead man.","evidence":["S11","S12"],"why_en":"Placing Hyde, singing and toasting the dead man, directly beside Jekyll praying in tears is meant to have students read how the juxtaposition splits the same man into two selves, abruptly and chillingly.","method":"kg","spec":"v1","no":43},{"item_id":"gen1-the-strange--L2P23-kg-Vocab","uid":"6513056939","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":23,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P23","type":"Vocab","question":"As used in this excerpt, \"licence\" most nearly means","options":["room to be creative","a rest from hard work","permission from authorities","freedom from moral rules"],"option_sids":null,"answer":3,"highlight":["S11"],"target":"licence","evidence":["S11"],"why_en":"Reading 'licence' in its common sense of \"permission\" or \"a permit\" misses what the bestial side within Jekyll craves, so this is a good spot to measure precise word reading.","method":"kg","spec":"v1","no":44},{"item_id":"gen1-the-strange--L2P24-kg-Vocab","uid":"4fff4af2c2","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":24,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P24","type":"Vocab","question":"As used in this excerpt, \"quarry\" most nearly means","options":["outcast","pit","enemy","prey"],"option_sids":null,"answer":3,"highlight":["S6"],"target":"quarry","evidence":["S6"],"why_en":"The common sense \"stone pit\" does not make the sentence work; only when the word is read as \"hunted prey\" does the contrast come alive between a respected man and the hunted murderer he has become.","method":"kg","spec":"v1","no":45},{"item_id":"gen1-the-strange--L2P24-kg-Evidence","uid":"4e77895866","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":2,"page":24,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P24","type":"Evidence","question":"Which sentence from the passage best supports the claim that a skill that belongs to Jekyll rather than Hyde turns the narrator's confusion into a clear plan?","options":["I have more than once observed that in my second character, my faculties seemed sharpened to a point and my spirits more tensely elastic; thus it came about that, where Jekyll perhaps might have succumbed, Hyde rose to the importance of the moment.","I saw I must employ another hand, and thought of Lanyon.","Then I remembered that of my original character, one part remained to me: I could write my own hand; and once I had conceived that kindling spark, the way that I must follow became lighted up from end to end.","Thereupon, I arranged my clothes as best I could, and summoning a passing hansom, drove to an hotel in Portland Street, the name of which I chanced to remember."],"option_sids":["S8","S13","S16","S17"],"answer":2,"highlight":["S8","S13","S16","S17"],"target":null,"evidence":["S16"],"why_en":"Students must determine what offered a way out to Hyde, hunted and cornered in his own body, and pick out the evidence from between the sentence that names the person directly and the sentence that carries out the plan.","method":"kg","spec":"v1","no":46},{"item_id":"gen1-the-strange--L3P1-kg-Vocab","uid":"69b6e1b25f","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":3,"page":1,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P1","type":"Vocab","question":"As used in this excerpt, \"passengers\" most nearly means","options":["people on the street","customers in shops","riders in a cab","travelers on a journey"],"option_sids":null,"answer":0,"highlight":["S5"],"target":"passengers","evidence":["S5"],"why_en":"Coming right after the cab is dismissed, the word is easily read as \"passengers,\" but here it means the people on the night streets Hyde enters on foot, that is, passersby, so the item can measure the common-sense trap.","method":"kg","spec":"v1","no":47},{"item_id":"gen1-the-strange--L3P1-kg-Analysis","uid":"0180babca5","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":3,"page":1,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P1","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Jekyll fears hanging and being Hyde equally, and both torment him.","Jekyll now hates being Hyde more than he fears being punished.","Jekyll is sickened by what Hyde did that night, not by being Hyde.","Jekyll mostly regrets frightening his old friend Lanyon that night."],"option_sids":null,"answer":1,"highlight":["S9","S10","S11"],"target":null,"evidence":["S9","S10","S11"],"why_en":"Lanyon's terror is 'a drop in the sea,' and the source of torment has now shifted from the gallows to the very existence of Hyde. Students must read this change of mind, in which his own nature has become more horrible to him than punishment.","method":"kg","spec":"v1","no":48},{"item_id":"gen1-the-strange--L3P1-kg-Craft","uid":"7e1f11635d","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":3,"page":1,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P1","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shows Jekyll proudly placing himself above Hyde as the better man.","It shows Jekyll refusing to call Hyde \"I,\" as if Hyde were someone else.","It shows Jekyll fixing a small slip so his account stays exact.","It shows Jekyll unsure whether he or Hyde is the one telling this."],"option_sids":null,"answer":1,"highlight":["S4"],"target":"He, I say—I cannot say, I.","evidence":["S4"],"why_en":"The line in which Jekyll says \"he,\" then breaks off and corrects himself, saying he cannot say \"I,\" shows on the page itself his inability to acknowledge Hyde as himself, making this a good spot to ask about the effect of a detail.","method":"kg","spec":"v1","no":49},{"item_id":"gen1-the-strange--L3P2-kg-Vocab","uid":"7b489fd11a","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":3,"page":2,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P2","type":"Vocab","question":"As used in this excerpt, \"virtue\" most nearly means","options":["goodness","worth","effect","purity"],"option_sids":null,"answer":2,"highlight":["S5"],"target":"virtue","evidence":["S5"],"why_en":"Reading the word in the sense students know, \"moral goodness,\" derails the sentence; read as the drug's \"effect/efficacy,\" it shows Jekyll's inability to hold out without the drug.","method":"kg","spec":"v1","no":50},{"item_id":"gen1-the-strange--L3P2-kg-Craft","uid":"528b311161","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":3,"page":2,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P2","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It makes the change seem a short, easy break for Hyde, since it soon ends.","It makes the change feel like bodily pain, like the pangs Jekyll feels at each change.","It makes Hyde seem sorry for his crimes, as if he wants to pay for them.","It makes Hyde's escape a kind of death: to stay alive, he must stop being himself."],"option_sids":null,"answer":3,"highlight":["S13"],"target":"temporary suicide","evidence":["S13"],"why_en":"The clash between \"temporary\" and \"suicide\" holds a paradox: Hyde returns to Jekyll to save his life, yet that way of surviving is itself the way he ceases to exist. The spot can measure whether students read this paradox as an effect.","method":"kg","spec":"v1","no":51},{"item_id":"gen1-the-strange--L3P2-kg-Evidence","uid":"871abeb4d7","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":3,"page":2,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P2","type":"Evidence","question":"Which sentence from the passage best supports the claim that Jekyll is being ruined not only by his fear of Hyde but also by what he forces upon himself?","options":["In short, from that day forth it seemed only by a great effort as of gymnastics, and only under the immediate stimulation of the drug, that I was able to wear the countenance of Jekyll.","At all hours of the day and night, I would be taken with the premonitory shudder; above all, if I slept, or even dozed for a moment in my chair, it was always as Hyde that I awakened.","Under the strain of this continually impending doom and by the sleeplessness to which I now condemned myself, ay, even beyond what I had thought possible to man, I became, in my own person, a creature eaten up and emptied by fever, languidly weak both in body and mind, and solely occupied by one thought: the horror of my other self.","The powers of Hyde seemed to have grown with the sickliness of Jekyll."],"option_sids":["S2","S3","S4","S6"],"answer":2,"highlight":["S2","S3","S4","S6"],"target":null,"evidence":["S4"],"why_en":"The evidence for the inferential claim that what he imposed on himself for self-protection is in fact destroying him lies in a single sentence, S4. Neighboring sentences about his efforts, the rules of transformation, and Hyde's growth serve as traps.","method":"kg","spec":"v1","no":52},{"item_id":"gen1-the-strange--L3P3-kg-Vocab","uid":"69e67e2a74","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":3,"page":3,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P3","type":"Vocab","question":"As used in this excerpt, \"careless\" most nearly means","options":["forgetful","fearless","sloppy","indifferent"],"option_sids":null,"answer":3,"highlight":["S14"],"target":"careless","evidence":["S14"],"why_en":"Reading the word in its common sense \"careless\" derails the sentence; read as \"indifferent,\" it reveals Jekyll's resignation, no longer caring what becomes of Hyde.","method":"kg","spec":"v1","no":53},{"item_id":"gen1-the-strange--L3P3-kg-Analysis","uid":"2519c88130","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":3,"page":3,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P3","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Jekyll pities Hyde's fear of death, and over time his disgust for Hyde has faded.","Jekyll hates Hyde, yet mostly pities himself, and has grown numb to his pain.","Jekyll hates Hyde, yet pities his desperate grip on life, and has grown numb to pain.","Jekyll hates Hyde, but over time his pain has grown lighter and easier to bear."],"option_sids":null,"answer":2,"highlight":["S1","S2","S3"],"target":null,"evidence":["S2","S3"],"why_en":"Jekyll is sickened by the mere thought of Hyde. Yet he pities Hyde for clinging abjectly to life, and his suffering has dulled into numbness without easing. Students must read these conflicting feelings together.","method":"kg","spec":"v1","no":54},{"item_id":"gen1-the-strange--L3P4-kg-Craft","uid":"eab2f9ab5c","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":3,"page":4,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P4","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It makes sealing the letter feel like Jekyll's end, and he talks about himself like another person.","It builds suspense by suggesting Jekyll is hiding one last secret inside the letter.","It mainly explains the practical steps Jekyll takes to finish and close his letter.","It shows Jekyll's sadness about the letter, but he still feels fully like himself here."],"option_sids":null,"answer":0,"highlight":["S2"],"target":"as I lay down the pen and proceed to seal up my confession, I bring the life of that unhappy Henry Jekyll to an end","evidence":["S2","S1"],"why_en":"The ordinary gesture of laying down the pen and sealing the confession is overlaid with the end of a life, and Jekyll refers to himself as 'that unhappy Henry Jekyll,' as if speaking of someone else. This is a good spot to measure whether students read the effect of that arrangement.","method":"kg","spec":"v1","no":55}],"pages":{"a-christmas-carol|L1:P1":[["S1","heading","A CHRISTMAS CAROL",1],["S2","sentence","Charles Dickens",1],["S3","heading","STAVE ONE",1],["S4","heading","MARLEY'S GHOST",1],["S5","sentence","Marley was dead, to begin with.",1],["S6","sentence","There is no doubt whatever about that.",0],["S7","sentence","The register of his burial was signed by the clergyman, the clerk, the undertaker, and the chief mourner.",0],["S8","sentence","Scrooge signed it.",0],["S9","sentence","And Scrooge's name was good upon 'Change for anything he chose to put his hand to.",0],["S10","sentence","Old Marley was as dead as a door-nail.",0],["S11","sentence","Mind!",0],["S12","sentence","I don't mean to say that I know, of my own knowledge, what there is particularly dead about a door-nail.",0],["S13","sentence","I might have been inclined, myself, to regard a coffin-nail as the deadest piece of ironmongery in the trade.",0],["S14","sentence","But the wisdom of our ancestors is in the simile; and my unhallowed hands shall not disturb it, or the Country's done for.",0],["S15","sentence","You will, therefore, permit me to repeat, emphatically, that Marley was as dead as a door-nail.",0],["S16","sentence","Scrooge knew he was dead?",0],["S17","sentence","Of course he did.",0],["S18","sentence","How could it be otherwise?",0],["S19","sentence","Scrooge and he were partners for I don't know how many years.",0],["S20","sentence","Scrooge was his sole executor, his sole administrator, his sole assign, his sole residuary legatee, his sole friend, and sole mourner.",0],["S21","sentence","And even Scrooge was not so dreadfully cut up by the sad event, but that he was an excellent man of business on the very day of the funeral, and solemnised it with an undoubted bargain.",0],["S22","sentence","The mention of Marley's funeral brings me back to the point I started from.",0],["S23","sentence","There is no doubt that Marley was dead.",0],["S24","sentence","This must be distinctly understood, or nothing wonderful can come of the story I am going to relate.",0],["S25","sentence","If we were not perfectly convinced that Hamlet's Father died before the play began, there would be nothing more remarkable in his taking a stroll at night, in an easterly wind, upon his own ramparts, than there would be in any other middle-aged gentleman rashly turning out after dark in a breezy spot—say St. Paul's Church-yard, for instance—literally to astonish his son's weak mind.",0],["S26","sentence","Scrooge never painted out Old Marley's name.",0],["S27","sentence","There it stood, years afterwards, above the warehouse door: Scrooge and Marley.",0],["S28","sentence","The firm was known as Scrooge and Marley.",0],["S29","sentence","Sometimes people new to the business called Scrooge Scrooge, and sometimes Marley, but he answered to both names.",0],["S30","sentence","It was all the same to him.",0],["S31","sentence","Oh! but he was a tight-fisted hand at the grindstone, Scrooge! a squeezing, wrenching, grasping, scraping, clutching, covetous, old sinner!",0],["S32","sentence","Hard and sharp as flint, from which no steel had ever struck out generous fire; secret, and self-contained, and solitary as an oyster.",0],["S33","sentence","The cold within him froze his old features, nipped his pointed nose, shrivelled his cheek, stiffened his gait; made his eyes red, his thin lips blue; and spoke out shrewdly in his grating voice.",0],["S34","sentence","A frosty rime was on his head, and on his eyebrows, and his wiry chin.",0],["S35","sentence","He carried his own low temperature always about with him; he iced his office in the dog-days; and didn't thaw it one degree at Christmas.",0],["S36","sentence","External heat and cold had little influence",0]],"a-christmas-carol|L1:P2":[["S1","sentence","on Scrooge.",1],["S2","sentence","No warmth could warm, no wintry weather chill him.",0],["S3","sentence","No wind that blew was bitterer than he, no falling snow was more intent upon its purpose, no pelting rain less open to entreaty.",0],["S4","sentence","Foul weather didn't know where to have him.",0],["S5","sentence","The heaviest rain, and snow, and hail, and sleet could boast of the advantage over him in only one respect.",0],["S6","sentence","They often \"came down\" handsomely and Scrooge never did.",0],["S7","sentence","Nobody ever stopped him in the street to say, with gladsome looks, \"My dear Scrooge, how are you?",0],["S8","sentence","When will you come to see me?\"",0],["S9","sentence","No beggars implored him to bestow a trifle, no children asked him what it was o'clock, no man or woman ever once in all his life inquired the way to such and such a place, of Scrooge.",0],["S10","sentence","Even the blind men's dogs appeared to know him; and, when they saw him coming on, would tug their owners into doorways and up courts; and then would wag their tails as though they said, \"No eye at all is better than an evil eye, dark master!\"",0],["S11","sentence","But what did Scrooge care?",0],["S12","sentence","It was the very thing he liked.",0],["S13","sentence","To edge his way along the crowded paths of life, warning all human sympathy to keep its distance, was what the knowing ones call \"nuts\" to Scrooge.",0],["S14","sentence","Once upon a time—of all the good days in the year, on Christmas Eve—old Scrooge sat busy in his counting-house.",0],["S15","sentence","It was cold, bleak, biting weather: foggy withal: and he could hear the people in the court outside go wheezing up and down, beating their hands upon their breasts, and stamping their feet upon the pavement stones to warm them.",0],["S16","sentence","The City clocks had only just gone three, but it was quite dark already—it had not been light all day—and candles were flaring in the windows of the neighbouring offices, like ruddy smears upon the palpable brown air.",0],["S17","sentence","The fog came pouring in at every chink and keyhole, and was so dense without, that, although the court was of the narrowest, the houses opposite were mere phantoms.",0],["S18","sentence","To see the dingy cloud come drooping down, obscuring everything, one might have thought that nature lived hard by and was brewing on a large scale.",0],["S19","sentence","The door of Scrooge's counting-house was open, that he might keep his eye upon his clerk, who in a dismal little cell beyond, a sort of tank, was copying letters.",0],["S20","sentence","Scrooge had a very small fire, but the clerk's fire was so very much smaller that it looked like one coal.",0],["S21","sentence","But he couldn't replenish it, for Scrooge kept the coal-box in his own room; and so surely as the clerk came in with the shovel, the master predicted that it would be necessary for them to part.",0],["S22","sentence","Wherefore the clerk put on his white comforter, and tried to warm himself at the candle; in which effort, not being a man of strong imagination, he failed.",0],["S23","sentence","\"A merry Christmas, uncle!",0],["S24","sentence","God save you!\" cried a cheerful voice.",0]],"a-christmas-carol|L1:P3":[["S1","sentence","It was the voice of Scrooge's nephew, who came upon him so quickly that this was the first intimation he had of his approach.",1],["S2","sentence","\"Bah!\" said Scrooge.",0],["S3","sentence","\"Humbug!\"",0],["S4","sentence","He had so heated himself with rapid walking in the fog and frost, this nephew of Scrooge's, that he was all in a glow; his face was ruddy and handsome; his eyes sparkled, and his breath smoked again.",0],["S5","sentence","\"Christmas a humbug, uncle!\" said Scrooge's nephew.",0],["S6","sentence","\"You don't mean that, I am sure?\"",0],["S7","sentence","\"I do,\" said Scrooge.",0],["S8","sentence","\"Merry Christmas!",0],["S9","sentence","What right have you to be merry?",0],["S10","sentence","What reason have you to be merry?",0],["S11","sentence","You're poor enough.\"",0],["S12","sentence","\"Come, then,\" returned the nephew gaily.",0],["S13","sentence","\"What right have you to be dismal?",0],["S14","sentence","What reason have you to be morose?",0],["S15","sentence","You're rich enough.\"",0],["S16","sentence","Scrooge, having no better answer ready on the spur of the moment, said, \"Bah!\" again; and followed it up with \"Humbug!\"",0],["S17","sentence","\"Don't be cross, uncle!\" said the nephew.",0],["S18","sentence","\"What else can I be,\" returned the uncle, \"when I live in such a world of fools as this?",0],["S19","sentence","Merry Christmas!",0],["S20","sentence","Out upon merry Christmas!",0],["S21","sentence","What's Christmas-time to you but a time for paying bills without money; a time for finding yourself a year older, and not an hour richer; a time for balancing your books, and having every item in 'em through a round dozen of months presented dead against you?",0],["S22","sentence","If I could work my will,\" said Scrooge indignantly, \"every idiot who goes about with 'Merry Christmas' on his lips should be boiled with his own pudding, and buried with a stake of holly through his heart.",0],["S23","sentence","He should!\"",0],["S24","sentence","\"Uncle!\" pleaded the nephew.",0],["S25","sentence","\"Nephew!\" returned the uncle sternly, \"keep Christmas in your own way, and let me keep it in mine.\"",0],["S26","sentence","\"Keep it!\" repeated Scrooge's nephew.",0],["S27","sentence","\"But you don't keep it.\"",0],["S28","sentence","\"Let me leave it alone, then,\" said Scrooge.",0],["S29","sentence","\"Much good may it do you!",0],["S30","sentence","Much good it has ever done you!\"",0],["S31","sentence","\"There are many things from which I might have derived good, by which I have not profited, I dare say,\" returned the nephew; \"Christmas among the rest.",0],["S32","sentence","But I am sure I have always thought of Christmas-time, when it has come round—apart from the veneration due to its sacred name and origin, if anything belonging to it can be apart from that—as a good time; a kind, forgiving, charitable, pleasant time; the only time I know of, in the long calendar of the year, when men and women seem by one consent to open their shut-up hearts freely, and to think of people below them as if they really were fellow-passengers to the grave, and not another race of creatures bound on other journeys.",0],["S33","sentence","And therefore, uncle, though it has never put a scrap of gold or silver in my pocket, I believe that it has done me good, and will do me good; and I say, God bless it!\"",0],["S34","sentence","The clerk in the tank involuntarily applauded.",0],["S35","sentence","Becoming immediately sensible of the impropriety, he poked the fire, and extinguished the last frail",0]],"a-christmas-carol|L1:P4":[["S1","sentence","spark for ever.",1],["S2","sentence","\"Let me hear another sound from you,\" said Scrooge, \"and you'll keep your Christmas by losing your situation!",0],["S3","sentence","You're quite a powerful speaker, sir,\" he added, turning to his nephew.",0],["S4","sentence","\"I wonder you don't go into Parliament.\"",0],["S5","sentence","\"Don't be angry, uncle.",0],["S6","sentence","Come!",0],["S7","sentence","Dine with us to-morrow.\"",0],["S8","sentence","Scrooge said that he would see him——Yes, indeed he did.",0],["S9","sentence","He went the whole length of the expression, and said that he would see him in that extremity first.",0],["S10","sentence","\"But why?\" cried Scrooge's nephew.",0],["S11","sentence","\"Why?\"",0],["S12","sentence","\"Why did you get married?\" said Scrooge.",0],["S13","sentence","\"Because I fell in love.\"",0],["S14","sentence","\"Because you fell in love!\" growled Scrooge, as if that were the only one thing in the world more ridiculous than a merry Christmas.",0],["S15","sentence","\"Good afternoon!\"",0],["S16","sentence","\"Nay, uncle, but you never came to see me before that happened.",0],["S17","sentence","Why give it as a reason for not coming now?\"",0],["S18","sentence","\"Good afternoon,\" said Scrooge.",0],["S19","sentence","\"I want nothing from you; I ask nothing of you; why cannot we be friends?\"",0],["S20","sentence","\"Good afternoon!\" said Scrooge.",0],["S21","sentence","\"I am sorry, with all my heart, to find you so resolute.",0],["S22","sentence","We have never had any quarrel to which I have been a party.",0],["S23","sentence","But I have made the trial in homage to Christmas, and I'll keep my Christmas humour to the last.",0],["S24","sentence","So A Merry Christmas, uncle!\"",0],["S25","sentence","\"Good afternoon,\" said Scrooge.",0],["S26","sentence","\"And A Happy New Year!\"",0],["S27","sentence","\"Good afternoon!\" said Scrooge.",0],["S28","sentence","His nephew left the room without an angry word, notwithstanding.",0],["S29","sentence","He stopped at the outer door to bestow the greetings of the season on the clerk, who, cold as he was, was warmer than Scrooge; for he returned them cordially.",0],["S30","sentence","\"There's another fellow,\" muttered Scrooge, who overheard him: \"my clerk, with fifteen shillings a week, and a wife and family, talking about a merry Christmas.",0],["S31","sentence","I'll retire to Bedlam.\"",0],["S32","sentence","This lunatic, in letting Scrooge's nephew out, had let two other people in.",0],["S33","sentence","They were portly gentlemen, pleasant to behold, and now stood, with their hats off, in Scrooge's office.",0],["S34","sentence","They had books and papers in their hands, and bowed to him.",0],["S35","sentence","\"Scrooge and Marley's, I believe,\" said one of the gentlemen, referring to his list.",0],["S36","sentence","\"Have I the pleasure of addressing Mr. Scrooge, or Mr. Marley?\"",0],["S37","sentence","\"Mr. Marley has been dead these seven years,\" Scrooge replied.",0],["S38","sentence","\"He died seven years ago, this very night.\"",0],["S39","sentence","\"We have no doubt his liberality is well represented by his surviving partner,\" said the gentleman, presenting his credentials.",0],["S40","sentence","It certainly was; for they had been two kindred spirits.",0],["S41","sentence","At the ominous word \"liberality\" Scrooge frowned, and shook his head, and handed the credentials back.",0],["S42","sentence","\"At this festive season of the year, Mr. Scrooge,\" said the gentleman, taking up a pen, \"it is more than usually desirable that we should make some slight provision for the poor and destitute, who suffer greatly at the present time.",0],["S43","sentence","Many thousands are in want of common necessaries; hundreds of thousands are in want of common comforts, sir.\"",0],["S44","sentence","\"Are there no prisons?\" asked Scrooge.",0],["S45","sentence","\"Plenty of prisons,\" said the gentleman, laying",0]],"a-christmas-carol|L1:P5":[["S1","sentence","down the pen again.",1],["S2","sentence","\"And the Union workhouses?\" demanded Scrooge.",0],["S3","sentence","\"Are they still in operation?\"",0],["S4","sentence","\"They are.",0],["S5","sentence","Still,\" returned the gentleman, \"I wish I could say they were not.\"",0],["S6","sentence","\"The Treadmill and the Poor Law are in full vigour, then?\" said Scrooge.",0],["S7","sentence","\"Both very busy, sir.\"",0],["S8","sentence","\"Oh!",0],["S9","sentence","I was afraid, from what you said at first, that something had occurred to stop them in their useful course,\" said Scrooge.",0],["S10","sentence","\"I am very glad to hear it.\"",0],["S11","sentence","\"Under the impression that they scarcely furnish Christian cheer of mind or body to the multitude,\" returned the gentleman, \"a few of us are endeavouring to raise a fund to buy the Poor some meat and drink, and means of warmth.",0],["S12","sentence","We choose this time, because it is a time, of all others, when Want is keenly felt, and Abundance rejoices.",0],["S13","sentence","What shall I put you down for?\"",0],["S14","sentence","\"Nothing!\" Scrooge replied.",0],["S15","sentence","\"You wish to be anonymous?\"",0],["S16","sentence","\"I wish to be left alone,\" said Scrooge.",0],["S17","sentence","\"Since you ask me what I wish, gentlemen, that is my answer.",0],["S18","sentence","I don't make merry myself at Christmas, and I can't afford to make idle people merry.",0],["S19","sentence","I help to support the establishments I have mentioned—they cost enough; and those who are badly off must go there.\"",0],["S20","sentence","\"Many can't go there; and many would rather die.\"",0],["S21","sentence","\"If they would rather die,\" said Scrooge, \"they had better do it, and decrease the surplus population.",0],["S22","sentence","Besides—excuse me—I don't know that.\"",0],["S23","sentence","\"But you might know it,\" observed the gentleman.",0],["S24","sentence","\"It's not my business,\" Scrooge returned.",0],["S25","sentence","\"It's enough for a man to understand his own business, and not to interfere with other people's. Mine occupies me constantly.",0],["S26","sentence","Good afternoon, gentlemen!\"",0],["S27","sentence","Seeing clearly that it would be useless to pursue their point, the gentlemen withdrew.",0],["S28","sentence","Scrooge resumed his labours with an improved opinion of himself, and in a more facetious temper than was usual with him.",0],["S29","sentence","Meanwhile the fog and darkness thickened so, that people ran about with flaring links, proffering their services to go before horses in carriages, and conduct them on their way.",0],["S30","sentence","The ancient tower of a church, whose gruff old bell was always peeping slily down at Scrooge out of a Gothic window in the wall, became invisible, and struck the hours and quarters in the clouds, with tremulous vibrations afterwards, as if its teeth were chattering in its frozen head up there.",0],["S31","sentence","The cold became intense.",0],["S32","sentence","In the main street, at the corner of the court, some labourers were repairing the gas-pipes, and had lighted a great fire in a brazier, round which a party of ragged men and boys were gathered: warming their hands and winking their eyes before the blaze in rapture.",0],["S33","sentence","The water-plug being left in solitude, its overflowings suddenly congealed, and turned to misanthropic ice.",0],["S34","sentence","The brightness of the shops, where holly sprigs and berries crackled in the lamp heat of the windows, made pale faces ruddy as they passed.",0],["S35","sentence","Poulterers' and grocers' trades became a splendid joke: a glorious pageant, with which it was",0]],"a-christmas-carol|L1:P6":[["S1","sentence","next to impossible to believe that such dull principles as bargain and sale had anything to do.",1],["S2","sentence","The Lord Mayor, in the stronghold of the mighty Mansion House, gave orders to his fifty cooks and butlers to keep Christmas as a Lord Mayor's household should; and even the little tailor, whom he had fined five shillings on the previous Monday for being drunk and blood-thirsty in the streets, stirred up to-morrow's pudding in his garret, while his lean wife and the baby sallied out to buy the beef.",0],["S3","sentence","Foggier yet, and colder!",0],["S4","sentence","Piercing, searching, biting cold.",0],["S5","sentence","If the good St. Dunstan had but nipped the Evil Spirit's nose with a touch of such weather as that, instead of using his familiar weapons, then indeed he would have roared to lusty purpose.",0],["S6","sentence","The owner of one scant young nose, gnawed and mumbled by the hungry cold as bones are gnawed by dogs, stooped down at Scrooge's keyhole to regale him with a Christmas carol; but, at the first sound of\n\"God bless you, merry gentleman,\n\nMay nothing you dismay!\"",0],["S7","sentence","Scrooge seized the ruler with such energy of action, that the singer fled in terror, leaving the keyhole to the fog, and even more congenial frost.",0],["S8","sentence","At length the hour of shutting up the counting-house arrived.",0],["S9","sentence","With an ill-will Scrooge dismounted from his stool, and tacitly admitted the fact to the expectant clerk in the tank, who instantly snuffed his candle out, and put on his hat.",0],["S10","sentence","\"You'll want all day to-morrow, I suppose?\" said Scrooge.",0],["S11","sentence","\"If quite convenient, sir.\"",0],["S12","sentence","\"It's not convenient,\" said Scrooge, \"and it's not fair.",0],["S13","sentence","If I was to stop half-a-crown for it, you'd think yourself ill used, I'll be bound?\"",0],["S14","sentence","The clerk smiled faintly.",0],["S15","sentence","\"And yet,\" said Scrooge, \"you don't think me ill used when I pay a day's wages for no work.\"",0],["S16","sentence","The clerk observed that it was only once a year.",0],["S17","sentence","\"A poor excuse for picking a man's pocket every twenty-fifth of December!\" said Scrooge, buttoning his great-coat to the chin.",0],["S18","sentence","\"But I suppose you must have the whole day.",0],["S19","sentence","Be here all the earlier next morning.\"",0],["S20","sentence","The clerk promised that he would; and Scrooge walked out with a growl.",0],["S21","sentence","The office was closed in a twinkling, and the clerk, with the long ends of his white comforter dangling below his waist (for he boasted no great-coat), went down a slide on Cornhill, at the end of a lane of boys, twenty times, in honour of its being Christmas-eve, and then ran home to Camden Town as hard as he could pelt, to play at blindman's buff.",0],["S22","sentence","Scrooge took his melancholy dinner in his usual melancholy tavern; and having read all the newspapers, and beguiled the rest of the evening with his banker's book, went home to bed.",0],["S23","sentence","He lived in chambers which had once belonged to his deceased partner.",0],["S24","sentence","They were a gloomy suite of rooms, in a lowering pile of building up a yard, where it had so little business to be, that",0]],"a-christmas-carol|L1:P8":[["S1","sentence","every cask in the wine merchant's cellars below, appeared to have a separate peal of echoes of its own.",1],["S2","sentence","Scrooge was not a man to be frightened by echoes.",0],["S3","sentence","He fastened the door, and walked across the hall, and up the stairs: slowly, too: trimming his candle as he went.",0],["S4","sentence","You may talk vaguely about driving a coach and six up a good old flight of stairs, or through a bad young Act of Parliament; but I mean to say you might have got a hearse up that staircase, and taken it broadwise, with the splinter-bar towards the wall, and the door towards the balustrades: and done it easy.",0],["S5","sentence","There was plenty of width for that, and room to spare; which is perhaps the reason why Scrooge thought he saw a locomotive hearse going on before him in the gloom.",0],["S6","sentence","Half-a-dozen gas-lamps out of the street wouldn't have lighted the entry too well, so you may suppose that it was pretty dark with Scrooge's dip.",0],["S7","sentence","Up Scrooge went, not caring a button for that.",0],["S8","sentence","Darkness is cheap, and Scrooge liked it.",0],["S9","sentence","But, before he shut his heavy door, he walked through his rooms to see that all was right.",0],["S10","sentence","He had just enough recollection of the face to desire to do that.",0],["S11","sentence","Sitting-room, bedroom, lumber-room.",0],["S12","sentence","All as they should be.",0],["S13","sentence","Nobody under the table, nobody under the sofa; a small fire in the grate; spoon and basin ready; and the little saucepan of gruel (Scrooge had a cold in his head) upon the hob.",0],["S14","sentence","Nobody under the bed; nobody in the closet; nobody in his dressing-gown, which was hanging up in a suspicious attitude against the wall.",0],["S15","sentence","Lumber-room as usual.",0],["S16","sentence","Old fire-guard, old shoes, two fish baskets, washing-stand on three legs, and a poker.",0],["S17","sentence","Quite satisfied, he closed his door, and locked himself in; double locked himself in, which was not his custom.",0],["S18","sentence","Thus secured against surprise, he took off his cravat; put on his dressing-gown and slippers, and his nightcap; and sat down before the fire to take his gruel.",0],["S19","sentence","It was a very low fire indeed; nothing on such a bitter night.",0],["S20","sentence","He was obliged to sit close to it, and brood over it, before he could extract the least sensation of warmth from such a handful of fuel.",0],["S21","sentence","The fire-place was an old one, built by some Dutch merchant long ago, and paved all round with quaint Dutch tiles, designed to illustrate the Scriptures.",0],["S22","sentence","There were Cains and Abels, Pharaoh's daughters, Queens of Sheba, Angelic messengers descending through the air on clouds like feather beds, Abrahams, Belshazzars, Apostles putting off to sea in butter-boats, hundreds of figures to attract his thoughts; and yet that face of Marley, seven years dead, came like the ancient Prophet's rod, and swallowed up the whole.",0],["S23","sentence","If each smooth tile had been a blank at first, with power to shape some picture on its surface from the disjointed fragments of his thoughts, there would have been a copy of old Marley's head",0]],"a-christmas-carol|L1:P12":[["S1","sentence","which it is susceptible is all developed!",1],["S2","sentence","Not to know that any Christian spirit working kindly in its little sphere, whatever it may be, will find its mortal life too short for its vast means of usefulness!",0],["S3","sentence","Not to know that no space of regret can make amends for one life's opportunities misused!",0],["S4","sentence","Yet such was I!",0],["S5","sentence","Oh, such was I!\"",0],["S6","sentence","\"But you were always a good man of business, Jacob,\" faltered Scrooge, who now began to apply this to himself.",0],["S7","sentence","\"Business!\" cried the Ghost, wringing its hands again.",0],["S8","sentence","\"Mankind was my business.",0],["S9","sentence","The common welfare was my business; charity, mercy, forbearance, and benevolence were, all, my business.",0],["S10","sentence","The dealings of my trade were but a drop of water in the comprehensive ocean of my business!\"",0],["S11","sentence","It held up its chain at arm's length, as if that were the cause of all its unavailing grief, and flung it heavily upon the ground again.",0],["S12","sentence","\"At this time of the rolling year,\" the spectre said, \"I suffer most.",0],["S13","sentence","Why did I walk through crowds of fellow-beings with my eyes turned down, and never raise them to that blessed Star which led the Wise Men to a poor abode?",0],["S14","sentence","Were there no poor homes to which its light would have conducted me?\"",0],["S15","sentence","Scrooge was very much dismayed to hear the spectre going on at this rate, and began to quake exceedingly.",0],["S16","sentence","\"Hear me!\" cried the Ghost.",0],["S17","sentence","\"My time is nearly gone.\"",0],["S18","sentence","\"I will,\" said Scrooge.",0],["S19","sentence","\"But don't be hard upon me!",0],["S20","sentence","Don't be flowery, Jacob!",0],["S21","sentence","Pray!\"",0],["S22","sentence","\"How it is that I appear before you in a shape that you can see, I may not tell.",0],["S23","sentence","I have sat invisible beside you many and many a day.\"",0],["S24","sentence","It was not an agreeable idea.",0],["S25","sentence","Scrooge shivered, and wiped the perspiration from his brow.",0],["S26","sentence","\"That is no light part of my penance,\" pursued the Ghost.",0],["S27","sentence","\"I am here to-night to warn you that you have yet a chance and hope of escaping my fate.",0],["S28","sentence","A chance and hope of my procuring, Ebenezer.\"",0],["S29","sentence","\"You were always a good friend to me,\" said Scrooge.",0],["S30","sentence","\"Thankee!\"",0],["S31","sentence","\"You will be haunted,\" resumed the Ghost, \"by Three Spirits.\"",0],["S32","sentence","Scrooge's countenance fell almost as low as the Ghost's had done.",0],["S33","sentence","\"Is that the chance and hope you mentioned, Jacob?\" he demanded in a faltering voice.",0],["S34","sentence","\"It is.\"",0],["S35","sentence","\"I—I think I'd rather not,\" said Scrooge.",0],["S36","sentence","\"Without their visits,\" said the Ghost, \"you cannot hope to shun the path I tread.",0],["S37","sentence","Expect the first to-morrow when the bell tolls One.\"",0],["S38","sentence","\"Couldn't I take 'em all at once, and have it over, Jacob?\" hinted Scrooge.",0],["S39","sentence","\"Expect the second on the next ni
