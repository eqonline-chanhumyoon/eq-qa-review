id, \"Don't mind it, father.",0],["S28","sentence","Don't be grieved!\"",0],["S29","sentence","Bob was very cheerful with them, and spoke pleasantly to all the family.",0],["S30","sentence","He looked at the work upon the table, and praised the industry and speed of Mrs. Cratchit and the girls.",0],["S31","sentence","They would be done long before Sunday, he said.",0],["S32","sentence","\"Sunday!",0],["S33","sentence","You went to-day, then, Robert?\" said his wife.",0],["S34","sentence","\"Yes, my dear,\" returned Bob.",0],["S35","sentence","\"I wish you could have gone.",0],["S36","sentence","It would have done you good to see how green a place it is.",0],["S37","sentence","But you'll see it often.",0],["S38","sentence","I promised him that I would walk there on a Sunday.",0],["S39","sentence","My little, little child!\" cried Bob.",0],["S40","sentence","\"My little child!\"",0],["S41","sentence","He broke down all at once.",0],["S42","sentence","He couldn't help it.",0],["S43","sentence","If he could have helped it, he and his child would have been farther apart, perhaps, than they were.",0],["S44","sentence","He left the room, and went up-stairs into the room above, which was lighted cheerfully, and hung with Christmas.",0],["S45","sentence","There was a chair set close beside the child, and there were signs of some one having been there lately.",0],["S46","sentence","Poor Bob sat down in it, and, when he had thought a little and composed himself, he kissed the little face.",0],["S47","sentence","He was reconciled to what had happened, and went down again",0]],"a-christmas-carol|L3:P3":[["S1","sentence","quite happy.",1],["S2","sentence","They drew about the fire, and talked; the girls and mother working still.",0],["S3","sentence","Bob told them of the extraordinary kindness of Mr. Scrooge's nephew, whom he had scarcely seen but once, and who, meeting him in the street that day, and seeing that he looked a little—\"just a little down, you know,\" said Bob, inquired what had happened to distress him.",0],["S4","sentence","\"On which,\" said Bob, \"for he is the pleasantest-spoken gentleman you ever heard, I told him.",0],["S5","sentence","'I am heartily sorry for it, Mr. Cratchit,' he said, 'and heartily sorry for your good wife.'",0],["S6","sentence","By-the-bye, how he ever knew that I don't know.\"",0],["S7","sentence","\"Knew what, my dear?\"",0],["S8","sentence","\"Why, that you were a good wife,\" replied Bob.",0],["S9","sentence","\"Everybody knows that,\" said Peter.",0],["S10","sentence","\"Very well observed, my boy!\" cried Bob.",0],["S11","sentence","\"I hope they do.",0],["S12","sentence","'Heartily sorry,' he said, 'for your good wife.",0],["S13","sentence","If I can be of service to you in any way,' he said, giving me his card, 'that's where I live.",0],["S14","sentence","Pray come to me.'",0],["S15","sentence","Now, it wasn't,\" cried Bob, \"for the sake of anything he might be able to do for us, so much as for his kind way, that this was quite delightful.",0],["S16","sentence","It really seemed as if he had known our Tiny Tim, and felt with us.\"",0],["S17","sentence","\"I'm sure he's a good soul!\" said Mrs. Cratchit.",0],["S18","sentence","\"You would be sure of it, my dear,\" returned Bob, \"if you saw and spoke to him.",0],["S19","sentence","I shouldn't be at all surprised—mark what I say!—if he got Peter a better situation.\"",0],["S20","sentence","\"Only hear that, Peter,\" said Mrs. Cratchit.",0],["S21","sentence","\"And then,\" cried one of the girls, \"Peter will be keeping company with some one, and setting up for himself.\"",0],["S22","sentence","\"Get along with you!\" retorted Peter, grinning.",0],["S23","sentence","\"It's just as likely as not,\" said Bob, \"one of these days; though there's plenty of time for that, my dear.",0],["S24","sentence","But, however and whenever we part from one another, I am sure we shall none of us forget poor Tiny Tim—shall we—or this first parting that there was among us?\"",0],["S25","sentence","\"Never, father!\" cried they all.",0],["S26","sentence","\"And I know,\" said Bob, \"I know, my dears, that when we recollect how patient and how mild he was, although he was a little, little child, we shall not quarrel easily among ourselves, and forget poor Tiny Tim in doing it.\"",0],["S27","sentence","\"No, never, father!\" they all cried again.",0],["S28","sentence","\"I am very happy,\" said little Bob, \"I am very happy!\"",0],["S29","sentence","Mrs. Cratchit kissed him, his daughters kissed him, the two young Cratchits kissed him, and Peter and himself shook hands.",0],["S30","sentence","Spirit of Tiny Tim, thy childish essence was from God!",0],["S31","sentence","\"Spectre,\" said Scrooge, \"something informs me that our parting moment is at hand.",0],["S32","sentence","I know it, but I know not how.",0],["S33","sentence","Tell me what man that was whom we saw lying dead?\"",0],["S34","sentence","The Ghost of Christmas Yet To Come conveyed him, as before—though at a different time, he thought: indeed, there seemed no order in these latter visions, save that they were in the Future—into the resorts",0]],"a-christmas-carol|L3:P4":[["S1","sentence","of business men, but showed him not himself.",1],["S2","sentence","Indeed, the Spirit did not stay for anything, but went straight on, as to the end just now desired, until besought by Scrooge to tarry for a moment.",0],["S3","sentence","\"This court,\" said Scrooge, \"through which we hurry now, is where my place of occupation is, and has been for a length of time.",0],["S4","sentence","I see the house.",0],["S5","sentence","Let me behold what I shall be in days to come.\"",0],["S6","sentence","The Spirit stopped; the hand was pointed elsewhere.",0],["S7","sentence","\"The house is yonder,\" Scrooge exclaimed.",0],["S8","sentence","\"Why do you point away?\"",0],["S9","sentence","The inexorable finger underwent no change.",0],["S10","sentence","Scrooge hastened to the window of his office, and looked in.",0],["S11","sentence","It was an office still, but not his.",0],["S12","sentence","The furniture was not the same, and the figure in the chair was not himself.",0],["S13","sentence","The Phantom pointed as before.",0],["S14","sentence","He joined it once again, and, wondering why and whither he had gone, accompanied it until they reached an iron gate.",0],["S15","sentence","He paused to look round before entering.",0],["S16","sentence","A churchyard.",0],["S17","sentence","Here, then, the wretched man, whose name he had now to learn, lay underneath the ground.",0],["S18","sentence","It was a worthy place.",0],["S19","sentence","Walled in by houses; overrun by grass and weeds, the growth of vegetation's death, not life; choked up with too much burying; fat with repleted appetite.",0],["S20","sentence","A worthy place!",0],["S21","sentence","The Spirit stood among the graves, and pointed down to One.",0],["S22","sentence","He advanced towards it trembling.",0],["S23","sentence","The Phantom was exactly as it had been, but he dreaded that he saw new meaning in its solemn shape.",0],["S24","sentence","\"Before I draw nearer to that stone to which you point,\" said Scrooge, \"answer me one question.",0],["S25","sentence","Are these the shadows of the things that Will be, or are they shadows of the things that May be only?\"",0],["S26","sentence","Still the Ghost pointed downward to the grave by which it stood.",0],["S27","sentence","\"Men's courses will foreshadow certain ends, to which, if persevered in, they must lead,\" said Scrooge.",0],["S28","sentence","\"But if the courses be departed from, the ends will change.",0],["S29","sentence","Say it is thus with what you show me!\"",0],["S30","sentence","The Spirit was immovable as ever.",0],["S31","sentence","Scrooge crept towards it, trembling as he went; and, following the finger, read upon the stone of the neglected grave his own name, Ebenezer Scrooge.",0],["S32","sentence","\"Am I that man who lay upon the bed?\" he cried upon his knees.",0],["S33","sentence","The finger pointed from the grave to him, and back again.",0],["S34","sentence","\"No, Spirit!",0],["S35","sentence","Oh no, no!\"",0],["S36","sentence","The finger still was there.",0],["S37","sentence","\"Spirit!\" he cried, tight clutching at its robe, \"hear me!",0],["S38","sentence","I am not the man I was.",0],["S39","sentence","I will not be the man I must have been but for this intercourse.",0],["S40","sentence","Why show me this, if I am past all hope?\"",0],["S41","sentence","For the first time the hand appeared to shake.",0],["S42","sentence","\"Good Spirit,\" he pursued, as down upon the ground he fell before it: \"your nature intercedes for me, and pities me.",0],["S43","sentence","Assure me that I yet may change these shadows you have shown me by an altered life?\"",0],["S44","sentence","The kind hand trembled.",0],["S45","sentence","\"I",0]],"a-christmas-carol|L3:P5":[["S1","sentence","will honour Christmas in my heart, and try to keep it all the year.",1],["S2","sentence","I will live in the Past, the Present, and the Future.",0],["S3","sentence","The Spirits of all Three shall strive within me.",0],["S4","sentence","I will not shut out the lessons that they teach.",0],["S5","sentence","Oh, tell me I may sponge away the writing on this stone!\"",0],["S6","sentence","In his agony, he caught the spectral hand.",0],["S7","sentence","It sought to free itself, but he was strong in his entreaty, and detained it.",0],["S8","sentence","The Spirit, stronger yet, repulsed him.",0],["S9","sentence","Holding up his hands in a last prayer to have his fate reversed, he saw an alteration in the Phantom's hood and dress.",0],["S10","sentence","It shrunk, collapsed, and dwindled down into a bedpost.",0],["S11","heading","STAVE FIVE",1],["S12","heading","THE END OF IT",1],["S13","sentence","Yes! and the bedpost was his own.",1],["S14","sentence","The bed was his own, the room was his own.",0],["S15","sentence","Best and happiest of all, the Time before him was his own, to make amends in!",0],["S16","sentence","\"I will live in the Past, the Present, and the Future!\" Scrooge repeated as he scrambled out of bed.",0],["S17","sentence","\"The Spirits of all Three shall strive within me.",0],["S18","sentence","Oh, Jacob Marley!",0],["S19","sentence","Heaven and the Christmas Time be praised for this!",0],["S20","sentence","I say it on my knees, old Jacob; on my knees!\"",0],["S21","sentence","He was so fluttered and so glowing with his good intentions, that his broken voice would scarcely answer to his call.",0],["S22","sentence","He had been sobbing violently in his conflict with the Spirit, and his face was wet with tears.",0],["S23","sentence","\"They are not torn down,\" cried Scrooge, folding one of his bed-curtains in his arms, \"they are not torn down, rings and all.",0],["S24","sentence","They are here—I am here—the shadows of the things that would have been may be dispelled.",0],["S25","sentence","They will be.",0],["S26","sentence","I know they will!\"",0],["S27","sentence","His hands were busy with his garments all this time; turning them inside out, putting them on upside down, tearing them, mislaying them, making them parties to every kind of extravagance.",0],["S28","sentence","\"I don't know what to do!\" cried Scrooge, laughing and crying in the same breath; and making a perfect Laocoön of himself with his stockings.",0],["S29","sentence","\"I am as light as a feather, I am as happy as an angel, I am as merry as a school-boy.",0],["S30","sentence","I am as giddy as a drunken man.",0],["S31","sentence","A merry Christmas to everybody!",0],["S32","sentence","A happy New Year to all the world!",0],["S33","sentence","Hallo here!",0],["S34","sentence","Whoop!",0],["S35","sentence","Hallo!\"",0],["S36","sentence","He had frisked into the sitting-room, and was now standing there: perfectly winded.",0],["S37","sentence","\"There's the saucepan that the gruel was in!\" cried Scrooge, starting off again, and going round the fire-place.",0],["S38","sentence","\"There's the door by which the Ghost of Jacob Marley entered!",0],["S39","sentence","There's the corner where the Ghost of Christmas Present sat!",0],["S40","sentence","There's the window where I saw the wandering Spirits!",0],["S41","sentence","It's all right, it's all true, it all happened.",0],["S42","sentence","Ha, ha, ha!\"",0],["S43","sentence","Really, for a man who had been out of practice for so many years, it was a splendid laugh, a most illustrious laugh.",0],["S44","sentence","The father of a long, long line of brilliant laughs!",0],["S45","sentence","\"I don't know what day of",0]],"a-christmas-carol|L3:P6":[["S1","sentence","the month it is,\" said Scrooge.",1],["S2","sentence","\"I don't know how long I have been among the Spirits.",0],["S3","sentence","I don't know anything.",0],["S4","sentence","I'm quite a baby.",0],["S5","sentence","Never mind.",0],["S6","sentence","I don't care.",0],["S7","sentence","I'd rather be a baby.",0],["S8","sentence","Hallo!",0],["S9","sentence","Whoop!",0],["S10","sentence","Hallo here!\"",0],["S11","sentence","He was checked in his transports by the churches ringing out the lustiest peals he had ever heard.",0],["S12","sentence","Clash, clash, hammer; ding, dong, bell!",0],["S13","sentence","Bell, dong, ding; hammer, clang, clash!",0],["S14","sentence","Oh, glorious, glorious!",0],["S15","sentence","Running to the window, he opened it, and put out his head.",0],["S16","sentence","No fog, no mist; clear, bright, jovial, stirring, cold; cold, piping for the blood to dance to; Golden sun-light; Heavenly sky; sweet fresh air; merry bells.",0],["S17","sentence","Oh, glorious!",0],["S18","sentence","Glorious!",0],["S19","sentence","\"What's to-day?\" cried Scrooge, calling downward to a boy in Sunday clothes, who perhaps had loitered in to look about him.",0],["S20","sentence","\"Eh?\" returned the boy with all his might of wonder.",0],["S21","sentence","\"What's to-day, my fine fellow?\" said Scrooge.",0],["S22","sentence","\"To-day!\" replied the boy.",0],["S23","sentence","\"Why, Christmas Day.\"",0],["S24","sentence","\"It's Christmas Day!\" said Scrooge to himself.",0],["S25","sentence","\"I haven't missed it.",0],["S26","sentence","The Spirits have done it all in one night.",0],["S27","sentence","They can do anything they like.",0],["S28","sentence","Of course they can.",0],["S29","sentence","Of course they can.",0],["S30","sentence","Hallo, my fine fellow!\"",0],["S31","sentence","\"Hallo!\" returned the boy.",0],["S32","sentence","\"Do you know the Poulterer's in the next street but one, at the corner?\" Scrooge inquired.",0],["S33","sentence","\"I should hope I did,\" replied the lad.",0],["S34","sentence","\"An intelligent boy!\" said Scrooge.",0],["S35","sentence","\"A remarkable boy!",0],["S36","sentence","Do you know whether they've sold the prize Turkey that was hanging up there?—",0],["S37","sentence","Not the little prize Turkey: the big one?\"",0],["S38","sentence","\"What! the one as big as me?\" returned the boy.",0],["S39","sentence","\"What a delightful boy!\" said Scrooge.",0],["S40","sentence","\"It's a pleasure to talk to him.",0],["S41","sentence","Yes, my buck!\"",0],["S42","sentence","\"It's hanging there now,\" replied the boy.",0],["S43","sentence","\"Is it?\" said Scrooge.",0],["S44","sentence","\"Go and buy it.\"",0],["S45","sentence","\"Walk-ER!\" exclaimed the boy.",0],["S46","sentence","\"No, no,\" said Scrooge, \"I am in earnest.",0],["S47","sentence","Go and buy it, and tell 'em to bring it here, that I may give them the directions where to take it.",0],["S48","sentence","Come back with the man, and I'll give you a shilling.",0],["S49","sentence","Come back with him in less than five minutes, and I'll give you half-a-crown!\"",0],["S50","sentence","The boy was off like a shot.",0],["S51","sentence","He must have had a steady hand at a trigger who could have got a shot off half so fast.",0],["S52","sentence","\"I'll send it to Bob Cratchit's,\" whispered Scrooge, rubbing his hands, and splitting with a laugh.",0],["S53","sentence","\"He shan't know who sends it.",0],["S54","sentence","It's twice the size of Tiny Tim.",0],["S55","sentence","Joe Miller never made such a joke as sending it to Bob's will be!\"",0],["S56","sentence","The hand in which he wrote the address was not a steady one; but write it he did, somehow, and went down-stairs to open the street-door, ready for the coming of the poulterer's man.",0],["S57","sentence","As he stood there, waiting his arrival, the knocker caught his eye.",0],["S58","sentence","\"I shall love it as long as I live!\" cried Scrooge, patting it with his hand.",0],["S59","sentence","\"I scarcely ever looked at it before.",0],["S60","sentence","What an honest expression it has in its",0]],"a-christmas-carol|L3:P8":[["S1","sentence","said Scrooge.",1],["S2","sentence","\"I am much obliged to you.",0],["S3","sentence","I thank you fifty times.",0],["S4","sentence","Bless you!\"",0],["S5","sentence","He went to church, and walked about the streets, and watched the people hurrying to and fro, and patted the children on the head, and questioned beggars, and looked down into the kitchens of houses, and up to the windows; and found that everything could yield him pleasure.",0],["S6","sentence","He had never dreamed that any walk—that anything—could give him so much happiness.",0],["S7","sentence","In the afternoon he turned his steps towards his nephew's house.",0],["S8","sentence","He passed the door a dozen times before he had the courage to go up and knock.",0],["S9","sentence","But he made a dash, and did it.",0],["S10","sentence","\"Is your master at home, my dear?\" said Scrooge to the girl.",0],["S11","sentence","Nice girl!",0],["S12","sentence","Very.",0],["S13","sentence","\"Yes sir.\"",0],["S14","sentence","\"Where is he, my love?\" said Scrooge.",0],["S15","sentence","\"He's in the dining-room, sir, along with mistress.",0],["S16","sentence","I'll show you up-stairs, if you please.\"",0],["S17","sentence","\"Thankee.",0],["S18","sentence","He knows me,\" said Scrooge, with his hand already on the dining-room lock.",0],["S19","sentence","\"I'll go in here, my dear.\"",0],["S20","sentence","He turned it gently, and sidled his face in round the door.",0],["S21","sentence","They were looking at the table (which was spread out in great array); for these young housekeepers are always nervous on such points, and like to see that everything is right.",0],["S22","sentence","\"Fred!\" said Scrooge.",0],["S23","sentence","Dear heart alive, how his niece by marriage started!",0],["S24","sentence","Scrooge had forgotten, for the moment, about her sitting in the corner with the footstool, or he wouldn't have done it on any account.",0],["S25","sentence","\"Why, bless my soul!\" cried Fred, \"who's that?\"",0],["S26","sentence","\"It's I. Your uncle Scrooge.",0],["S27","sentence","I have come to dinner.",0],["S28","sentence","Will you let me in, Fred?\"",0],["S29","sentence","Let him in!",0],["S30","sentence","It is a mercy he didn't shake his arm off.",0],["S31","sentence","He was at home in five minutes.",0],["S32","sentence","Nothing could be heartier.",0],["S33","sentence","His niece looked just the same.",0],["S34","sentence","So did Topper when he came.",0],["S35","sentence","So did the plump sister when she came.",0],["S36","sentence","So did every one when they came.",0],["S37","sentence","Wonderful party, wonderful games, wonderful unanimity, won-der-ful happiness!",0],["S38","sentence","But he was early at the office next morning.",0],["S39","sentence","Oh, he was early there!",0],["S40","sentence","If he could only be there first, and catch Bob Cratchit coming late!",0],["S41","sentence","That was the thing he had set his heart upon.",0],["S42","sentence","And he did it; yes, he did!",0],["S43","sentence","The clock struck nine.",0],["S44","sentence","No Bob.",0],["S45","sentence","A quarter past.",0],["S46","sentence","No Bob.",0],["S47","sentence","He was full eighteen minutes and a half behind his time.",0],["S48","sentence","Scrooge sat with his door wide open, that he might see him come into the tank.",0],["S49","sentence","His hat was off before he opened the door; his comforter too.",0],["S50","sentence","He was on his stool in a jiffy; driving away with his pen, as if he were trying to overtake nine o'clock.",0],["S51","sentence","\"Hallo!\" growled Scrooge in his accustomed voice as near as he could feign it.",0],["S52","sentence","\"What do you mean by coming here at this time of day?\"",0],["S53","sentence","\"I am very sorry, sir,\" said Bob.",0],["S54","sentence","\"I am behind my time.\"",0],["S55","sentence","\"You are!\" repeated Scrooge.",0],["S56","sentence","\"Yes.",0],["S57","sentence","I think you are.",0],["S58","sentence","Step this way, sir,",0]],"a-christmas-carol|L3:P9":[["S1","sentence","if you please.\"",1],["S2","sentence","\"It's only once a year, sir,\" pleaded Bob, appearing from the tank.",0],["S3","sentence","\"It shall not be repeated.",0],["S4","sentence","I was making rather merry yesterday, sir.\"",0],["S5","sentence","\"Now, I'll tell you what, my friend,\" said Scrooge.",0],["S6","sentence","\"I am not going to stand this sort of thing any longer.",0],["S7","sentence","And therefore,\" he continued, leaping from his stool, and giving Bob such a dig in the waistcoat that he staggered back into the tank again: \"and therefore I am about to raise your salary!\"",0],["S8","sentence","Bob trembled, and got a little nearer to the ruler.",0],["S9","sentence","He had a momentary idea of knocking Scrooge down with it, holding him, and calling to the people in the court for help and a strait-waistcoat.",0],["S10","sentence","\"A merry Christmas, Bob!\" said Scrooge with an earnestness that could not be mistaken, as he clapped him on the back.",0],["S11","sentence","\"A merrier Christmas, Bob, my good fellow, than I have given you for many a year!",0],["S12","sentence","I'll raise your salary, and endeavour to assist your struggling family, and we will discuss your affairs this very afternoon, over a Christmas bowl of smoking bishop, Bob!",0],["S13","sentence","Make up the fires and buy another coal-scuttle before you dot another i, Bob Cratchit!\"",0],["S14","sentence","Scrooge was better than his word.",0],["S15","sentence","He did it all, and infinitely more; and to Tiny Tim, who did NOT die, he was a second father.",0],["S16","sentence","He became as good a friend, as good a master, and as good a man as the good old City knew, or any other good old city, town, or borough in the good old world.",0],["S17","sentence","Some people laughed to see the alteration in him, but he let them laugh, and little heeded them; for he was wise enough to know that nothing ever happened on this globe, for good, at which some people did not have their fill of laughter in the outset; and, knowing that such as these would be blind anyway, he thought it quite as well that they should wrinkle up their eyes in grins as have the malady in less attractive forms.",0],["S18","sentence","His own heart laughed: and that was quite enough for him.",0],["S19","sentence","He had no further intercourse with Spirits, but lived upon the Total-Abstinence Principle ever afterwards; and it was always said of him that he knew how to keep Christmas well, if any man alive possessed the knowledge.",0],["S20","sentence","May that be truly said of us, and all of us!",0],["S21","sentence","And so, as Tiny Tim observed, God bless Us, Every One!",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P1":[["S1","heading","THE STRANGE CASE OF DR. JEKYLL AND MR. HYDE",1],["S2","sentence","Robert Louis Stevenson",1],["S3","heading","STORY OF THE DOOR",1],["S4","sentence","Mr. Utterson the lawyer was a man of a rugged countenance that was never lighted by a smile; cold, scanty and embarrassed in discourse; backward in sentiment; lean, long, dusty, dreary and yet somehow lovable.",1],["S5","sentence","At friendly meetings, and when the wine was to his taste, something eminently human beaconed from his eye; something indeed which never found its way into his talk, but which spoke not only in these silent symbols of the after-dinner face, but more often and loudly in the acts of his life.",0],["S6","sentence","He was austere with himself; drank gin when he was alone, to mortify a taste for vintages; and though he enjoyed the theatre, had not crossed the doors of one for twenty years.",0],["S7","sentence","But he had an approved tolerance for others; sometimes wondering, almost with envy, at the high pressure of spirits involved in their misdeeds; and in any extremity inclined to help rather than to reprove.",0],["S8","sentence","“I incline to Cain’s heresy,” he used to say quaintly: “I let my brother go to the devil in his own way.”",0],["S9","sentence","In this character, it was frequently his fortune to be the last reputable acquaintance and the last good influence in the lives of downgoing men.",0],["S10","sentence","And to such as these, so long as they came about his chambers, he never marked a shade of change in his demeanour.",0],["S11","sentence","No doubt the feat was easy to Mr. Utterson; for he was undemonstrative at the best, and even his friendship seemed to be founded in a similar catholicity of good-nature.",0],["S12","sentence","It is the mark of a modest man to accept his friendly circle ready-made from the hands of opportunity; and that was the lawyer’s way.",0],["S13","sentence","His friends were those of his own blood or those whom he had known the longest; his affections, like ivy, were the growth of time, they implied no aptness in the object.",0],["S14","sentence","Hence, no doubt the bond that united him to Mr. Richard Enfield, his distant kinsman, the well-known man about town.",0],["S15","sentence","It was a nut to crack for many, what these two could see in each other, or what subject they could find in common.",0],["S16","sentence","It was reported by those who encountered them in their Sunday walks, that they said nothing, looked singularly dull and would hail with obvious relief the appearance of a friend.",0],["S17","sentence","For all that, the two men put the greatest store by these excursions, counted them the chief jewel of each week, and not only set aside occasions of pleasure, but even resisted the calls of business, that they might enjoy them uninterrupted.",0],["S18","sentence","It chanced on one of these rambles that their way led them down a by-street in a busy quarter of London.",0],["S19","sentence","The street was small and what is called quiet, but it drove a thriving trade on the weekdays.",0],["S20","sentence","The inhabitants were all doing well, it seemed, and all emulously hoping to do better still, and laying out the surplus of their gains in coquetry; so that the shop fronts stood along that",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P3":[["S1","sentence","quite a group about the screaming child.",1],["S2","sentence","He was perfectly cool and made no resistance, but gave me one look, so ugly that it brought out the sweat on me like running.",0],["S3","sentence","The people who had turned out were the girl’s own family; and pretty soon, the doctor, for whom she had been sent, put in his appearance.",0],["S4","sentence","Well, the child was not much the worse, more frightened, according to the Sawbones; and there you might have supposed would be an end to it.",0],["S5","sentence","But there was one curious circumstance.",0],["S6","sentence","I had taken a loathing to my gentleman at first sight.",0],["S7","sentence","So had the child’s family, which was only natural.",0],["S8","sentence","But the doctor’s case was what struck me.",0],["S9","sentence","He was the usual cut and dry apothecary, of no particular age and colour, with a strong Edinburgh accent and about as emotional as a bagpipe.",0],["S10","sentence","Well, sir, he was like the rest of us; every time he looked at my prisoner, I saw that Sawbones turn sick and white with the desire to kill him.",0],["S11","sentence","I knew what was in his mind, just as he knew what was in mine; and killing being out of the question, we did the next best.",0],["S12","sentence","We told the man we could and would make such a scandal out of this as should make his name stink from one end of London to the other.",0],["S13","sentence","If he had any friends or any credit, we undertook that he should lose them.",0],["S14","sentence","And all the time, as we were pitching it in red hot, we were keeping the women off him as best we could for they were as wild as harpies.",0],["S15","sentence","I never saw a circle of such hateful faces; and there was the man in the middle, with a kind of black sneering coolness—frightened too, I could see that—but carrying it off, sir, really like Satan.",0],["S16","sentence","‘If you choose to make capital out of this accident,’ said he, ‘I am naturally helpless.",0],["S17","sentence","No gentleman but wishes to avoid a scene,’ says he.",0],["S18","sentence","‘Name your figure.’",0],["S19","sentence","Well, we screwed him up to a hundred pounds for the child’s family; he would have clearly liked to stick out; but there was something about the lot of us that meant mischief, and at last he struck.",0],["S20","sentence","The next thing was to get the money; and where do you think he carried us but to that place with the door?—whipped out a key, went in, and presently came back with the matter of ten pounds in gold and a cheque for the balance on Coutts’s, drawn payable to bearer and signed with a name that I can’t mention, though it’s one of the points of my story, but it was a name at least very well known and often printed.",0],["S21","sentence","The figure was stiff; but the signature was good for more than that if it was only genuine.",0],["S22","sentence","I took the liberty of pointing out to my gentleman that the whole business looked apocryphal, and that a man does",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P4":[["S1","sentence","not, in real life, walk into a cellar door at four in the morning and come out with another man’s cheque for close upon a hundred pounds.",1],["S2","sentence","But he was quite easy and sneering.",0],["S3","sentence","‘Set your mind at rest,’ says he, ‘I will stay with you till the banks open and cash the cheque myself.’",0],["S4","sentence","So we all set off, the doctor, and the child’s father, and our friend and myself, and passed the rest of the night in my chambers; and next day, when we had breakfasted, went in a body to the bank.",0],["S5","sentence","I gave in the cheque myself, and said I had every reason to believe it was a forgery.",0],["S6","sentence","Not a bit of it.",0],["S7","sentence","The cheque was genuine.”",0],["S8","sentence","“Tut-tut!” said Mr. Utterson.",0],["S9","sentence","“I see you feel as I do,” said Mr. Enfield.",0],["S10","sentence","“Yes, it’s a bad story.",0],["S11","sentence","For my man was a fellow that nobody could have to do with, a really damnable man; and the person that drew the cheque is the very pink of the proprieties, celebrated too, and (what makes it worse) one of your fellows who do what they call good.",0],["S12","sentence","Blackmail, I suppose; an honest man paying through the nose for some of the capers of his youth.",0],["S13","sentence","Black Mail House is what I call the place with the door, in consequence.",0],["S14","sentence","Though even that, you know, is far from explaining all,” he added, and with the words fell into a vein of musing.",0],["S15","sentence","From this he was recalled by Mr. Utterson asking rather suddenly: “And you don’t know if the drawer of the cheque lives there?”",0],["S16","sentence","“A likely place, isn’t it?” returned Mr. Enfield.",0],["S17","sentence","“But I happen to have noticed his address; he lives in some square or other.”",0],["S18","sentence","“And you never asked about the—place with the door?” said Mr. Utterson.",0],["S19","sentence","“No, sir; I had a delicacy,” was the reply.",0],["S20","sentence","“I feel very strongly about putting questions; it partakes too much of the style of the day of judgment.",0],["S21","sentence","You start a question, and it’s like starting a stone.",0],["S22","sentence","You sit quietly on the top of a hill; and away the stone goes, starting others; and presently some bland old bird (the last you would have thought of) is knocked on the head in his own back garden and the family have to change their name.",0],["S23","sentence","No sir, I make it a rule of mine: the more it looks like Queer Street, the less I ask.”",0],["S24","sentence","“A very good rule, too,” said the lawyer.",0],["S25","sentence","“But I have studied the place for myself,” continued Mr. Enfield.",0],["S26","sentence","“It seems scarcely a house.",0],["S27","sentence","There is no other door, and nobody goes in or out of that one but, once in a great while, the gentleman of my adventure.",0],["S28","sentence","There are three windows looking on the court on the first floor; none below; the windows are always shut but they’re clean.",0],["S29","sentence","And then there is a chimney which is generally smoking; so somebody must live there.",0],["S30","sentence","And yet it’s not so sure; for the",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P5":[["S1","sentence","buildings are so packed together about the court, that it’s hard to say where one ends and another begins.”",1],["S2","sentence","The pair walked on again for a while in silence; and then “Enfield,” said Mr. Utterson, “that’s a good rule of yours.”",0],["S3","sentence","“Yes, I think it is,” returned Enfield.",0],["S4","sentence","“But for all that,” continued the lawyer, “there’s one point I want to ask.",0],["S5","sentence","I want to ask the name of that man who walked over the child.”",0],["S6","sentence","“Well,” said Mr. Enfield, “I can’t see what harm it would do.",0],["S7","sentence","It was a man of the name of Hyde.”",0],["S8","sentence","“Hm,” said Mr. Utterson.",0],["S9","sentence","“What sort of a man is he to see?”",0],["S10","sentence","“He is not easy to describe.",0],["S11","sentence","There is something wrong with his appearance; something displeasing, something down-right detestable.",0],["S12","sentence","I never saw a man I so disliked, and yet I scarce know why.",0],["S13","sentence","He must be deformed somewhere; he gives a strong feeling of deformity, although I couldn’t specify the point.",0],["S14","sentence","He’s an extraordinary looking man, and yet I really can name nothing out of the way.",0],["S15","sentence","No, sir; I can make no hand of it; I can’t describe him.",0],["S16","sentence","And it’s not want of memory; for I declare I can see him this moment.”",0],["S17","sentence","Mr. Utterson again walked some way in silence and obviously under a weight of consideration.",0],["S18","sentence","“You are sure he used a key?” he inquired at last.",0],["S19","sentence","“My dear sir...” began Enfield, surprised out of himself.",0],["S20","sentence","“Yes, I know,” said Utterson; “I know it must seem strange.",0],["S21","sentence","The fact is, if I do not ask you the name of the other party, it is because I know it already.",0],["S22","sentence","You see, Richard, your tale has gone home.",0],["S23","sentence","If you have been inexact in any point you had better correct it.”",0],["S24","sentence","“I think you might have warned me,” returned the other with a touch of sullenness.",0],["S25","sentence","“But I have been pedantically exact, as you call it.",0],["S26","sentence","The fellow had a key; and what’s more, he has it still.",0],["S27","sentence","I saw him use it not a week ago.”",0],["S28","sentence","Mr. Utterson sighed deeply but said never a word; and the young man presently resumed.",0],["S29","sentence","“Here is another lesson to say nothing,” said he.",0],["S30","sentence","“I am ashamed of my long tongue.",0],["S31","sentence","Let us make a bargain never to refer to this again.”",0],["S32","sentence","“With all my heart,” said the lawyer.",0],["S33","sentence","“I shake hands on that, Richard.”",0],["S34","heading","SEARCH FOR MR. HYDE",1],["S35","sentence","That evening Mr. Utterson came home to his bachelor house in sombre spirits and sat down to dinner without relish.",1],["S36","sentence","It was his custom of a Sunday, when this meal was over, to sit close by the fire, a volume of some dry divinity on his reading desk, until the clock of the neighbouring church rang out the hour of twelve, when he would go soberly and gratefully to bed.",0],["S37","sentence","On this night however, as soon as the cloth was taken away, he took up a candle and went into his business room.",0],["S38","sentence","There he opened his safe, took from the most private part of it",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P7":[["S1","sentence","suppose we are.",1],["S2","sentence","And what of that?",0],["S3","sentence","I see little of him now.”",0],["S4","sentence","“Indeed?” said Utterson.",0],["S5","sentence","“I thought you had a bond of common interest.”",0],["S6","sentence","“We had,” was the reply.",0],["S7","sentence","“But it is more than ten years since Henry Jekyll became too fanciful for me.",0],["S8","sentence","He began to go wrong, wrong in mind; and though of course I continue to take an interest in him for old sake’s sake, as they say, I see and I have seen devilish little of the man.",0],["S9","sentence","Such unscientific balderdash,” added the doctor, flushing suddenly purple, “would have estranged Damon and Pythias.”",0],["S10","sentence","This little spirit of temper was somewhat of a relief to Mr. Utterson.",0],["S11","sentence","“They have only differed on some point of science,” he thought; and being a man of no scientific passions (except in the matter of conveyancing), he even added: “It is nothing worse than that!”",0],["S12","sentence","He gave his friend a few seconds to recover his composure, and then approached the question he had come to put.",0],["S13","sentence","“Did you ever come across a protégé of his—one Hyde?” he asked.",0],["S14","sentence","“Hyde?” repeated Lanyon.",0],["S15","sentence","“No. Never heard of him.",0],["S16","sentence","Since my time.”",0],["S17","sentence","That was the amount of information that the lawyer carried back with him to the great, dark bed on which he tossed to and fro, until the small hours of the morning began to grow large.",0],["S18","sentence","It was a night of little ease to his toiling mind, toiling in mere darkness and besieged by questions.",0],["S19","sentence","Six o’clock struck on the bells of the church that was so conveniently near to Mr. Utterson’s dwelling, and still he was digging at the problem.",0],["S20","sentence","Hitherto it had touched him on the intellectual side alone; but now his imagination also was engaged, or rather enslaved; and as he lay and tossed in the gross darkness of the night and the curtained room, Mr. Enfield’s tale went by before his mind in a scroll of lighted pictures.",0],["S21","sentence","He would be aware of the great field of lamps of a nocturnal city; then of the figure of a man walking swiftly; then of a child running from the doctor’s; and then these met, and that human Juggernaut trod the child down and passed on regardless of her screams.",0],["S22","sentence","Or else he would see a room in a rich house, where his friend lay asleep, dreaming and smiling at his dreams; and then the door of that room would be opened, the curtains of the bed plucked apart, the sleeper recalled, and lo! there would stand by his side a figure to whom power was given, and even at that dead hour, he must rise and do its bidding.",0],["S23","sentence","The figure in these two phases haunted the lawyer all night; and if at any time he dozed over, it was but to see it glide more stealthily through sleeping houses, or move the more swiftly and still the more swiftly, even to dizziness, through wider labyrinths of lamplighted city, and at every street corner crush a child and",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P8":[["S1","sentence","leave her screaming.",1],["S2","sentence","And still the figure had no face by which he might know it; even in his dreams, it had no face, or one that baffled him and melted before his eyes; and thus it was that there sprang up and grew apace in the lawyer’s mind a singularly strong, almost an inordinate, curiosity to behold the features of the real Mr. Hyde.",0],["S3","sentence","If he could but once set eyes on him, he thought the mystery would lighten and perhaps roll altogether away, as was the habit of mysterious things when well examined.",0],["S4","sentence","He might see a reason for his friend’s strange preference or bondage (call it which you please) and even for the startling clauses of the will.",0],["S5","sentence","At least it would be a face worth seeing: the face of a man who was without bowels of mercy: a face which had but to show itself to raise up, in the mind of the unimpressionable Enfield, a spirit of enduring hatred.",0],["S6","sentence","From that time forward, Mr. Utterson began to haunt the door in the by-street of shops.",0],["S7","sentence","In the morning before office hours, at noon when business was plenty and time scarce, at night under the face of the fogged city moon, by all lights and at all hours of solitude or concourse, the lawyer was to be found on his chosen post.",0],["S8","sentence","“If he be Mr. Hyde,” he had thought, “I shall be Mr. Seek.”",0],["S9","sentence","And at last his patience was rewarded.",0],["S10","sentence","It was a fine dry night; frost in the air; the streets as clean as a ballroom floor; the lamps, unshaken by any wind, drawing a regular pattern of light and shadow.",0],["S11","sentence","By ten o’clock, when the shops were closed, the by-street was very solitary and, in spite of the low growl of London from all round, very silent.",0],["S12","sentence","Small sounds carried far; domestic sounds out of the houses were clearly audible on either side of the roadway; and the rumour of the approach of any passenger preceded him by a long time.",0],["S13","sentence","Mr. Utterson had been some minutes at his post, when he was aware of an odd light footstep drawing near.",0],["S14","sentence","In the course of his nightly patrols, he had long grown accustomed to the quaint effect with which the footfalls of a single person, while he is still a great way off, suddenly spring out distinct from the vast hum and clatter of the city.",0],["S15","sentence","Yet his attention had never before been so sharply and decisively arrested; and it was with a strong, superstitious prevision of success that he withdrew into the entry of the court.",0],["S16","sentence","The steps drew swiftly nearer, and swelled out suddenly louder as they turned the end of the street.",0],["S17","sentence","The lawyer, looking forth from the entry, could soon see what manner of man he had to deal with.",0],["S18","sentence","He was small and very plainly dressed and the look of him, even at that distance, went somehow strongly against the watcher’s inclination.",0],["S19","sentence","But he made straight for",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P9":[["S1","sentence","the door, crossing the roadway to save time; and as he came, he drew a key from his pocket like one approaching home.",1],["S2","sentence","Mr. Utterson stepped out and touched him on the shoulder as he passed.",0],["S3","sentence","“Mr. Hyde, I think?”",0],["S4","sentence","Mr. Hyde shrank back with a hissing intake of the breath.",0],["S5","sentence","But his fear was only momentary; and though he did not look the lawyer in the face, he answered coolly enough: “That is my name.",0],["S6","sentence","What do you want?”",0],["S7","sentence","“I see you are going in,” returned the lawyer.",0],["S8","sentence","“I am an old friend of Dr. Jekyll’s—Mr. Utterson of Gaunt Street—you must have heard of my name; and meeting you so conveniently, I thought you might admit me.”",0],["S9","sentence","“You will not find Dr. Jekyll; he is from home,” replied Mr. Hyde, blowing in the key.",0],["S10","sentence","And then suddenly, but still without looking up, “How did you know me?” he asked.",0],["S11","sentence","“On your side,” said Mr. Utterson “will you do me a favour?”",0],["S12","sentence","“With pleasure,” replied the other.",0],["S13","sentence","“What shall it be?”",0],["S14","sentence","“Will you let me see your face?” asked the lawyer.",0],["S15","sentence","Mr. Hyde appeared to hesitate, and then, as if upon some sudden reflection, fronted about with an air of defiance; and the pair stared at each other pretty fixedly for a few seconds.",0],["S16","sentence","“Now I shall know you again,” said Mr. Utterson.",0],["S17","sentence","“It may be useful.”",0],["S18","sentence","“Yes,” returned Mr. Hyde, “it is as well we have met; and à propos, you should have my address.”",0],["S19","sentence","And he gave a number of a street in Soho.",0],["S20","sentence","“Good God!” thought Mr. Utterson, “can he, too, have been thinking of the will?”",0],["S21","sentence","But he kept his feelings to himself and only grunted in acknowledgment of the address.",0],["S22","sentence","“And now,” said the other, “how did you know me?”",0],["S23","sentence","“By description,” was the reply.",0],["S24","sentence","“Whose description?”",0],["S25","sentence","“We have common friends,” said Mr. Utterson.",0],["S26","sentence","“Common friends,” echoed Mr. Hyde, a little hoarsely.",0],["S27","sentence","“Who are they?”",0],["S28","sentence","“Jekyll, for instance,” said the lawyer.",0],["S29","sentence","“He never told you,” cried Mr. Hyde, with a flush of anger.",0],["S30","sentence","“I did not think you would have lied.”",0],["S31","sentence","“Come,” said Mr. Utterson, “that is not fitting language.”",0],["S32","sentence","The other snarled aloud into a savage laugh; and the next moment, with extraordinary quickness, he had unlocked the door and disappeared into the house.",0],["S33","sentence","The lawyer stood awhile when Mr. Hyde had left him, the picture of disquietude.",0],["S34","sentence","Then he began slowly to mount the street, pausing every step or two and putting his hand to his brow like a man in mental perplexity.",0],["S35","sentence","The problem he was thus debating as he walked, was one of a class that is rarely solved.",0],["S36","sentence","Mr. Hyde was pale and dwarfish, he gave an impression of deformity without any nameable malformation, he had a displeasing smile, he had borne himself to the lawyer with a sort of murderous mixture of timidity and boldness, and he spoke with a husky, whispering and somewhat broken voice; all these were points against him, but not all of these together could",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P10":[["S1","sentence","explain the hitherto unknown disgust, loathing and fear with which Mr. Utterson regarded him.",1],["S2","sentence","“There must be something else,” said the perplexed gentleman.",0],["S3","sentence","“There is something more, if I could find a name for it.",0],["S4","sentence","God bless me, the man seems hardly human!",0],["S5","sentence","Something troglodytic, shall we say? or can it be the old story of Dr. Fell? or is it the mere radiance of a foul soul that thus transpires through, and transfigures, its clay continent?",0],["S6","sentence","The last, I think; for, O my poor old Harry Jekyll, if ever I read Satan’s signature upon a face, it is on that of your new friend.”",0],["S7","sentence","Round the corner from the by-street, there was a square of ancient, handsome houses, now for the most part decayed from their high estate and let in flats and chambers to all sorts and conditions of men; map-engravers, architects, shady lawyers and the agents of obscure enterprises.",0],["S8","sentence","One house, however, second from the corner, was still occupied entire; and at the door of this, which wore a great air of wealth and comfort, though it was now plunged in darkness except for the fanlight, Mr. Utterson stopped and knocked.",0],["S9","sentence","A well-dressed, elderly servant opened the door.",0],["S10","sentence","“Is Dr. Jekyll at home, Poole?” asked the lawyer.",0],["S11","sentence","“I will see, Mr. Utterson,” said Poole, admitting the visitor, as he spoke, into a large, low-roofed, comfortable hall paved with flags, warmed (after the fashion of a country house) by a bright, open fire, and furnished with costly cabinets of oak.",0],["S12","sentence","“Will you wait here by the fire, sir? or shall I give you a light in the dining-room?”",0],["S13","sentence","“Here, thank you,” said the lawyer, and he drew near and leaned on the tall fender.",0],["S14","sentence","This hall, in which he was now left alone, was a pet fancy of his friend the doctor’s; and Utterson himself was wont to speak of it as the pleasantest room in London.",0],["S15","sentence","But tonight there was a shudder in his blood; the face of Hyde sat heavy on his memory; he felt (what was rare with him) a nausea and distaste of life; and in the gloom of his spirits, he seemed to read a menace in the flickering of the firelight on the polished cabinets and the uneasy starting of the shadow on the roof.",0],["S16","sentence","He was ashamed of his relief, when Poole presently returned to announce that Dr. Jekyll was gone out.",0],["S17","sentence","“I saw Mr. Hyde go in by the old dissecting room, Poole,” he said.",0],["S18","sentence","“Is that right, when Dr. Jekyll is from home?”",0],["S19","sentence","“Quite right, Mr. Utterson, sir,” replied the servant.",0],["S20","sentence","“Mr. Hyde has a key.”",0],["S21","sentence","“Your master seems to repose a great deal of trust in that young man, Poole,” resumed the other musingly.",0],["S22","sentence","“Yes, sir, he does indeed,” said Poole.",0],["S23","sentence","“We have all orders to obey him.”",0],["S24","sentence","“I do not think I ever met Mr. Hyde?” asked Utterson.",0],["S25","sentence","“O, dear no, sir.",0],["S26","sentence","He never dines here,” replied the butler.",0],["S27","sentence","“Indeed we see very little of him on",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P11":[["S1","sentence","this side of the house; he mostly comes and goes by the laboratory.”",1],["S2","sentence","“Well, good-night, Poole.”",0],["S3","sentence","“Good-night, Mr. Utterson.”",0],["S4","sentence","And the lawyer set out homeward with a very heavy heart.",0],["S5","sentence","“Poor Harry Jekyll,” he thought, “my mind misgives me he is in deep waters!",0],["S6","sentence","He was wild when he was young; a long while ago to be sure; but in the law of God, there is no statute of limitations.",0],["S7","sentence","Ah, it must be that; the ghost of some old sin, the cancer of some concealed disgrace: punishment coming, pede claudo, years after memory has forgotten and self-love condoned the fault.”",0],["S8","sentence","And the lawyer, scared by the thought, brooded awhile on his own past, groping in all the corners of memory, lest by chance some Jack-in-the-Box of an old iniquity should leap to light there.",0],["S9","sentence","His past was fairly blameless; few men could read the rolls of their life with less apprehension; yet he was humbled to the dust by the many ill things he had done, and raised up again into a sober and fearful gratitude by the many he had come so near to doing yet avoided.",0],["S10","sentence","And then by a return on his former subject, he conceived a spark of hope.",0],["S11","sentence","“This Master Hyde, if he were studied,” thought he, “must have secrets of his own; black secrets, by the look of him; secrets compared to which poor Jekyll’s worst would be like sunshine.",0],["S12","sentence","Things cannot continue as they are.",0],["S13","sentence","It turns me cold to think of this creature stealing like a thief to Harry’s bedside; poor Harry, what a wakening!",0],["S14","sentence","And the danger of it; for if this Hyde suspects the existence of the will, he may grow impatient to inherit.",0],["S15","sentence","Ah, I must put my shoulder to the wheel—if Jekyll will but let me,” he added, “if Jekyll will only let me.”",0],["S16","sentence","For once more he saw before his mind’s eye, as clear as transparency, the strange clauses of the will.",0],["S17","heading","DR. JEKYLL WAS QUITE AT EASE",1],["S18","sentence","A fortnight later, by excellent good fortune, the doctor gave one of his pleasant dinners to some five or six old cronies, all intelligent, reputable men and all judges of good wine; and Mr. Utterson so contrived that he remained behind after the others had departed.",1],["S19","sentence","This was no new arrangement, but a thing that had befallen many scores of times.",0],["S20","sentence","Where Utterson was liked, he was liked well.",0],["S21","sentence","Hosts loved to detain the dry lawyer, when the light-hearted and loose-tongued had already their foot on the threshold; they liked to sit a while in his unobtrusive company, practising for solitude, sobering their minds in the man’s rich silence after the expense and strain of gaiety.",0],["S22","sentence","To this rule, Dr. Jekyll was no exception; and as he now sat on the opposite side of the fire—a large, well-made, smooth-faced man of fifty, with something of a slyish cast perhaps, but every mark of capacity and kindness—you could see by his looks that he cherished for Mr. Utterson a sincere and warm affection.",0],["S23","sentence","“I have",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P12":[["S1","sentence","been wanting to speak to you, Jekyll,” began the latter.",1],["S2","sentence","“You know that will of yours?”",0],["S3","sentence","A close observer might have gathered that the topic was distasteful; but the doctor carried it off gaily.",0],["S4","sentence","“My poor Utterson,” said he, “you are unfortunate in such a client.",0],["S5","sentence","I never saw a man so distressed as you were by my will; unless it were that hide-bound pedant, Lanyon, at what he called my scientific heresies.",0],["S6","sentence","O, I know he’s a good fellow—you needn’t frown—an excellent fellow, and I always mean to see more of him; but a hide-bound pedant for all that; an ignorant, blatant pedant.",0],["S7","sentence","I was never more disappointed in any man than Lanyon.”",0],["S8","sentence","“You know I never approved of it,” pursued Utterson, ruthlessly disregarding the fresh topic.",0],["S9","sentence","“My will?",0],["S10","sentence","Yes, certainly, I know that,” said the doctor, a trifle sharply.",0],["S11","sentence","“You have told me so.”",0],["S12","sentence","“Well, I tell you so again,” continued the lawyer.",0],["S13","sentence","“I have been learning something of young Hyde.”",0],["S14","sentence","The large handsome face of Dr. Jekyll grew pale to the very lips, and there came a blackness about his eyes.",0],["S15","sentence","“I do not care to hear more,” said he.",0],["S16","sentence","“This is a matter I thought we had agreed to drop.”",0],["S17","sentence","“What I heard was abominable,” said Utterson.",0],["S18","sentence","“It can make no change.",0],["S19","sentence","You do not understand my position,” returned the doctor, with a certain incoherency of manner.",0],["S20","sentence","“I am painfully situated, Utterson; my position is a very strange—a very strange one.",0],["S21","sentence","It is one of those affairs that cannot be mended by talking.”",0],["S22","sentence","“Jekyll,” said Utterson, “you know me: I am a man to be trusted.",0],["S23","sentence","Make a clean breast of this in confidence; and I make no doubt I can get you out of it.”",0],["S24","sentence","“My good Utterson,” said the doctor, “this is very good of you, this is downright good of you, and I cannot find words to thank you in.",0],["S25","sentence","I believe you fully; I would trust you before any man alive, ay, before myself, if I could make the choice; but indeed it isn’t what you fancy; it is not as bad as that; and just to put your good heart at rest, I will tell you one thing: the moment I choose, I can be rid of Mr. Hyde.",0],["S26","sentence","I give you my hand upon that; and I thank you again and again; and I will just add one little word, Utterson, that I’m sure you’ll take in good part: this is a private matter, and I beg of you to let it sleep.”",0],["S27","sentence","Utterson reflected a little, looking in the fire.",0],["S28","sentence","“I have no doubt you are perfectly right,” he said at last, getting to his feet.",0],["S29","sentence","“Well, but since we have touched upon this business, and for the last time I hope,” continued the doctor, “there is one point I should like you to understand.",0],["S30","sentence","I have really a very great interest in poor Hyde.",0],["S31","sentence","I know you have seen him; he told me so; and I fear he",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P13":[["S1","sentence","was rude.",1],["S2","sentence","But I do sincerely take a great, a very great interest in that young man; and if I am taken away, Utterson, I wish you to promise me that you will bear with him and get his rights for him.",0],["S3","sentence","I think you would, if you knew all; and it would be a weight off my mind if you would promise.”",0],["S4","sentence","“I can’t pretend that I shall ever like him,” said the lawyer.",0],["S5","sentence","“I don’t ask that,” pleaded Jekyll, laying his hand upon the other’s arm; “I only ask for justice; I only ask you to help him for my sake, when I am no longer here.”",0],["S6","sentence","Utterson heaved an irrepressible sigh.",0],["S7","sentence","“Well,” said he, “I promise.”",0],["S8","heading","THE CAREW MURDER CASE",1],["S9","sentence","Nearly a year later, in the month of October, 18—, London was startled by a crime of singular ferocity and rendered all the more notable by the high position of the victim.",1],["S10","sentence","The details were few and startling.",0],["S11","sentence","A maid servant living alone in a house not far from the river, had gone upstairs to bed about eleven.",0],["S12","sentence","Although a fog rolled over the city in the small hours, the early part of the night was cloudless, and the lane, which the maid’s window overlooked, was brilliantly lit by the full moon.",0],["S13","sentence","It seems she was romantically given, for she sat down upon her box, which stood immediately under the window, and fell into a dream of musing.",0],["S14","sentence","Never (she used to say, with streaming tears, when she narrated that experience), never had she felt more at peace with all men or thought more kindly of the world.",0],["S15","sentence","And as she so sat she became aware of an aged beautiful gentleman with white hair, drawing near along the lane; and advancing to meet him, another and very small gentleman, to whom at first she paid less attention.",0],["S16","sentence","When they had come within speech (which was just under the maid’s eyes) the older man bowed and accosted the other with a very pretty manner of politeness.",0],["S17","sentence","It did not seem as if the subject of his address were of great importance; indeed, from his pointing, it sometimes appeared as if he were only inquiring his way; but the moon shone on his face as he spoke, and the girl was pleased to watch it, it seemed to breathe such an innocent and old-world kindness of disposition, yet with something high too, as of a well-founded self-content.",0],["S18","sentence","Presently her eye wandered to the other, and she was surprised to recognise in him a certain Mr. Hyde, who had once visited her master and for whom she had conceived a dislike.",0],["S19","sentence","He had in his hand a heavy cane, with which he was trifling; but he answered never a word, and seemed to listen with an ill-contained impatience.",0],["S20","sentence","And then all of a sudden he broke out in a great flame of anger, stamping with his foot, brandishing the cane, and carrying on (as the maid described it) like a madman.",0],["S21","sentence","The old gentleman",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P17":[["S1","sentence","out upon the court by three dusty windows barred with iron.",1],["S2","sentence","The fire burned in the grate; a lamp was set lighted on the chimney shelf, for even in the houses the fog began to lie thickly; and there, close up to the warmth, sat Dr. Jekyll, looking deathly sick.",0],["S3","sentence","He did not rise to meet his visitor, but held out a cold hand and bade him welcome in a changed voice.",0],["S4","sentence","“And now,” said Mr. Utterson, as soon as Poole had left them, “you have heard the news?”",0],["S5","sentence","The doctor shuddered.",0],["S6","sentence","“They were crying it in the square,” he said.",0],["S7","sentence","“I heard them in my dining-room.”",0],["S8","sentence","“One word,” said the lawyer.",0],["S9","sentence","“Carew was my client, but so are you, and I want to know what I am doing.",0],["S10","sentence","You have not been mad enough to hide this fellow?”",0],["S11","sentence","“Utterson, I swear to God,” cried the doctor, “I swear to God I will never set eyes on him again.",0],["S12","sentence","I bind my honour to you that I am done with him in this world.",0],["S13","sentence","It is all at an end.",0],["S14","sentence","And indeed he does not want my help; you do not know him as I do; he is safe, he is quite safe; mark my words, he will never more be heard of.”",0],["S15","sentence","The lawyer listened gloomily; he did not like his friend’s feverish manner.",0],["S16","sentence","“You seem pretty sure of him,” said he; “and for your sake, I hope you may be right.",0],["S17","sentence","If it came to a trial, your name might appear.”",0],["S18","sentence","“I am quite sure of him,” replied Jekyll; “I have grounds for certainty that I cannot share with any one.",0],["S19","sentence","But there is one thing on which you may advise me.",0],["S20","sentence","I have—I have received a letter; and I am at a loss whether I should show it to the police.",0],["S21","sentence","I should like to leave it in your hands, Utterson; you would judge wisely, I am sure; I have so great a trust in you.”",0],["S22","sentence","“You fear, I suppose, that it might lead to his detection?” asked the lawyer.",0],["S23","sentence","“No,” said the other.",0],["S24","sentence","“I cannot say that I care what becomes of Hyde; I am quite done with him.",0],["S25","sentence","I was thinking of my own character, which this hateful business has rather exposed.”",0],["S26","sentence","Utterson ruminated awhile; he was surprised at his friend’s selfishness, and yet relieved by it.",0],["S27","sentence","“Well,” said he, at last, “let me see the letter.”",0],["S28","sentence","The letter was written in an odd, upright hand and signed “Edward Hyde”: and it signified, briefly enough, that the writer’s benefactor, Dr. Jekyll, whom he had long so unworthily repaid for a thousand generosities, need labour under no alarm for his safety, as he had means of escape on which he placed a sure dependence.",0],["S29","sentence","The lawyer liked this letter well enough; it put a better colour on the intimacy than he had looked for; and he blamed himself for some of his past suspicions.",0],["S30","sentence","“Have you the envelope?” he asked.",0],["S31","sentence","“I burned it,” replied Jekyll, “before",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P18":[["S1","sentence","I thought what I was about.",1],["S2","sentence","But it bore no postmark.",0],["S3","sentence","The note was handed in.”",0],["S4","sentence","“Shall I keep this and sleep upon it?” asked Utterson.",0],["S5","sentence","“I wish you to judge for me entirely,” was the reply.",0],["S6","sentence","“I have lost confidence in myself.”",0],["S7","sentence","“Well, I shall consider,” returned the lawyer.",0],["S8","sentence","“And now one word more: it was Hyde who dictated the terms in your will about that disappearance?”",0],["S9","sentence","The doctor seemed seized with a qualm of faintness; he shut his mouth tight and nodded.",0],["S10","sentence","“I knew it,” said Utterson.",0],["S11","sentence","“He meant to murder you.",0],["S12","sentence","You had a fine escape.”",0],["S13","sentence","“I have had what is far more to the purpose,” returned the doctor solemnly: “I have had a lesson—O God, Utterson, what a lesson I have had!”",0],["S14","sentence","And he covered his face for a moment with his hands.",0],["S15","sentence","On his way out, the lawyer stopped and had a word or two with Poole.",0],["S16","sentence","“By the bye,” said he, “there was a letter handed in to-day: what was the messenger like?”",0],["S17","sentence","But Poole was positive nothing had come except by post; “and only circulars by that,” he added.",0],["S18","sentence","This news sent off the visitor with his fears renewed.",0],["S19","sentence","Plainly the letter had come by the laboratory door; possibly, indeed, it had been written in the cabinet; and if that were so, it must be differently judged, and handled with the more caution.",0],["S20","sentence","The newsboys, as he went, were crying themselves hoarse along the footways: “Special edition.",0],["S21","sentence","Shocking murder of an M.P.”",0],["S22","sentence","That was the funeral oration of one friend and client; and he could not help a certain apprehension lest the good name of another should be sucked down in the eddy of the scandal.",0],["S23","sentence","It was, at least, a ticklish decision that he had to make; and self-reliant as he was by habit, he began to cherish a longing for advice.",0],["S24","sentence","It was not to be had directly; but perhaps, he thought, it might be fished for.",0],["S25","sentence","Presently after, he sat on one side of his own hearth, with Mr. Guest, his head clerk, upon the other, and midway between, at a nicely calculated distance from the fire, a bottle of a particular old wine that had long dwelt unsunned in the foundations of his house.",0],["S26","sentence","The fog still slept on the wing above the drowned city, where the lamps glimmered like carbuncles; and through the muffle and smother of these fallen clouds, the procession of the town’s life was still rolling in through the great arteries with a sound as of a mighty wind.",0],["S27","sentence","But the room was gay with firelight.",0],["S28","sentence","In the bottle the acids were long ago resolved; the imperial dye had softened with time, as the colour grows richer in stained windows; and the glow of hot autumn afternoons on hillside vineyards, was ready to be set free and to disperse the fogs of London.",0],["S29","sentence","Insensibly the lawyer melted.",0],["S30","sentence","There was no man from whom he kept fewer secrets than Mr. Guest; and he was not always",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P22":[["S1","sentence","addressed by the hand and sealed with the seal of his dead friend.",1],["S2","sentence","“PRIVATE: for the hands of G. J. Utterson ALONE, and in case of his predecease to be destroyed unread,” so it was emphatically superscribed; and the lawyer dreaded to behold the contents.",0],["S3","sentence","“I have buried one friend to-day,” he thought: “what if this should cost me another?”",0],["S4","sentence","And then he condemned the fear as a disloyalty, and broke the seal.",0],["S5","sentence","Within there was another enclosure, likewise sealed, and marked upon the cover as “not to be opened till the death or disappearance of Dr. Henry Jekyll.”",0],["S6","sentence","Utterson could not trust his eyes.",0],["S7","sentence","Yes, it was disappearance; here again, as in the mad will which he had long ago restored to its author, here again were the idea of a disappearance and the name of Henry Jekyll bracketed.",0],["S8","sentence","But in the will, that idea had sprung from the sinister suggestion of the man Hyde; it was set there with a purpose all too plain and horrible.",0],["S9","sentence","Written by the hand of Lanyon, what should it mean?",0],["S10","sentence","A great curiosity came on the trustee, to disregard the prohibition and dive at once to the bottom of these mysteries; but professional honour and faith to his dead friend were stringent obligations; and the packet slept in the inmost corner of his private safe.",0],["S11","sentence","It is one thing to mortify curiosity, another to conquer it; and it may be doubted if, from that day forth, Utterson desired the society of his surviving friend with the same eagerness.",0],["S12","sentence","He thought of him kindly; but his thoughts were disquieted and fearful.",0],["S13","sentence","He went to call indeed; but he was perhaps relieved to be denied admittance; perhaps, in his heart, he preferred to speak with Poole upon the doorstep and surrounded by the air and sounds of the open city, rather than to be admitted into that house of voluntary bondage, and to sit and speak with its inscrutable recluse.",0],["S14","sentence","Poole had, indeed, no very pleasant news to communicate.",0],["S15","sentence","The doctor, it appeared, now more than ever confined himself to the cabinet over the laboratory, where he would sometimes even sleep; he was out of spirits, he had grown very silent, he did not read; it seemed as if he had something on his mind.",0],["S16","sentence","Utterson became so used to the unvarying character of these reports, that he fell off little by little in the frequency of his visits.",0],["S17","heading","INCIDENT AT THE WINDOW",1],["S18","sentence","It chanced on Sunday, when Mr. Utterson was on his usual walk with Mr. Enfield, that their way lay once again through the by-street; and that when they came in front of the door, both stopped to gaze on it.",1],["S19","sentence","“Well,” said Enfield, “that story’s at an end at least.",0],["S20","sentence","We shall never see more of Mr. Hyde.”",0],["S21","sentence","“I hope not,” said Utterson.",0],["S22","sentence","“Did I ever tell you that I once saw him, and shared your feeling of repulsion?”",0],["S23","sentence","“It was impossible to do the one without the other,” returned Enfield.",0],["S24","sentence","“And by the way,",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P23":[["S1","sentence","what an ass you must have thought me, not to know that this was a back way to Dr. Jekyll’s!",1],["S2","sentence","It was partly your own fault that I found it out, even when I did.”",0],["S3","sentence","“So you found it out, did you?” said Utterson.",0],["S4","sentence","“But if that be so, we may step into the court and take a look at the windows.",0],["S5","sentence","To tell you the truth, I am uneasy about poor Jekyll; and even outside, I feel as if the presence of a friend might do him good.”",0],["S6","sentence","The court was very cool and a little damp, and full of premature twilight, although the sky, high up overhead, was still bright with sunset.",0],["S7","sentence","The middle one of the three windows was half-way open; and sitting close beside it, taking the air with an infinite sadness of mien, like some disconsolate prisoner, Utterson saw Dr. Jekyll.",0],["S8","sentence","“What!",0],["S9","sentence","Jekyll!",0],["S10","sentence","Jekyll!” he cried.",0],["S11","sentence","“I trust you are better.”",0],["S12","sentence","“I am very low, Utterson,” replied the doctor drearily, “very low.",0],["S13","sentence","It will not last long, thank God.”",0],["S14","sentence","“You stay too much indoors,” said the lawyer.",0],["S15","sentence","“You should be out, whipping up the circulation like Mr. Enfield and me.",0],["S16","sentence","(This is my cousin—Mr. Enfield—Dr. Jekyll.)",0],["S17","sentence","Come now; get your hat and take a quick turn with us.”",0],["S18","sentence","“You are very good,” sighed the other.",0],["S19","sentence","“I should like to very much; but no, no, no, it is quite impossible; I dare not.",0],["S20","sentence","But indeed, Utterson, I am very glad to see you; this is really a great pleasure; I would ask you and Mr. Enfield up, but the place is really not fit.”",0],["S21","sentence","“Why, then,” said the lawyer, good-naturedly, “the best thing we can do is to stay down here and speak with you from where we are.”",0],["S22","sentence","“That is just what I was about to venture to propose,” returned the doctor with a smile.",0],["S23","sentence","But the words were hardly uttered, before the smile was struck out of his face and succeeded by an expression of such abject terror and despair, as froze the very blood of the two gentlemen below.",0],["S24","sentence","They saw it but for a glimpse for the window was instantly thrust down; but that glimpse had been sufficient, and they turned and left the court without a word.",0],["S25","sentence","In silence, too, they traversed the by-street; and it was not until they had come into a neighbouring thoroughfare, where even upon a Sunday there were still some stirrings of life, that Mr. Utterson at last turned and looked at his companion.",0],["S26","sentence","They were both pale; and there was an answering horror in their eyes.",0],["S27","sentence","“God forgive us, God forgive us,” said Mr. Utterson.",0],["S28","sentence","But Mr. Enfield only nodded his head very seriously, and walked on once more in silence.",0],["S29","heading","THE LAST NIGHT",1],["S30","sentence","Mr. Utterson was sitting by his fireside one evening after dinner, when he was surprised to receive a visit from Poole.",1],["S31","sentence","“Bless me, Poole, what brings you here?” he cried; and then taking a second look at him, “What ails you?” he added; “is",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P15":[["S1","sentence","the cab crawled from street to street, Mr. Utterson beheld a marvelous number of degrees and hues of twilight; for here it would be dark like the back-end of evening; and there would be a glow of a rich, lurid brown, like the light of some strange conflagration; and here, for a moment, the fog would be quite broken up, and a haggard shaft of daylight would glance in between the swirling wreaths.",1],["S2","sentence","The dismal quarter of Soho seen under these changing glimpses, with its muddy ways, and slatternly passengers, and its lamps, which had never been extinguished or had been kindled afresh to combat this mournful reinvasion of darkness, seemed, in the lawyer’s eyes, like a district of some city in a nightmare.",0],["S3","sentence","The thoughts of his mind, besides, were of the gloomiest dye; and when he glanced at the companion of his drive, he was conscious of some touch of that terror of the law and the law’s officers, which may at times assail the most honest.",0],["S4","sentence","As the cab drew up before the address indicated, the fog lifted a little and showed him a dingy street, a gin palace, a low French eating house, a shop for the retail of penny numbers and twopenny salads, many ragged children huddled in the doorways, and many women of many different nationalities passing out, key in hand, to have a morning glass; and the next moment the fog settled down again upon that part, as brown as umber, and cut him off from his blackguardly surroundings.",0],["S5","sentence","This was the home of Henry Jekyll’s favourite; of a man who was heir to a quarter of a million sterling.",0],["S6","sentence","An ivory-faced and silvery-haired old woman opened the door.",0],["S7","sentence","She had an evil face, smoothed by hypocrisy: but her manners were excellent.",0],["S8","sentence","Yes, she said, this was Mr. Hyde’s, but he was not at home; he had been in that night very late, but he had gone away again in less than an hour; there was nothing strange in that; his habits were very irregular, and he was often absent; for instance, it was nearly two months since she had seen him till yesterday.",0],["S9","sentence","“Very well, then, we wish to see his rooms,” said the lawyer; and when the woman began to declare it was impossible, “I had better tell you who this person is,” he added.",0],["S10","sentence","“This is Inspector Newcomen of Scotland Yard.”",0],["S11","sentence","A flash of odious joy appeared upon the woman’s face.",0],["S12","sentence","“Ah!” said she, “he is in trouble!",0],["S13","sentence","What has he done?”",0],["S14","sentence","Mr. Utterson and the inspector exchanged glances.",0],["S15","sentence","“He don’t seem a very popular character,” observed the latter.",0],["S16","sentence","“And now, my good woman, just let me and this gentleman have a look about us.”",0],["S17","sentence","In the whole extent of the house, which but for the old woman remained otherwise empty, Mr. Hyde had only used a couple of rooms; but these were furnished with luxury and good taste.",0],["S18","sentence","A closet was filled with wine; the plate was of silver,",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P19":[["S1","sentence","sure that he kept as many as he meant.",1],["S2","sentence","Guest had often been on business to the doctor’s; he knew Poole; he could scarce have failed to hear of Mr. Hyde’s familiarity about the house; he might draw conclusions: was it not as well, then, that he should see a letter which put that mystery to rights? and above all since Guest, being a great student and critic of handwriting, would consider the step natural and obliging?",0],["S3","sentence","The clerk, besides, was a man of counsel; he could scarce read so strange a document without dropping a remark; and by that remark Mr. Utterson might shape his future course.",0],["S4","sentence","“This is a sad business about Sir Danvers,” he said.",0],["S5","sentence","“Yes, sir, indeed.",0],["S6","sentence","It has elicited a great deal of public feeling,” returned Guest.",0],["S7","sentence","“The man, of course, was mad.”",0],["S8","sentence","“I should like to hear your views on that,” replied Utterson.",0],["S9","sentence","“I have a document here in his handwriting; it is between ourselves, for I scarce know what to do about it; it is an ugly business at the best.",0],["S10","sentence","But there it is; quite in your way: a murderer’s autograph.”",0],["S11","sentence","Guest’s eyes brightened, and he sat down at once and studied it with passion.",0],["S12","sentence","“No sir,” he said: “not mad; but it is an odd hand.”",0],["S13","sentence","“And by all accounts a very odd writer,” added the lawyer.",0],["S14","sentence","Just then the servant entered with a note.",0],["S15","sentence","“Is that from Dr. Jekyll, sir?” inquired the clerk.",0],["S16","sentence","“I thought I knew the writing.",0],["S17","sentence","Anything private, Mr. Utterson?”",0],["S18","sentence","“Only an invitation to dinner.",0],["S19","sentence","Why?",0],["S20","sentence","Do you want to see it?”",0],["S21","sentence","“One moment.",0],["S22","sentence","I thank you, sir;” and the clerk laid the two sheets of paper alongside and sedulously compared their contents.",0],["S23","sentence","“Thank you, sir,” he said at last, returning both; “it’s a very interesting autograph.”",0],["S24","sentence","There was a pause, during which Mr. Utterson struggled with himself.",0],["S25","sentence","“Why did you compare them, Guest?” he inquired suddenly.",0],["S26","sentence","“Well, sir,” returned the clerk, “there’s a rather singular resemblance; the two hands are in many points identical: only differently sloped.”",0],["S27","sentence","“Rather quaint,” said Utterson.",0],["S28","sentence","“It is, as you say, rather quaint,” returned Guest.",0],["S29","sentence","“I wouldn’t speak of this note, you know,” said the master.",0],["S30
