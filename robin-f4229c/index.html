","sentence","“No, sir,” said the clerk.",0],["S31","sentence","“I understand.”",0],["S32","sentence","But no sooner was Mr. Utterson alone that night, than he locked the note into his safe, where it reposed from that time forward.",0],["S33","sentence","“What!” he thought.",0],["S34","sentence","“Henry Jekyll forge for a murderer!”",0],["S35","sentence","And his blood ran cold in his veins.",0],["S36","heading","INCIDENT OF DR. LANYON",1],["S37","sentence","Time ran on; thousands of pounds were offered in reward, for the death of Sir Danvers was resented as a public injury; but Mr. Hyde had disappeared out of the ken of the police as though he had never existed.",1],["S38","sentence","Much of his past was unearthed, indeed, and all disreputable: tales came out of the man’s cruelty, at once so callous and violent; of his vile life, of his strange associates, of the hatred that seemed to have surrounded his career; but of his present whereabouts, not",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P1":[["S1","sentence","that he wiped away, but the moisture of some strangling anguish; for his face was white and his voice, when he spoke, harsh and broken.",1],["S2","sentence","“Well, sir,” he said, “here we are, and God grant there be nothing wrong.”",0],["S3","sentence","“Amen, Poole,” said the lawyer.",0],["S4","sentence","Thereupon the servant knocked in a very guarded manner; the door was opened on the chain; and a voice asked from within, “Is that you, Poole?”",0],["S5","sentence","“It’s all right,” said Poole.",0],["S6","sentence","“Open the door.”",0],["S7","sentence","The hall, when they entered it, was brightly lighted up; the fire was built high; and about the hearth the whole of the servants, men and women, stood huddled together like a flock of sheep.",0],["S8","sentence","At the sight of Mr. Utterson, the housemaid broke into hysterical whimpering; and the cook, crying out “Bless God! it’s Mr. Utterson,” ran forward as if to take him in her arms.",0],["S9","sentence","“What, what?",0],["S10","sentence","Are you all here?” said the lawyer peevishly.",0],["S11","sentence","“Very irregular, very unseemly; your master would be far from pleased.”",0],["S12","sentence","“They’re all afraid,” said Poole.",0],["S13","sentence","Blank silence followed, no one protesting; only the maid lifted her voice and now wept loudly.",0],["S14","sentence","“Hold your tongue!” Poole said to her, with a ferocity of accent that testified to his own jangled nerves; and indeed, when the girl had so suddenly raised the note of her lamentation, they had all started and turned towards the inner door with faces of dreadful expectation.",0],["S15","sentence","“And now,” continued the butler, addressing the knife-boy, “reach me a candle, and we’ll get this through hands at once.”",0],["S16","sentence","And then he begged Mr. Utterson to follow him, and led the way to the back garden.",0],["S17","sentence","“Now, sir,” said he, “you come as gently as you can.",0],["S18","sentence","I want you to hear, and I don’t want you to be heard.",0],["S19","sentence","And see here, sir, if by any chance he was to ask you in, don’t go.”",0],["S20","sentence","Mr. Utterson’s nerves, at this unlooked-for termination, gave a jerk that nearly threw him from his balance; but he recollected his courage and followed the butler into the laboratory building through the surgical theatre, with its lumber of crates and bottles, to the foot of the stair.",0],["S21","sentence","Here Poole motioned him to stand on one side and listen; while he himself, setting down the candle and making a great and obvious call on his resolution, mounted the steps and knocked with a somewhat uncertain hand on the red baize of the cabinet door.",0],["S22","sentence","“Mr. Utterson, sir, asking to see you,” he called; and even as he did so, once more violently signed to the lawyer to give ear.",0],["S23","sentence","A voice answered from within: “Tell him I cannot see anyone,” it said complainingly.",0],["S24","sentence","“Thank you, sir,” said Poole, with a note of something like triumph in his voice; and taking up his candle, he led Mr. Utterson back across the yard and into the great kitchen, where the fire was out and the beetles were leaping on the floor.",0],["S25","sentence","“Sir,” he said, looking Mr. Utterson in the eyes, “Was",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P2":[["S1","sentence","that my master’s voice?”",1],["S2","sentence","“It seems much changed,” replied the lawyer, very pale, but giving look for look.",0],["S3","sentence","“Changed?",0],["S4","sentence","Well, yes, I think so,” said the butler.",0],["S5","sentence","“Have I been twenty years in this man’s house, to be deceived about his voice?",0],["S6","sentence","No, sir; master’s made away with; he was made away with eight days ago, when we heard him cry out upon the name of God; and who’s in there instead of him, and why it stays there, is a thing that cries to Heaven, Mr. Utterson!”",0],["S7","sentence","“That is a very strange tale, Poole; this is rather a wild tale my man,” said Mr. Utterson, biting his finger.",0],["S8","sentence","“Suppose it were as you suppose, supposing Dr. Jekyll to have been—well, murdered, what could induce the murderer to stay?",0],["S9","sentence","That won’t hold water; it doesn’t commend itself to reason.”",0],["S10","sentence","“Well, Mr. Utterson, you are a hard man to satisfy, but I’ll do it yet,” said Poole.",0],["S11","sentence","“All this last week (you must know) him, or it, whatever it is that lives in that cabinet, has been crying night and day for some sort of medicine and cannot get it to his mind.",0],["S12","sentence","It was sometimes his way—the master’s, that is—to write his orders on a sheet of paper and throw it on the stair.",0],["S13","sentence","We’ve had nothing else this week back; nothing but papers, and a closed door, and the very meals left there to be smuggled in when nobody was looking.",0],["S14","sentence","Well, sir, every day, ay, and twice and thrice in the same day, there have been orders and complaints, and I have been sent flying to all the wholesale chemists in town.",0],["S15","sentence","Every time I brought the stuff back, there would be another paper telling me to return it, because it was not pure, and another order to a different firm.",0],["S16","sentence","This drug is wanted bitter bad, sir, whatever for.”",0],["S17","sentence","“Have you any of these papers?” asked Mr. Utterson.",0],["S18","sentence","Poole felt in his pocket and handed out a crumpled note, which the lawyer, bending nearer to the candle, carefully examined.",0],["S19","sentence","Its contents ran thus: “Dr. Jekyll presents his compliments to Messrs. Maw.",0],["S20","sentence","He assures them that their last sample is impure and quite useless for his present purpose.",0],["S21","sentence","In the year 18—, Dr. J. purchased a somewhat large quantity from Messrs. M. He now begs them to search with most sedulous care, and should any of the same quality be left, forward it to him at once.",0],["S22","sentence","Expense is no consideration.",0],["S23","sentence","The importance of this to Dr. J. can hardly be exaggerated.”",0],["S24","sentence","So far the letter had run composedly enough, but here with a sudden splutter of the pen, the writer’s emotion had broken loose.",0],["S25","sentence","“For God’s sake,” he added, “find me some of the old.”",0],["S26","sentence","“This is a strange note,” said Mr. Utterson; and then sharply, “How do you come to have it open?”",0],["S27","sentence","“The man at Maw’s was main angry, sir, and he threw it back to me like so much dirt,” returned Poole.",0],["S28","sentence","“This is",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P5":[["S1","sentence","the corner with a pair of good sticks and take your post at the laboratory door.",1],["S2","sentence","We give you ten minutes to get to your stations.”",0],["S3","sentence","As Bradshaw left, the lawyer looked at his watch.",0],["S4","sentence","“And now, Poole, let us get to ours,” he said; and taking the poker under his arm, led the way into the yard.",0],["S5","sentence","The scud had banked over the moon, and it was now quite dark.",0],["S6","sentence","The wind, which only broke in puffs and draughts into that deep well of building, tossed the light of the candle to and fro about their steps, until they came into the shelter of the theatre, where they sat down silently to wait.",0],["S7","sentence","London hummed solemnly all around; but nearer at hand, the stillness was only broken by the sounds of a footfall moving to and fro along the cabinet floor.",0],["S8","sentence","“So it will walk all day, sir,” whispered Poole; “ay, and the better part of the night.",0],["S9","sentence","Only when a new sample comes from the chemist, there’s a bit of a break.",0],["S10","sentence","Ah, it’s an ill conscience that’s such an enemy to rest!",0],["S11","sentence","Ah, sir, there’s blood foully shed in every step of it!",0],["S12","sentence","But hark again, a little closer—put your heart in your ears, Mr. Utterson, and tell me, is that the doctor’s foot?”",0],["S13","sentence","The steps fell lightly and oddly, with a certain swing, for all they went so slowly; it was different indeed from the heavy creaking tread of Henry Jekyll.",0],["S14","sentence","Utterson sighed.",0],["S15","sentence","“Is there never anything else?” he asked.",0],["S16","sentence","Poole nodded.",0],["S17","sentence","“Once,” he said.",0],["S18","sentence","“Once I heard it weeping!”",0],["S19","sentence","“Weeping? how that?” said the lawyer, conscious of a sudden chill of horror.",0],["S20","sentence","“Weeping like a woman or a lost soul,” said the butler.",0],["S21","sentence","“I came away with that upon my heart, that I could have wept too.”",0],["S22","sentence","But now the ten minutes drew to an end.",0],["S23","sentence","Poole disinterred the axe from under a stack of packing straw; the candle was set upon the nearest table to light them to the attack; and they drew near with bated breath to where that patient foot was still going up and down, up and down, in the quiet of the night.",0],["S24","sentence","“Jekyll,” cried Utterson, with a loud voice, “I demand to see you.”",0],["S25","sentence","He paused a moment, but there came no reply.",0],["S26","sentence","“I give you fair warning, our suspicions are aroused, and I must and shall see you,” he resumed; “if not by fair means, then by foul—if not of your consent, then by brute force!”",0],["S27","sentence","“Utterson,” said the voice, “for God’s sake, have mercy!”",0],["S28","sentence","“Ah, that’s not Jekyll’s voice—it’s Hyde’s!” cried Utterson.",0],["S29","sentence","“Down with the door, Poole!”",0],["S30","sentence","Poole swung the axe over his shoulder; the blow shook the building, and the red baize door leaped against the lock and hinges.",0],["S31","sentence","A dismal screech, as of mere animal terror, rang from the cabinet.",0],["S32","sentence","Up went the axe again, and again the panels crashed and the frame bounded; four times the blow fell; but the wood was tough and",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P6":[["S1","sentence","the fittings were of excellent workmanship; and it was not until the fifth, that the lock burst and the wreck of the door fell inwards on the carpet.",1],["S2","sentence","The besiegers, appalled by their own riot and the stillness that had succeeded, stood back a little and peered in.",0],["S3","sentence","There lay the cabinet before their eyes in the quiet lamplight, a good fire glowing and chattering on the hearth, the kettle singing its thin strain, a drawer or two open, papers neatly set forth on the business table, and nearer the fire, the things laid out for tea; the quietest room, you would have said, and, but for the glazed presses full of chemicals, the most commonplace that night in London.",0],["S4","sentence","Right in the middle there lay the body of a man sorely contorted and still twitching.",0],["S5","sentence","They drew near on tiptoe, turned it on his back and beheld the face of Edward Hyde.",0],["S6","sentence","He was dressed in clothes far too large for him, clothes of the doctor’s bigness; the cords of his face still moved with a semblance of life, but life was quite gone; and by the crushed phial in the hand and the strong smell of kernels that hung upon the air, Utterson knew that he was looking on the body of a self-destroyer.",0],["S7","sentence","“We have come too late,” he said sternly, “whether to save or punish.",0],["S8","sentence","Hyde is gone to his account; and it only remains for us to find the body of your master.”",0],["S9","sentence","The far greater proportion of the building was occupied by the theatre, which filled almost the whole ground storey and was lighted from above, and by the cabinet, which formed an upper storey at one end and looked upon the court.",0],["S10","sentence","A corridor joined the theatre to the door on the by-street; and with this the cabinet communicated separately by a second flight of stairs.",0],["S11","sentence","There were besides a few dark closets and a spacious cellar.",0],["S12","sentence","All these they now thoroughly examined.",0],["S13","sentence","Each closet needed but a glance, for all were empty, and all, by the dust that fell from their doors, had stood long unopened.",0],["S14","sentence","The cellar, indeed, was filled with crazy lumber, mostly dating from the times of the surgeon who was Jekyll’s predecessor; but even as they opened the door they were advertised of the uselessness of further search, by the fall of a perfect mat of cobweb which had for years sealed up the entrance.",0],["S15","sentence","Nowhere was there any trace of Henry Jekyll, dead or alive.",0],["S16","sentence","Poole stamped on the flags of the corridor.",0],["S17","sentence","“He must be buried here,” he said, hearkening to the sound.",0],["S18","sentence","“Or he may have fled,” said Utterson, and he turned to examine the door in the by-street.",0],["S19","sentence","It was locked; and lying near by on the flags, they found the key, already stained with rust.",0],["S20","sentence","“This does not look like use,” observed the lawyer.",0],["S21","sentence","“Use!” echoed Poole.",0],["S22","sentence","“Do you not see, sir, it is broken? much as if a man had stamped on",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P10":[["S1","sentence","do my errand when it shall be most convenient for you in the course of the day; and once more expect my messenger at midnight.",1],["S2","sentence","It may then already be too late; and if that night passes without event, you will know that you have seen the last of Henry Jekyll.”",0],["S3","sentence","Upon the reading of this letter, I made sure my colleague was insane; but till that was proved beyond the possibility of doubt, I felt bound to do as he requested.",1],["S4","sentence","The less I understood of this farrago, the less I was in a position to judge of its importance; and an appeal so worded could not be set aside without a grave responsibility.",0],["S5","sentence","I rose accordingly from table, got into a hansom, and drove straight to Jekyll’s house.",0],["S6","sentence","The butler was awaiting my arrival; he had received by the same post as mine a registered letter of instruction, and had sent at once for a locksmith and a carpenter.",0],["S7","sentence","The tradesmen came while we were yet speaking; and we moved in a body to old Dr. Denman’s surgical theatre, from which (as you are doubtless aware) Jekyll’s private cabinet is most conveniently entered.",0],["S8","sentence","The door was very strong, the lock excellent; the carpenter avowed he would have great trouble and have to do much damage, if force were to be used; and the locksmith was near despair.",0],["S9","sentence","But this last was a handy fellow, and after two hour’s work, the door stood open.",0],["S10","sentence","The press marked E was unlocked; and I took out the drawer, had it filled up with straw and tied in a sheet, and returned with it to Cavendish Square.",0],["S11","sentence","Here I proceeded to examine its contents.",0],["S12","sentence","The powders were neatly enough made up, but not with the nicety of the dispensing chemist; so that it was plain they were of Jekyll’s private manufacture; and when I opened one of the wrappers I found what seemed to me a simple crystalline salt of a white colour.",0],["S13","sentence","The phial, to which I next turned my attention, might have been about half full of a blood-red liquor, which was highly pungent to the sense of smell and seemed to me to contain phosphorus and some volatile ether.",0],["S14","sentence","At the other ingredients I could make no guess.",0],["S15","sentence","The book was an ordinary version book and contained little but a series of dates.",0],["S16","sentence","These covered a period of many years, but I observed that the entries ceased nearly a year ago and quite abruptly.",0],["S17","sentence","Here and there a brief remark was appended to a date, usually no more than a single word: “double” occurring perhaps six times in a total of several hundred entries; and once very early in the list and followed by several marks of exclamation, “total failure!!!”",0],["S18","sentence","All this, though it whetted my curiosity, told me little that was definite.",0],["S19","sentence","Here were a phial of some salt, and the record of a series of experiments that had led (like too many of Jekyll’s investigations) to no",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P11":[["S1","sentence","end of practical usefulness.",1],["S2","sentence","How could the presence of these articles in my house affect either the honour, the sanity, or the life of my flighty colleague?",0],["S3","sentence","If his messenger could go to one place, why could he not go to another?",0],["S4","sentence","And even granting some impediment, why was this gentleman to be received by me in secret?",0],["S5","sentence","The more I reflected the more convinced I grew that I was dealing with a case of cerebral disease; and though I dismissed my servants to bed, I loaded an old revolver, that I might be found in some posture of self-defence.",0],["S6","sentence","Twelve o’clock had scarce rung out over London, ere the knocker sounded very gently on the door.",0],["S7","sentence","I went myself at the summons, and found a small man crouching against the pillars of the portico.",0],["S8","sentence","“Are you come from Dr. Jekyll?” I asked.",0],["S9","sentence","He told me “yes” by a constrained gesture; and when I had bidden him enter, he did not obey me without a searching backward glance into the darkness of the square.",0],["S10","sentence","There was a policeman not far off, advancing with his bull’s eye open; and at the sight, I thought my visitor started and made greater haste.",0],["S11","sentence","These particulars struck me, I confess, disagreeably; and as I followed him into the bright light of the consulting room, I kept my hand ready on my weapon.",0],["S12","sentence","Here, at last, I had a chance of clearly seeing him.",0],["S13","sentence","I had never set eyes on him before, so much was certain.",0],["S14","sentence","He was small, as I have said; I was struck besides with the shocking expression of his face, with his remarkable combination of great muscular activity and great apparent debility of constitution, and—last but not least—with the odd, subjective disturbance caused by his neighbourhood.",0],["S15","sentence","This bore some resemblance to incipient rigour, and was accompanied by a marked sinking of the pulse.",0],["S16","sentence","At the time, I set it down to some idiosyncratic, personal distaste, and merely wondered at the acuteness of the symptoms; but I have since had reason to believe the cause to lie much deeper in the nature of man, and to turn on some nobler hinge than the principle of hatred.",0],["S17","sentence","This person (who had thus, from the first moment of his entrance, struck in me what I can only describe as a disgustful curiosity) was dressed in a fashion that would have made an ordinary person laughable; his clothes, that is to say, although they were of rich and sober fabric, were enormously too large for him in every measurement—the trousers hanging on his legs and rolled up to keep them from the ground, the waist of the coat below his haunches, and the collar sprawling wide upon his shoulders.",0],["S18","sentence","Strange to relate, this ludicrous accoutrement was far from moving me to laughter.",0],["S19","sentence","Rather, as there was something abnormal and misbegotten in the very essence of the creature that now faced me—something seizing, surprising and revolting—this fresh disparity seemed but to fit in with and to",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P12":[["S1","sentence","reinforce it; so that to my interest in the man’s nature and character, there was added a curiosity as to his origin, his life, his fortune and status in the world.",1],["S2","sentence","These observations, though they have taken so great a space to be set down in, were yet the work of a few seconds.",0],["S3","sentence","My visitor was, indeed, on fire with sombre excitement.",0],["S4","sentence","“Have you got it?” he cried.",0],["S5","sentence","“Have you got it?”",0],["S6","sentence","And so lively was his impatience that he even laid his hand upon my arm and sought to shake me.",0],["S7","sentence","I put him back, conscious at his touch of a certain icy pang along my blood.",0],["S8","sentence","“Come, sir,” said I. “You forget that I have not yet the pleasure of your acquaintance.",0],["S9","sentence","Be seated, if you please.”",0],["S10","sentence","And I showed him an example, and sat down myself in my customary seat and with as fair an imitation of my ordinary manner to a patient, as the lateness of the hour, the nature of my preoccupations, and the horror I had of my visitor, would suffer me to muster.",0],["S11","sentence","“I beg your pardon, Dr. Lanyon,” he replied civilly enough.",0],["S12","sentence","“What you say is very well founded; and my impatience has shown its heels to my politeness.",0],["S13","sentence","I come here at the instance of your colleague, Dr. Henry Jekyll, on a piece of business of some moment; and I understood...”",0],["S14","sentence","He paused and put his hand to his throat, and I could see, in spite of his collected manner, that he was wrestling against the approaches of the hysteria—“I understood, a drawer...”",0],["S15","sentence","But here I took pity on my visitor’s suspense, and some perhaps on my own growing curiosity.",0],["S16","sentence","“There it is, sir,” said I, pointing to the drawer, where it lay on the floor behind a table and still covered with the sheet.",0],["S17","sentence","He sprang to it, and then paused, and laid his hand upon his heart; I could hear his teeth grate with the convulsive action of his jaws; and his face was so ghastly to see that I grew alarmed both for his life and reason.",0],["S18","sentence","“Compose yourself,” said I.\nHe turned a dreadful smile to me, and as if with the decision of despair, plucked away the sheet.",0],["S19","sentence","At sight of the contents, he uttered one loud sob of such immense relief that I sat petrified.",0],["S20","sentence","And the next moment, in a voice that was already fairly well under control, “Have you a graduated glass?” he asked.",0],["S21","sentence","I rose from my place with something of an effort and gave him what he asked.",0],["S22","sentence","He thanked me with a smiling nod, measured out a few minims of the red tincture and added one of the powders.",0],["S23","sentence","The mixture, which was at first of a reddish hue, began, in proportion as the crystals melted, to brighten in colour, to effervesce audibly, and to throw off small fumes of vapour.",0],["S24","sentence","Suddenly and at the same moment, the ebullition ceased and the compound changed to a dark purple, which",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P16":[["S1","sentence","soul.",1],["S2","sentence","I hesitated long before I put this theory to the test of practice.",0],["S3","sentence","I knew well that I risked death; for any drug that so potently controlled and shook the very fortress of identity, might, by the least scruple of an overdose or at the least inopportunity in the moment of exhibition, utterly blot out that immaterial tabernacle which I looked to it to change.",0],["S4","sentence","But the temptation of a discovery so singular and profound at last overcame the suggestions of alarm.",0],["S5","sentence","I had long since prepared my tincture; I purchased at once, from a firm of wholesale chemists, a large quantity of a particular salt which I knew, from my experiments, to be the last ingredient required; and late one accursed night, I compounded the elements, watched them boil and smoke together in the glass, and when the ebullition had subsided, with a strong glow of courage, drank off the potion.",0],["S6","sentence","The most racking pangs succeeded: a grinding in the bones, deadly nausea, and a horror of the spirit that cannot be exceeded at the hour of birth or death.",0],["S7","sentence","Then these agonies began swiftly to subside, and I came to myself as if out of a great sickness.",0],["S8","sentence","There was something strange in my sensations, something indescribably new and, from its very novelty, incredibly sweet.",0],["S9","sentence","I felt younger, lighter, happier in body; within I was conscious of a heady recklessness, a current of disordered sensual images running like a millrace in my fancy, a solution of the bonds of obligation, an unknown but not an innocent freedom of the soul.",0],["S10","sentence","I knew myself, at the first breath of this new life, to be more wicked, tenfold more wicked, sold a slave to my original evil; and the thought, in that moment, braced and delighted me like wine.",0],["S11","sentence","I stretched out my hands, exulting in the freshness of these sensations; and in the act, I was suddenly aware that I had lost in stature.",0],["S12","sentence","There was no mirror, at that date, in my room; that which stands beside me as I write, was brought there later on and for the very purpose of these transformations.",0],["S13","sentence","The night however, was far gone into the morning—the morning, black as it was, was nearly ripe for the conception of the day—the inmates of my house were locked in the most rigorous hours of slumber; and I determined, flushed as I was with hope and triumph, to venture in my new shape as far as to my bedroom.",0],["S14","sentence","I crossed the yard, wherein the constellations looked down upon me, I could have thought, with wonder, the first creature of that sort that their unsleeping vigilance had yet disclosed to them; I stole through the corridors, a stranger in my own house; and coming to my room, I saw for the first time the appearance of Edward Hyde.",0],["S15","sentence","I must here speak by theory alone, saying not that which I know, but that which I suppose to be most probable.",0],["S16","sentence","The evil side",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P17":[["S1","sentence","of my nature, to which I had now transferred the stamping efficacy, was less robust and less developed than the good which I had just deposed.",1],["S2","sentence","Again, in the course of my life, which had been, after all, nine tenths a life of effort, virtue and control, it had been much less exercised and much less exhausted.",0],["S3","sentence","And hence, as I think, it came about that Edward Hyde was so much smaller, slighter and younger than Henry Jekyll.",0],["S4","sentence","Even as good shone upon the countenance of the one, evil was written broadly and plainly on the face of the other.",0],["S5","sentence","Evil besides (which I must still believe to be the lethal side of man) had left on that body an imprint of deformity and decay.",0],["S6","sentence","And yet when I looked upon that ugly idol in the glass, I was conscious of no repugnance, rather of a leap of welcome.",0],["S7","sentence","This, too, was myself.",0],["S8","sentence","It seemed natural and human.",0],["S9","sentence","In my eyes it bore a livelier image of the spirit, it seemed more express and single, than the imperfect and divided countenance I had been hitherto accustomed to call mine.",0],["S10","sentence","And in so far I was doubtless right.",0],["S11","sentence","I have observed that when I wore the semblance of Edward Hyde, none could come near to me at first without a visible misgiving of the flesh.",0],["S12","sentence","This, as I take it, was because all human beings, as we meet them, are commingled out of good and evil: and Edward Hyde, alone in the ranks of mankind, was pure evil.",0],["S13","sentence","I lingered but a moment at the mirror: the second and conclusive experiment had yet to be attempted; it yet remained to be seen if I had lost my identity beyond redemption and must flee before daylight from a house that was no longer mine; and hurrying back to my cabinet, I once more prepared and drank the cup, once more suffered the pangs of dissolution, and came to myself once more with the character, the stature and the face of Henry Jekyll.",0],["S14","sentence","That night I had come to the fatal cross-roads.",0],["S15","sentence","Had I approached my discovery in a more noble spirit, had I risked the experiment while under the empire of generous or pious aspirations, all must have been otherwise, and from these agonies of death and birth, I had come forth an angel instead of a fiend.",0],["S16","sentence","The drug had no discriminating action; it was neither diabolical nor divine; it but shook the doors of the prisonhouse of my disposition; and like the captives of Philippi, that which stood within ran forth.",0],["S17","sentence","At that time my virtue slumbered; my evil, kept awake by ambition, was alert and swift to seize the occasion; and the thing that was projected was Edward Hyde.",0],["S18","sentence","Hence, although I had now two characters as well as two appearances, one was wholly evil, and the other was still the old Henry Jekyll, that incongruous compound of whose reformation and improvement I had already learned to despair.",0],["S19","sentence","The",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P19":[["S1","sentence","alone to do his good pleasure, was a being inherently malign and villainous; his every act and thought centered on self; drinking pleasure with bestial avidity from any degree of torture to another; relentless like a man of stone.",1],["S2","sentence","Henry Jekyll stood at times aghast before the acts of Edward Hyde; but the situation was apart from ordinary laws, and insidiously relaxed the grasp of conscience.",0],["S3","sentence","It was Hyde, after all, and Hyde alone, that was guilty.",0],["S4","sentence","Jekyll was no worse; he woke again to his good qualities seemingly unimpaired; he would even make haste, where it was possible, to undo the evil done by Hyde.",0],["S5","sentence","And thus his conscience slumbered.",0],["S6","sentence","Into the details of the infamy at which I thus connived (for even now I can scarce grant that I committed it) I have no design of entering; I mean but to point out the warnings and the successive steps with which my chastisement approached.",0],["S7","sentence","I met with one accident which, as it brought on no consequence, I shall no more than mention.",0],["S8","sentence","An act of cruelty to a child aroused against me the anger of a passer-by, whom I recognised the other day in the person of your kinsman; the doctor and the child’s family joined him; there were moments when I feared for my life; and at last, in order to pacify their too just resentment, Edward Hyde had to bring them to the door, and pay them in a cheque drawn in the name of Henry Jekyll.",0],["S9","sentence","But this danger was easily eliminated from the future, by opening an account at another bank in the name of Edward Hyde himself; and when, by sloping my own hand backward, I had supplied my double with a signature, I thought I sat beyond the reach of fate.",0],["S10","sentence","Some two months before the murder of Sir Danvers, I had been out for one of my adventures, had returned at a late hour, and woke the next day in bed with somewhat odd sensations.",0],["S11","sentence","It was in vain I looked about me; in vain I saw the decent furniture and tall proportions of my room in the square; in vain that I recognised the pattern of the bed curtains and the design of the mahogany frame; something still kept insisting that I was not where I was, that I had not wakened where I seemed to be, but in the little room in Soho where I was accustomed to sleep in the body of Edward Hyde.",0],["S12","sentence","I smiled to myself, and in my psychological way, began lazily to inquire into the elements of this illusion, occasionally, even as I did so, dropping back into a comfortable morning doze.",0],["S13","sentence","I was still so engaged when, in one of my more wakeful moments, my eyes fell upon my hand.",0],["S14","sentence","Now the hand of Henry Jekyll (as you have often remarked) was professional in shape and size; it was large, firm, white and comely.",0],["S15","sentence","But the hand which I now saw, clearly enough,",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P22":[["S1","sentence","upon his vice, he is once out of five hundred times affected by the dangers that he runs through his brutish, physical insensibility; neither had I, long as I had considered my position, made enough allowance for the complete moral insensibility and insensate readiness to evil, which were the leading characters of Edward Hyde.",1],["S2","sentence","Yet it was by these that I was punished.",0],["S3","sentence","My devil had been long caged, he came out roaring.",0],["S4","sentence","I was conscious, even when I took the draught, of a more unbridled, a more furious propensity to ill.",0],["S5","sentence","It must have been this, I suppose, that stirred in my soul that tempest of impatience with which I listened to the civilities of my unhappy victim; I declare, at least, before God, no man morally sane could have been guilty of that crime upon so pitiful a provocation; and that I struck in no more reasonable spirit than that in which a sick child may break a plaything.",0],["S6","sentence","But I had voluntarily stripped myself of all those balancing instincts by which even the worst of us continues to walk with some degree of steadiness among temptations; and in my case, to be tempted, however slightly, was to fall.",0],["S7","sentence","Instantly the spirit of hell awoke in me and raged.",0],["S8","sentence","With a transport of glee, I mauled the unresisting body, tasting delight from every blow; and it was not till weariness had begun to succeed, that I was suddenly, in the top fit of my delirium, struck through the heart by a cold thrill of terror.",0],["S9","sentence","A mist dispersed; I saw my life to be forfeit; and fled from the scene of these excesses, at once glorying and trembling, my lust of evil gratified and stimulated, my love of life screwed to the topmost peg.",0],["S10","sentence","I ran to the house in Soho, and (to make assurance doubly sure) destroyed my papers; thence I set out through the lamplit streets, in the same divided ecstasy of mind, gloating on my crime, light-headedly devising others in the future, and yet still hastening and still hearkening in my wake for the steps of the avenger.",0],["S11","sentence","Hyde had a song upon his lips as he compounded the draught, and as he drank it, pledged the dead man.",0],["S12","sentence","The pangs of transformation had not done tearing him, before Henry Jekyll, with streaming tears of gratitude and remorse, had fallen upon his knees and lifted his clasped hands to God.",0],["S13","sentence","The veil of self-indulgence was rent from head to foot.",0],["S14","sentence","I saw my life as a whole: I followed it up from the days of childhood, when I had walked with my father’s hand, and through the self-denying toils of my professional life, to arrive again and again, with the same sense of unreality, at the damned horrors of the evening.",0],["S15","sentence","I could have screamed aloud; I sought with tears and prayers to smother down the crowd of hideous images and sounds with which my memory swarmed against me; and still, between the petitions, the",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P23":[["S1","sentence","ugly face of my iniquity stared into my soul.",1],["S2","sentence","As the acuteness of this remorse began to die away, it was succeeded by a sense of joy.",0],["S3","sentence","The problem of my conduct was solved.",0],["S4","sentence","Hyde was thenceforth impossible; whether I would or not, I was now confined to the better part of my existence; and O, how I rejoiced to think of it! with what willing humility I embraced anew the restrictions of natural life! with what sincere renunciation I locked the door by which I had so often gone and come, and ground the key under my heel!",0],["S5","sentence","The next day, came the news that the murder had not been overlooked, that the guilt of Hyde was patent to the world, and that the victim was a man high in public estimation.",0],["S6","sentence","It was not only a crime, it had been a tragic folly.",0],["S7","sentence","I think I was glad to know it; I think I was glad to have my better impulses thus buttressed and guarded by the terrors of the scaffold.",0],["S8","sentence","Jekyll was now my city of refuge; let but Hyde peep out an instant, and the hands of all men would be raised to take and slay him.",0],["S9","sentence","I resolved in my future conduct to redeem the past; and I can say with honesty that my resolve was fruitful of some good.",0],["S10","sentence","You know yourself how earnestly, in the last months of the last year, I laboured to relieve suffering; you know that much was done for others, and that the days passed quietly, almost happily for myself.",0],["S11","sentence","Nor can I truly say that I wearied of this beneficent and innocent life; I think instead that I daily enjoyed it more completely; but I was still cursed with my duality of purpose; and as the first edge of my penitence wore off, the lower side of me, so long indulged, so recently chained down, began to growl for licence.",0],["S12","sentence","Not that I dreamed of resuscitating Hyde; the bare idea of that would startle me to frenzy: no, it was in my own person that I was once more tempted to trifle with my conscience; and it was as an ordinary secret sinner that I at last fell before the assaults of temptation.",0],["S13","sentence","There comes an end to all things; the most capacious measure is filled at last; and this brief condescension to my evil finally destroyed the balance of my soul.",0],["S14","sentence","And yet I was not alarmed; the fall seemed natural, like a return to the old days before I had made my discovery.",0],["S15","sentence","It was a fine, clear, January day, wet under foot where the frost had melted, but cloudless overhead; and the Regent’s Park was full of winter chirrupings and sweet with spring odours.",0],["S16","sentence","I sat in the sun on a bench; the animal within me licking the chops of memory; the spiritual side a little drowsed, promising subsequent penitence, but not yet moved to begin.",0],["S17","sentence","After all, I reflected, I was like my neighbours;",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L2:P24":[["S1","sentence","and then I smiled, comparing myself with other men, comparing my active good-will with the lazy cruelty of their neglect.",1],["S2","sentence","And at the very moment of that vainglorious thought, a qualm came over me, a horrid nausea and the most deadly shuddering.",0],["S3","sentence","These passed away, and left me faint; and then as in its turn faintness subsided, I began to be aware of a change in the temper of my thoughts, a greater boldness, a contempt of danger, a solution of the bonds of obligation.",0],["S4","sentence","I looked down; my clothes hung formlessly on my shrunken limbs; the hand that lay on my knee was corded and hairy.",0],["S5","sentence","I was once more Edward Hyde.",0],["S6","sentence","A moment before I had been safe of all men’s respect, wealthy, beloved—the cloth laying for me in the dining-room at home; and now I was the common quarry of mankind, hunted, houseless, a known murderer, thrall to the gallows.",0],["S7","sentence","My reason wavered, but it did not fail me utterly.",0],["S8","sentence","I have more than once observed that in my second character, my faculties seemed sharpened to a point and my spirits more tensely elastic; thus it came about that, where Jekyll perhaps might have succumbed, Hyde rose to the importance of the moment.",0],["S9","sentence","My drugs were in one of the presses of my cabinet; how was I to reach them?",0],["S10","sentence","That was the problem that (crushing my temples in my hands) I set myself to solve.",0],["S11","sentence","The laboratory door I had closed.",0],["S12","sentence","If I sought to enter by the house, my own servants would consign me to the gallows.",0],["S13","sentence","I saw I must employ another hand, and thought of Lanyon.",0],["S14","sentence","How was he to be reached? how persuaded?",0],["S15","sentence","Supposing that I escaped capture in the streets, how was I to make my way into his presence? and how should I, an unknown and displeasing visitor, prevail on the famous physician to rifle the study of his colleague, Dr. Jekyll?",0],["S16","sentence","Then I remembered that of my original character, one part remained to me: I could write my own hand; and once I had conceived that kindling spark, the way that I must follow became lighted up from end to end.",0],["S17","sentence","Thereupon, I arranged my clothes as best I could, and summoning a passing hansom, drove to an hotel in Portland Street, the name of which I chanced to remember.",0],["S18","sentence","At my appearance (which was indeed comical enough, however tragic a fate these garments covered) the driver could not conceal his mirth.",0],["S19","sentence","I gnashed my teeth upon him with a gust of devilish fury; and the smile withered from his face—happily for him—yet more happily for myself, for in another instant I had certainly dragged him from his perch.",0],["S20","sentence","At the inn, as I entered, I looked about me with so black a countenance as made the attendants tremble; not a look did they exchange in my presence; but obsequiously took my orders, led me to a private room, and brought me wherewithal to write.",0],["S21","sentence","Hyde in danger of",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P1":[["S1","sentence","his life was a creature new to me; shaken with inordinate anger, strung to the pitch of murder, lusting to inflict pain.",1],["S2","sentence","Yet the creature was astute; mastered his fury with a great effort of the will; composed his two important letters, one to Lanyon and one to Poole; and that he might receive actual evidence of their being posted, sent them out with directions that they should be registered.",0],["S3","sentence","Thenceforward, he sat all day over the fire in the private room, gnawing his nails; there he dined, sitting alone with his fears, the waiter visibly quailing before his eye; and thence, when the night was fully come, he set forth in the corner of a closed cab, and was driven to and fro about the streets of the city.",0],["S4","sentence","He, I say—I cannot say, I. That child of Hell had nothing human; nothing lived in him but fear and hatred.",0],["S5","sentence","And when at last, thinking the driver had begun to grow suspicious, he discharged the cab and ventured on foot, attired in his misfitting clothes, an object marked out for observation, into the midst of the nocturnal passengers, these two base passions raged within him like a tempest.",0],["S6","sentence","He walked fast, hunted by his fears, chattering to himself, skulking through the less frequented thoroughfares, counting the minutes that still divided him from midnight.",0],["S7","sentence","Once a woman spoke to him, offering, I think, a box of lights.",0],["S8","sentence","He smote her in the face, and she fled.",0],["S9","sentence","When I came to myself at Lanyon’s, the horror of my old friend perhaps affected me somewhat: I do not know; it was at least but a drop in the sea to the abhorrence with which I looked back upon these hours.",0],["S10","sentence","A change had come over me.",0],["S11","sentence","It was no longer the fear of the gallows, it was the horror of being Hyde that racked me.",0],["S12","sentence","I received Lanyon’s condemnation partly in a dream; it was partly in a dream that I came home to my own house and got into bed.",0],["S13","sentence","I slept after the prostration of the day, with a stringent and profound slumber which not even the nightmares that wrung me could avail to break.",0],["S14","sentence","I awoke in the morning shaken, weakened, but refreshed.",0],["S15","sentence","I still hated and feared the thought of the brute that slept within me, and I had not of course forgotten the appalling dangers of the day before; but I was once more at home, in my own house and close to my drugs; and gratitude for my escape shone so strong in my soul that it almost rivalled the brightness of hope.",0],["S16","sentence","I was stepping leisurely across the court after breakfast, drinking the chill of the air with pleasure, when I was seized again with those indescribable sensations that heralded the change; and I had but the time to gain the shelter of my cabinet, before I was once again raging and freezing with the passions of Hyde.",0],["S17","sentence","It took on this occasion a double",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P2":[["S1","sentence","dose to recall me to myself; and alas! six hours after, as I sat looking sadly in the fire, the pangs returned, and the drug had to be re-administered.",1],["S2","sentence","In short, from that day forth it seemed only by a great effort as of gymnastics, and only under the immediate stimulation of the drug, that I was able to wear the countenance of Jekyll.",0],["S3","sentence","At all hours of the day and night, I would be taken with the premonitory shudder; above all, if I slept, or even dozed for a moment in my chair, it was always as Hyde that I awakened.",0],["S4","sentence","Under the strain of this continually impending doom and by the sleeplessness to which I now condemned myself, ay, even beyond what I had thought possible to man, I became, in my own person, a creature eaten up and emptied by fever, languidly weak both in body and mind, and solely occupied by one thought: the horror of my other self.",0],["S5","sentence","But when I slept, or when the virtue of the medicine wore off, I would leap almost without transition (for the pangs of transformation grew daily less marked) into the possession of a fancy brimming with images of terror, a soul boiling with causeless hatreds, and a body that seemed not strong enough to contain the raging energies of life.",0],["S6","sentence","The powers of Hyde seemed to have grown with the sickliness of Jekyll.",0],["S7","sentence","And certainly the hate that now divided them was equal on each side.",0],["S8","sentence","With Jekyll, it was a thing of vital instinct.",0],["S9","sentence","He had now seen the full deformity of that creature that shared with him some of the phenomena of consciousness, and was co-heir with him to death: and beyond these links of community, which in themselves made the most poignant part of his distress, he thought of Hyde, for all his energy of life, as of something not only hellish but inorganic.",0],["S10","sentence","This was the shocking thing; that the slime of the pit seemed to utter cries and voices; that the amorphous dust gesticulated and sinned; that what was dead, and had no shape, should usurp the offices of life.",0],["S11","sentence","And this again, that that insurgent horror was knit to him closer than a wife, closer than an eye; lay caged in his flesh, where he heard it mutter and felt it struggle to be born; and at every hour of weakness, and in the confidence of slumber, prevailed against him, and deposed him out of life.",0],["S12","sentence","The hatred of Hyde for Jekyll was of a different order.",0],["S13","sentence","His terror of the gallows drove him continually to commit temporary suicide, and return to his subordinate station of a part instead of a person; but he loathed the necessity, he loathed the despondency into which Jekyll was now fallen, and he resented the dislike with which he was himself regarded.",0],["S14","sentence","Hence the ape-like tricks that he would play me, scrawling in my own hand blasphemies on the pages of my books, burning the",0]],"the-strange-case-of-dr-jekyll-and-mr-hyde|L3:P3":[["S1","sentence","letters and destroying the portrait of my father; and indeed, had it not been for his fear of death, he would long ago have ruined himself in order to involve me in the ruin.",1],["S2","sentence","But his love of life is wonderful; I go further: I, who sicken and freeze at the mere thought of him, when I recall the abjection and passion of this attachment, and when I know how he fears my power to cut him off by suicide, I find it in my heart to pity him.",0],["S3","sentence","It is useless, and the time awfully fails me, to prolong this description; no one has ever suffered such torments, let that suffice; and yet even to these, habit brought—no, not alleviation—but a certain callousness of soul, a certain acquiescence of despair; and my punishment might have gone on for years, but for the last calamity which has now fallen, and which has finally severed me from my own face and nature.",0],["S4","sentence","My provision of the salt, which had never been renewed since the date of the first experiment, began to run low.",0],["S5","sentence","I sent out for a fresh supply and mixed the draught; the ebullition followed, and the first change of colour, not the second; I drank it and it was without efficiency.",0],["S6","sentence","You will learn from Poole how I have had London ransacked; it was in vain; and I am now persuaded that my first supply was impure, and that it was that unknown impurity which lent efficacy to the draught.",0],["S7","sentence","About a week has passed, and I am now finishing this statement under the influence of the last of the old powders.",0],["S8","sentence","This, then, is the last time, short of a miracle, that Henry Jekyll can think his own thoughts or see his own face (now how sadly altered!) in the glass.",0],["S9","sentence","Nor must I delay too long to bring my writing to an end; for if my narrative has hitherto escaped destruction, it has been by a combination of great prudence and great good luck.",0],["S10","sentence","Should the throes of change take me in the act of writing it, Hyde will tear it in pieces; but if some time shall have elapsed after I have laid it by, his wonderful selfishness and circumscription to the moment will probably save it once again from the action of his ape-like spite.",0],["S11","sentence","And indeed the doom that is closing on us both has already changed and crushed him.",0],["S12","sentence","Half an hour from now, when I shall again and forever reindue that hated personality, I know how I shall sit shuddering and weeping in my chair, or continue, with the most strained and fearstruck ecstasy of listening, to pace up an /* ---------- intro ---------- */
const TYPE_INFO = [
  { t: "Vocab", eq: true, stem: "As used in this excerpt, \"x\" most nearly means", what: "One word read exactly in context." },
  { t: "Analysis", eq: true, stem: "Which best describes the meaning of the highlighted passage?", what: "Meaning of a ~100-word passage." },
  { t: "Craft", eq: false, stem: "What is the effect of the author's use of the highlighted detail?", what: "Effect of a detail the author chose." },
  { t: "Evidence", eq: false, stem: "Which sentence from the passage best supports the claim that ___?", what: "Pick the strongest of four marked sentences on the page." },
];
const PIPE = [
  { n: "01", title: "Curated pages", sub: "Your books, split into levels and ~500-word pages", st: "done" },
  { n: "02", title: "Two writing methods", sub: "Run side by side, hidden in review", st: "done", list: ["A · Knowledge graph of each page guides spots and distractors", "B · Text only: writer reads the page"] },
  { n: "03", title: "Item writing", sub: "Spots worth asking across the level; 4 types, 4 options", st: "done" },
  { n: "04", title: "Layer 1 · Gate", sub: "Drops broken items", st: "done", list: ["Format and boundary", "Shortcut solvers", "Page-set overlap", "AI student solves", "AI peer review (2nd vendor)", "Revise once, else drop"] },
  { n: "05", title: "Layer 2 · Quality", sub: "Grades, not just pass/fail", st: "next", list: ["Rubric judge", "Simulated students", "Keep the best per spot"] },
  { n: "06", title: "Your review", sub: "Verdict, reasons, edits", st: "here" },

    el("div", { class: "pipe-row" }, PIPE.map((p, i) => [

}

function renderIntro() {
  const T = TYPE_INFO.map((x) => x.t);
  const rows = [];
  for (const b of DATA.books) {
    const its = itemsOf(b.id);
    const levels = [...new Set(its.map((i) => i.level))].sort();
    levels.forEach((lv, k) => {

        el("td", { class: "n tot", text: li.length })));

  rows.push(el("tr", { class: "sum" }, el("td", { colspan: 2, text: "Total" }), T.map((t) => el("td", { class: "n", text: DATA.items.filter((i) => i.type === t).length })), el("td", { class: "n tot", text: DATA.items.length })));
  const counts = el("table", { class: "counts" },
    el("thead", {}, el("tr", {}, el("th", { text: "Book" }), el("th", { text: "Level" }), T.map((t) => el("th", { text: t })), el("th", { text: "Total" }))),
    el("tbody", {}, rows));
  const pick = state.pending ?? state.reviewer;
  $("intro").replaceChildren(el("div", { class: "intro-in" },
    el("section", { class: "hero" },
      el("div", { class: "eyebrow", text: "QA AUTOGEN · DEMO TEST · ROUND 1" }),
      SOLO ? el("h1", { text: `Hey ${REVIEWERS[0].name},` }) : el("h1", { text: "Round 1 review: A Christmas Carol, Jekyll and Hyde" }),
      SOLO ? el("p", { class: "lead", text: `here's round one: ${DATA.items.length} items the machine wrote from A Christmas Carol and Jekyll and Hyde. Judge each one against your gold standard, the way you'd mark up a new writer's draft. Your progress is saved as you go, so you can stop anytime and pick up from this same link on any computer.` })

      el("p", { class: "note", text: "Only the gate (layer 1) has run; the quality verifier (layer 2) will be built from your reviews. Some items may look plainly poor. Please review those just as carefully: they are what the verifier has to learn to catch." })),
    renderPipeline(),
    el("div", { class: "grid2" },
      el("section", { class: "card" },
        el("h4", { text: "Item types · 4 options, fixed stem" }),
        el("div", { class: "tlist" }, TYPE_INFO.map((x) => el("div", { class: "trow" },
          el("span", { class: `chip ${x.t}`, text: x.t }),
          el("div", {}, el("div", { class: "tw" }, x.what, " ", el("span", { class: x.eq ? "tag eq" : "tag new", text: x.eq ? "Already in EQ" : "New" })), el("div", { class: "stem", text: x.stem })))))),
      el("section", { class: "card" },
        el("h4", { text: "Items per level" }),
        el("div", { style: "overflow-x:auto" }, counts),
        el("p", { class: "why", text: "Up to 5 per type per level per method. L1 carries both methods, so it is about double." }))),
    el("div", { class: "grid2" },
      el("section", { class: "card" },
        el("h4", { text: "Review steps" }),
        el("ol", { class: "steps" },
          el("li", { text: "Answer it yourself from the page." }),
          el("li", { text: "Check the key and rationale." }),
          el("li", { text: "Approve, Approve with edits, or Reject, with reasons." }),
          el("li", { text: "Save. Resume any time (2 to 3 min per item)." }))),
      el("section", { class: "card" },
        el("h4", { text: "How reviews are used" }),
        el("ol", { class: "steps" },
          el("li", { text: "Reference for building and calibrating layer 2." }),
          el("li", { text: "Reason codes point to the stage to fix." }),
          el("li", { text: "Verdicts decide between methods A and B." })))),
    el("section", { class: "enter" },
      SOLO ? null : el("div", { class: "enter-col" },
        el("h4", { text: "Who is reviewing?" }),
        el("div", { class: "people", role: "group", "aria-label": "Reviewer name" }, REVIEWERS.map((r) => el("button", { class: "person", "aria-pressed": String(pick === r.id), onclick: () => { state.pending = r.id; renderIntro(); } },
          el("span", { class: "avatar", style: `background:${r.tint}`, "aria-hidden": "true", text: r.emoji }),
          el("span", { class: "pname", text: r.name }))))),
      el("div", { class: "enter-col" },
        el("h4", { text: "Start with" }),
        el("div", { class: "covers", role: "group", "aria-label": "Book" }, DATA.books.map((b) => {
          const c = COVERS[b.id] || { bg: "#3e3d3b", ink: "#fff", line: "#c1beb8", mark: "" };
          const n = itemsOf(b.id).length;
          return el("button", { class: "coverbtn", "aria-pressed": String(state.book === b.id), onclick: () => { state.book = b.id; renderIntro(); } },
            el("span", { class: "cover", style: `--cbg:${c.bg};--cink:${c.ink};--cline:${c.line}` },
              el("span", { class: "cmark", "aria-hidden": "true", text: c.mark }),
              el("span", { class: "ctitle", text: b.short === "Carol" ? "A Christmas Carol" : "Dr. Jekyll and Mr. Hyde" }),
              el("span", { class: "cauthor", text: b.author })),
            el("span", { class: "cmeta", text: `${n} items` }));
        }))),
      el("div", { class: "enter-go" }, enterButtons(pick)))));
}

function enterButtons(pick) {
  const go = (book, uid) => { if (state.reviewer !== pick) state.draft = {}; state.reviewer = pick; state.pending = null; state.view = "review"; state.book = book; state.current = uid; remember(); renderAll(); };
  const res = state.resume && (SOLO || state.resume.reviewer === pick) ? state.resume : null;
  const resItem = res && DATA.items.find((i) => i.uid === res.uid);
  const firstOpen = itemsOf(state.book).find((i) => !reviewOf(pick, i)?.verdict) || itemsOf(state.book)[0];
  if (!pick) return [el("button", { class: "btn big", disabled: true, text: "Choose your name" })];
  const btns = [];
  if (resItem) btns.push(el("button", { class: "btn big", id: "resume-btn", onclick: () => go(resItem.book, resItem.uid), text: `Continue where you left off · ${bookShort(resItem.book)} #${resItem.no} →` }));
  btns.push(el("button", { class: resItem ? "btn ghost big" : "btn big", id: "start-btn", onclick: () => go(state.book, firstOpen.uid), text: resItem ? `Start ${bookShort(state.book)}` : (SOLO ? `Start ${bookShort(state.book)} →` : `Start as ${REVIEWERS.find((r) => r.id === pick).name} →`) }));
  return btns;
}
function bookShort(id) { const b = DATA.books.find((x) => x.id === id); return b.short === "Carol" ? "A Christmas Carol" : "Jekyll and Hyde"; }

/* ---------- address (hash) and saved position ---------- */
const slug = (id) => (DATA.books.find((b) => b.id === id).short || "book").toLowerCase();
function hashNow() {
  if (state.view === "intro" || !state.reviewer) return "start";
  if (state.view === "overview") return `overview-${slug(state.book)}`;
  const it = currentItem();
  return `${slug(it.book)}-${it.no}`;
}
function applyHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if ((m = h.match(/^([a-z]+)-(\d+)$/)) && state.reviewer) {
    const b = DATA.books.find((x) => slug(x.id) === m[1]);
    const it = b && itemsOf(b.id).find((i) => i.no === +m[2]);
    if (it) { state.view = "review"; state.book = b.id; state.current = it.uid; return true; }
  }
  if ((m = h.match(/^overview-([a-z]+)$/)) && state.reviewer) {
    const b = DATA.books.find((x) => slug(x.id) === m[1]);
    if (b) { state.view = "overview"; state.book = b.id; return true; }
  }
  if (h === "start") { state.view = "intro"; return true; }
  return false;
}
let hashLock = false;
function syncHash() {
  const h = hashNow();
  if (location.hash.slice(1) !== h) { hashLock = true; location.hash = h; setTimeout(() => { hashLock = false; }, 0); }
}
window.addEventListener("hashchange", () => { if (hashLock) return; if (applyHash()) renderAll(); });

const progressTimers = {};
function saveProgress() {
  if (state.view !== "review" || !state.reviewer) return;
  const it = currentItem();
  const body = { reviewer: state.reviewer, book: it.book, uid: it.uid, no: it.no, updated_at: new Date().toISOString(), user_id: state.userId };
  state.resume = { reviewer: state.reviewer, book: it.book, uid: it.uid };
  remember();
  if (!state.db || state.lastProgress[state.reviewer] === it.uid) return;
  clearTimeout(progressTimers[body.reviewer]);
  progressTimers[body.reviewer] = setTimeout(async () => {
    if (state.lastProgress[body.reviewer] === body.uid) return;
    try { await state.db.collection("progress").doc(body.reviewer).set(body); state.lastProgress[body.reviewer] = body.uid; } catch (e) {}
  }, 800);
}

/* ---------- web store: Google Sheet via Apps Script, with a local queue so nothing is lost ---------- */
function httpStore(cfg, reviewer) {
  const QK = `eq-qa-queue-${reviewer}`, CK = `eq-qa-cache-${reviewer}`;
  const rd = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const wr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let cache = rd(CK, { reviews: {}, progress: null });
  let queue = rd(QK, []);
  const revSubs = [], progSubs = [];
  let loaded = false, flushing = false, retry = 0, timer = null;
  const applyQueue = () => { for (const q of queue) { if (q.kind === "review") cache.reviews[q.id] = q.doc; else cache.progress = q.doc; } };
  applyQueue();
  const snapR = () => ({ docs: Object.entries(cache.reviews).map(([id, d]) => ({ id, exists: true, data: () => d })), metadata: { fromCache: !loaded, hasPendingWrites: queue.length > 0 } });
  const snapP = () => ({ id: reviewer, exists: !!cache.progress, data: () => cache.progress, metadata: { fromCache: !loaded, hasPendingWrites: false } });
  const emit = () => { revSubs.forEach((f) => f(snapR())); progSubs.forEach((f) => f(snapP())); };
  const status = () => {
    const el = document.getElementById("sync"); if (!el) return;
    if (queue.length && retry > 1) { el.textContent = `Offline · ${queue.length} change${queue.length > 1 ? "s" : ""} kept on this computer, retrying`; el.className = "sync warn"; }
    else if (queue.length) { el.textContent = "Saving…"; el.className = "sync"; }
    else if (loaded) { el.textContent = "All changes saved"; el.className = "sync"; }
  };
  async function flush() {
    if (flushing) return; flushing = true;
    try {
      while (queue.length) {
        const q = queue[0];
        const res = await fetch(cfg.url, { method: "POST", body: JSON.stringify({ key: cfg.key, kind: q.kind, id: q.id, doc: q.doc }) });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || "save failed");
        // drop only if nothing newer for the same doc was queued meanwhile
        if (queue[0] === q) queue.shift(); else queue = queue.filter((x) => x !== q);
        wr(QK, queue); retry = 0; status();
      }
    } catch (e) {
      retry++; status();
      clearTimeout(timer); timer = setTimeout(flush, Math.min(60000, 3000 * retry));
    } finally { flushing = false; status(); }
  }
  async function load() {
    try {
      const res = await fetch(`${cfg.url}?action=load&key=${encodeURIComponent(cfg.key)}&reviewer=${encodeURIComponent(reviewer)}`);
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "load failed");
      cache = { reviews: j.reviews || {}, progress: j.progress || null };
      applyQueue(); wr(CK, cache); loaded = true; retry = 0; emit(); status(); flush();
    } catch (e) {
      retry++; status(); emit();
      setTimeout(load, Math.min(60000, 3000 * retry));
    }
  }
  function set(kind, id, doc) {
    const copy = JSON.parse(JSON.stringify(doc));
    if (kind === "review") cache.reviews[id] = copy; else cache.progress = copy;
    queue = queue.filter((x) => !(x.kind === kind && x.id === id)); queue.push({ kind, id, doc: copy });
    wr(QK, queue); wr(CK, cache); status(); emit(); flush();
    return Promise.resolve();
  }
  window.addEventListener("beforeunload", (e) => { if (queue.length) { e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("online", () => { retry = 0; flush(); });
  setTimeout(load, 0);
  return {
    collection: (name) => ({
      doc: (id) => ({
        set: (body) => set(name === "reviews" ? "review" : "progress", id, body),
        onSnapshot: (cb) => { progSubs.push(cb); setTimeout(() => cb(snapP()), 0); return () => {}; },
      }),
      onSnapshot: (cb) => { revSubs.push(cb); setTimeout(() => cb(snapR()), 0); return () => {}; },
    }),
  };
}

/* ---------- glue ---------- */
function currentItem() { const items = itemsOf(state.book); return items.find((i) => i.uid === state.current) || items[0]; }
function renderAll() {
  renderTop();
  if (state.view === "intro") { renderIntro(); syncHash(); return; }
  if (state.view === "overview") { renderOverview(); syncHash(); return; }
  const it = currentItem();
  state.current = it.uid;
  const d = (state.draft[it.uid] ||= {});
  d.opened_at ||= new Date().toISOString();
  renderList(); renderPassage(it); renderPanel(it);
  const row = document.querySelector('.row[aria-current="true"]'); if (row) row.scrollIntoView({ block: "nearest" });
  syncHash(); saveProgress();
}
function showBanner(msg) { const b = $("banner"); b.textContent = msg; b.hidden = !msg; }

applyHash();
renderAll();
showBanner("Connecting to the review store…");
(async () => {
  const timer = setTimeout(() => showBanner("The review store can't be reached yet. You can read items; saving will start once it connects."), 10000);
  let db = null, user = null;
  if (STORE && STORE.url && SOLO) { db = httpStore(STORE, REVIEWERS[0].id); }
  else { try { [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]); } catch (e) {} }
  if (user) { try { state.userId = await user.id(); } catch (e) {} }
  if (!db) { clearTimeout(timer); showBanner(STORE ? "Saving is not connected yet. Please check back shortly." : "Saving is off in this view. Open the page on claude.ai while signed in to record reviews."); return; }
  state.db = db;
  if (state.reviewer) {
    const rid = SOLO ? REVIEWERS[0].id : state.reviewer;
    db.collection("progress").doc(rid).onSnapshot((d) => {
      if (!d.exists) return;
      const p = d.data();
      if (p && p.uid && DATA.items.some((i) => i.uid === p.uid)) {
        state.lastProgress[rid] = state.lastProgress[rid] || p.uid;
        state.resume = { reviewer: rid, book: p.book, uid: p.uid };
        remember();
        if (state.view === "intro") renderIntro();
      }
    }, () => {});
  }
  db.collection("reviews").onSnapshot((snap) => {
    const next = {};
    for (const doc of snap.docs) next[doc.id] = doc.data();
    state.reviews = next;
    if (!snap.metadata.fromCache) { clearTimeout(timer); showBanner(""); }
    if (!state.saving) {
      const active = document.activeElement;
      if (active && active.tagName === "TEXTAREA") { if (state.view === "review") renderList(); else renderOverview(); }
      else if (state.view !== "intro") renderAll();
    }
  }, (e) => { clearTimeout(timer); showBanner(`Live updates stopped (${e.code}). Reload the page to reconnect.`); });
})();
