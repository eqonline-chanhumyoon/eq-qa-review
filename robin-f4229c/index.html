<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EQ QA Review · Robin</title>
<style>
/* EQ demo theme (demo.eq-online.com): warm off-white surface, near-black ink, mint/cyan action, category colors per item type.
   Layout: top bar (reviewer + book), then a three-column workspace: item list | passage | question and review. Single light theme by choice. */
:root {
  --surface: #fdf8f3;          /* color-surface-main */
  --reader: #f6f5f2;           /* color-surface-reader */
  --card: #ffffff;
  --ink: #121212;              /* color-eq-black */
  --ink-2: #3e3d3b;            /* color-eq-dark-grey */
  --muted: #95938e;            /* color-eq-grey */
  --line: #e7e1d8;
  --tab: #eae2d8;              /* color-surface-tab-active */
  --mint: #35d0dc;             /* color-eq-mint (logo) */
  --action: #64cdd9;           /* color-surface-cyan-action */
  --action-press: #4fbcc9;
  --action-tint: #e0f4f6;
  --vocab: #a0f148;            /* category-vocab */
  --analysis: #9599ff;         /* category-analysis */
  --craft: #64cdd9;            /* category-expression */
  --evidence: #f2b84b;
  --good: #34c759; --good-bg: #e8f8ee;
  --warn: #c98a00; --warn-bg: #fdf3e0;
  --bad: #ff3b30;  --bad-bg: #fdeeed;
  --font-sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
  --font-read: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px;
  --shadow: 0 1px 3px 0 #00000014, 0 1px 2px -1px #0000000f;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--action-press); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* top bar */
.gnb { display: flex; align-items: center; gap: 24px; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.logo { display: flex; align-items: baseline; gap: 10px; }
.logo b { color: var(--mint); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.logo span { font-weight: 600; color: var(--ink-2); }
.gnb .group { display: flex; align-items: center; gap: 8px; }
.gnb .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 500; }
.pill[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.book-pill[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: var(--ink); }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; background: var(--reader); padding: 4px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 500; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.banner { padding: 8px 24px; background: var(--warn-bg); color: #6b4a00; font-size: 13px; }
.banner[hidden] { display: none; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sync.warn { color: #8a5d00; font-weight: 600; }

/* workspace */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px minmax(0, 1fr) minmax(340px, 440px); }
.work[hidden], .overview[hidden] { display: none; }
.list { border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 12px 40px; }
.progress { padding: 4px 8px 14px; }
.progress .bar { height: 6px; border-radius: 3px; background: var(--tab); overflow: hidden; margin-top: 6px; }
.progress .bar i { display: block; height: 100%; background: var(--action); }
.progress small { color: var(--muted); font-variant-numeric: tabular-nums; }
.lvl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 14px 8px 6px; }
.row { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; padding: 8px; border: 0; background: transparent; border-radius: var(--r-sm); text-align: left; }
.row:hover { background: var(--reader); }
.row[aria-current="true"] { background: var(--tab); }
.row .no { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.row .meta { font-size: 13px; color: var(--ink-2); }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dot.answered { background: var(--tab); border-color: var(--ink-2); }
.dot.approve { background: var(--good); border-color: var(--good); }
.dot.approve_edits { background: #f2b84b; border-color: #f2b84b; }
.dot.reject { background: var(--bad); border-color: var(--bad); }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: var(--ink); }
.chip.Vocab { background: var(--vocab); } .chip.Analysis { background: var(--analysis); } .chip.Craft { background: var(--craft); } .chip.Evidence { background: var(--evidence); }

.passage { overflow-y: auto; padding: 28px clamp(16px, 4vw, 48px) 60px; background: var(--reader); }
.passage .where { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.passage article { max-width: 64ch; margin: 0 auto; font-family: var(--font-read); font-size: 17px; line-height: 1.75; color: var(--ink); }
.passage p { margin: 0 0 1em; }
.passage h3 { font-family: var(--font-sans); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin: 1.2em 0 0.6em; }
.hl { background: #fff3a8; box-shadow: 0 0 0 2px #fff3a8; border-radius: 2px; }
.hl-sent { background: #fff7c7; border-radius: 2px; }
.mark-sent { background: #fdeccc; border-radius: 2px; cursor: pointer; }
.mark-sent.picked { background: #cdeef2; outline: 2px solid var(--action-press); }
.mark-sent.key { background: var(--good-bg); outline: 2px solid var(--good); }
.mark-sent.wrong { background: var(--bad-bg); outline: 2px solid var(--bad); }
.badge { display: inline-block; font-family: var(--font-sans); font-size: 11px; font-weight: 700; background: var(--ink); color: #fff; border-radius: 4px; padding: 0 5px; margin-right: 4px; vertical-align: 2px; }

.panel { overflow-y: auto; padding: 24px; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
.card h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.qhead { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-md); padding: 10px 12px; }
.opt:hover:not(:disabled) { border-color: var(--action-press); }
.opt .L { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--reader); }
.opt.picked { border-color: var(--action-press); background: var(--action-tint); }
.opt.key { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; background: var(--action); color: var(--ink); }
.btn:hover { background: var(--action-press); }
.btn:disabled { background: var(--tab); color: var(--muted); cursor: default; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.result { font-weight: 600; }
.result.ok { color: #1f8a3c; } .result.no { color: var(--bad); }
.why { font-size: 14px; color: var(--ink-2); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--card); border-radius: var(--r-sm); padding: 8px 6px; font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"][data-v="approve"] { background: var(--good-bg); border-color: var(--good); }
.seg button[aria-pressed="true"][data-v="approve_edits"] { background: var(--warn-bg); border-color: #f2b84b; }
.seg button[aria-pressed="true"][data-v="reject"] { background: var(--bad-bg); border-color: var(--bad); }
.reasons { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.reasons label { display: grid; grid-template-columns: 18px 1fr; column-gap: 8px; align-items: start; border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; background: var(--card); cursor: pointer; }
.reasons label:has(input:checked) { border-color: var(--ink); background: var(--surface); box-shadow: inset 3px 0 0 var(--bad); }
.reasons input { margin: 3px 0 0; }
.reasons .rt { font-size: 13px; font-weight: 700; line-height: 1.3; }
.reasons .rh { grid-column: 2; font-size: 12px; color: var(--muted); line-height: 1.35; }
.need { color: var(--bad); }
.reasons input { accent-color: var(--action-press); }
textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; background: var(--card); resize: vertical; }
.saveline { display: flex; align-items: center; gap: 12px; }
.saveline small { color: var(--muted); }
.navline { display: flex; justify-content: space-between; }

/* overview */
.overview { flex: 1; overflow: auto; padding: 24px; }
.ov-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
.ov-cards .card b { font-size: 26px; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; background: var(--reader); position: sticky; top: 0; }
td.num { font-variant-numeric: tabular-nums; color: var(--muted); }
.v { display: inline-block; min-width: 64px; text-align: center; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; }
.v.approve { background: var(--good-bg); color: #1f8a3c; } .v.approve_edits { background: var(--warn-bg); color: #8a5d00; } .v.reject { background: var(--bad-bg); color: #c22a20; } .v.answered { background: var(--reader); color: var(--ink-2); } .v.none { color: var(--line); }
.cmt { white-space: normal; min-width: 240px; color: var(--ink-2); font-size: 13px; }

/* pipeline (figma-style flow) */
.pipe { gap: 14px; }
.pipe-row { display: flex; align-items: stretch; overflow-x: auto; padding: 4px 2px 8px; }
.node { flex: 1 1 0; min-width: 116px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px #0000000d; }
.node.done { border-color: #cfe9dc; }
.node.next { border: 1.5px dashed #9599ff; background: #f7f7ff; }
.node.here { border: 2px solid var(--ink); background: var(--surface); }
.node.later { opacity: .7; }
.node-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.num { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
.st { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 2px 7px; white-space: nowrap; }
.st.done { background: var(--good-bg); color: #1f8a3c; }
.st.next { background: #ecedff; color: #4b50c8; white-space: normal; text-align: right; line-height: 1.25; }
.st.here { background: var(--ink); color: #fff; }
.st.later { background: var(--reader); color: var(--ink-2); }
.nt { font-weight: 700; font-size: 14px; line-height: 1.3; }
.ns { font-size: 12px; color: var(--ink-2); line-height: 1.4; }
.node ul { margin: 2px 0 0; padding-left: 14px; font-size: 11.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; line-height: 1.35; }
.conn { flex: 0 0 18px; align-self: center; height: 2px; background: var(--muted); position: relative; }
.conn::after { content: ""; position: absolute; right: -1px; top: -4px; border-left: 7px solid var(--muted); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.conn.dash { background: repeating-linear-gradient(90deg, #9599ff 0 5px, transparent 5px 9px); }
.conn.dash::after { border-left-color: #9599ff; }
.pipe-foot { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pipe-foot span { display: inline-flex; align-items: center; gap: 6px; }
.pipe-foot .loop { margin-left: auto; color: var(--ink-2); font-weight: 600; }
.node.later { opacity: 1; border: 1.5px dashed var(--muted); }
.lg { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.lg.done { border: 1px solid #cfe9dc; background: var(--good-bg); }
.lg.next { border: 1.5px dashed #9599ff; background: #f7f7ff; }
.lg.here { border: 2px solid var(--ink); }

/* intro */
.intro { flex: 1; overflow-y: auto; padding: 28px 24px 48px; }
.intro[hidden] { display: none; }
.intro-in { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.intro-in > * { min-width: 0; }
.pipe-row { min-width: 0; }
.intro, .intro-in, .pipe { min-width: 0; max-width: 100%; }
@media (max-width: 760px) { .pipe-row { flex-direction: column; overflow-x: visible; } .node { flex: none; min-width: 0; } .conn { flex: none; width: 2px; height: 14px; align-self: center; } .conn::after { right: -4px; top: auto; bottom: -1px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 7px solid var(--muted); border-bottom: 0; } .conn.dash { background: repeating-linear-gradient(180deg, #9599ff 0 5px, transparent 5px 9px); } .conn.dash::after { border-top-color: #9599ff; border-left-color: transparent; } }
@media (max-width: 600px) { .intro { padding: 16px 12px 40px; } .hero { padding: 18px; } .hero h1 { font-size: 22px; line-height: 28px; } .enter { padding: 18px; } .enter-go { margin-left: 0; width: 100%; } .enter-go .btn { width: 100%; } .pipe-foot .loop { margin-left: 0; } }
.hero { background: var(--card); border-radius: var(--r-xl); padding: 24px 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.hero .eyebrow { font-size: 12px; font-weight: 600; color: var(--action-press); letter-spacing: 0.04em; }
.hero h1 { margin: 0; font-size: 26px; line-height: 34px; letter-spacing: -0.01em; text-wrap: balance; }
.hero p { margin: 0; color: var(--ink-2); max-width: 80ch; }
.hero .lead { font-size: 17px; line-height: 1.55; color: var(--ink); }
.btn.ghost.big { background: var(--card); }
.enter-go { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.hero .note { background: var(--action-tint); border-radius: var(--r-md); padding: 10px 14px; color: var(--ink); font-weight: 500; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.tlist { display: flex; flex-direction: column; gap: 10px; }
.trow { display: grid; grid-template-columns: 82px 1fr; gap: 10px; align-items: start; }
.trow .chip { justify-self: start; }
.tw { font-size: 14px; font-weight: 500; }
.stem { font-family: var(--font-read); font-style: italic; color: var(--muted); font-size: 13px; }
.tag { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; margin-left: 4px; white-space: nowrap; }
.tag.eq { background: var(--reader); color: var(--ink-2); border: 1px solid var(--line); }
.tag.new { background: var(--ink); color: #fff; }
.counts { font-size: 13px; border-collapse: collapse; width: 100%; }
.counts td, .counts th { padding: 5px 8px; white-space: nowrap; border-bottom: 1px solid var(--line); }
.counts th { position: static; text-transform: none; letter-spacing: 0; font-size: 12px; background: var(--reader); }
.counts td.n, .counts th:not(:first-child):not(:nth-child(2)) { text-align: right; font-variant-numeric: tabular-nums; }
.counts td.bk { font-weight: 600; vertical-align: top; }
.counts .tot { font-weight: 600; }
.counts tr.sum td { font-weight: 700; border-bottom: 0; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); font-size: 14px; }
.enter { background: var(--card); border-radius: var(--r-xl); padding: 22px 28px; box-shadow: var(--shadow); display: flex; flex-wrap: wrap; align-items: flex-start; gap: 28px; }
.enter-col { display: flex; flex-direction: column; }
.enter-go { margin-left: auto; align-self: center; }
.people { display: flex; gap: 10px; flex-wrap: wrap; }
.person { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 104px; height: 156px; padding: 14px 8px 12px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); }
.person:hover { border-color: var(--action-press); }
.person .avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; line-height: 1; }
.person .pname { font-weight: 600; }
.person[aria-pressed="true"] { border: 2px solid var(--ink); padding: 13px 7px 11px; background: var(--surface); }
.covers { display: flex; gap: 14px; }
.coverbtn { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cover { width: 104px; aspect-ratio: 2 / 3; border-radius: 4px 10px 10px 4px; background: var(--cbg); color: var(--cink); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; padding: 12px 10px; text-align: center; box-shadow: inset 6px 0 0 #00000030, 0 6px 14px -6px #00000059; transition: transform .15s; position: relative; }
.cover::after { content: ""; position: absolute; inset: 8px 8px 8px 14px; border: 1px solid var(--cline); border-radius: 2px; opacity: .7; pointer-events: none; }
.cmark { font-size: 18px; opacity: .9; }
.ctitle { font-family: var(--font-read); font-size: 14px; line-height: 1.2; font-weight: 700; }
.cauthor { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.cmeta { font-size: 12px; color: var(--muted); }
.coverbtn:hover .cover { transform: translateY(-2px); }
.coverbtn[aria-pressed="true"] .cover { outline: 3px solid var(--action); outline-offset: 3px; }
.coverbtn[aria-pressed="true"] .cmeta { color: var(--ink); font-weight: 600; }
.enter-row { display: flex; gap: 28px; flex-wrap: wrap; }
.enter h4 { margin: 0 0 8px; }
.enter .names { display: flex; gap: 8px; flex-wrap: wrap; }
.enter .names button { border: 1px solid var(--line); background: var(--card); border-radius: var(--r-md); padding: 10px 18px; font-weight: 600; font-size: 15px; min-width: 96px; }
.enter .names button.bookbtn { font-weight: 500; }
.enter .names button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.big { padding: 12px 26px; font-size: 16px; }
.whoami { font-weight: 600; }
.linkbtn { border: 0; background: none; color: var(--action-press); font-weight: 600; padding: 0; text-decoration: underline; }

/* tablet: item list becomes a horizontal strip; passage and question side by side */
@media (max-width: 1000px) {
  .work { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); grid-template-rows: auto minmax(0, 1fr); }
  .list { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .list .progress { flex: 0 0 auto; padding: 0 8px 0 0; min-width: 140px; }
  .list .lvl { flex: 0 0 auto; padding: 0 2px 0 6px; }
  .list .row { flex: 0 0 auto; width: auto; grid-template-columns: auto auto auto; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; min-height: 40px; }
  .passage { padding: 20px 20px 48px; }
  .panel { padding: 16px; }
}
/* phone: one column, compact header; passage first, then question */
@media (max-width: 760px) {
  .gnb { gap: 8px 12px; padding: 10px 12px; }
  .gnb .label, .gnb .spacer { display: none; }
  .logo b { font-size: 22px; }
  .gnb .pill { padding: 8px 12px; font-size: 13px; min-height: 40px; }
  .tabs button { padding: 8px 12px; font-size: 13px; min-height: 40px; }
  .work { grid-template-columns: 1fr; grid-template-rows: auto auto auto; overflow-y: auto; }
  .list { grid-column: auto; }
  .passage, .panel { overflow: visible; border: 0; }
  .passage article { font-size: 16px; }
}
</style>
</head>
<body>
<header class="gnb">
  <div class="logo"><b>EQ</b><span>QA Review</span></div>
  <div class="group" id="who-group"><span class="label">Reviewer</span><span class="whoami" id="whoami"></span><button class="linkbtn" id="switch">Switch</button></div>
  <div class="group" role="group" aria-label="Book"><span class="label">Book</span><span id="books"></span></div>
  <div class="spacer"></div>

<script>
const DATA = {"run":"gen1","books":[{"id":"a-christmas-carol","title":"A Christmas Carol","author":"Charles Dickens","short":"Carol"},{"id":"the-strange-case-of-dr-jekyll-and-mr-hyde","title":"The Strange Case of Dr. Jekyll and Mr. Hyde","author":"Robert Louis Stevenson","short":"Jekyll"}],"items":[{"item_id":"gen1-a-christmas--L1P1-kg-Evidence","uid":"d3c03ade83","book":"a-christmas-carol","level":1,"page":1,"pkey":"a-christmas-carol|L1:P1","type":"Evidence","question":"Which sentence from the passage best supports the claim that Scrooge cared more about making money than about grieving for Marley?","options":["Scrooge was his sole executor, his sole administrator, his sole assign, his sole residuary legatee, his sole friend, and sole mourner.","And even Scrooge was not so dreadfully cut up by the sad event, but that he was an excellent man of business on the very day of the funeral, and solemnised it with an undoubted bargain.","It was all the same to him.","Oh! but he was a tight-fisted hand at the grindstone, Scrooge! a squeezing, wrenching, grasping, scraping, clutching, covetous, old sinner!"],"option_sids":["S20","S21","S30","S31"],"answer":1,"highlight":["S20","S21","S30","S31"],"target":null,"evidence":["S21"],"why_en":"This page has several sentences about Scrooge's greed, but only one can by itself defend the reading that his greed outweighs grief at his friend's death, so students must judge the strength of the evidence.","method":"kg","spec":"v1","no":1},{"item_id":"gen1-a-christmas--L1P2-kg-Craft","uid":"92aa4371e2","book":"a-christmas-carol","level":1,"page":2,"pkey":"a-christmas-carol|L1:P2","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shifts attention to the clerk's quiet patience as he bears the bitter cold.","It builds suspense by showing that Scrooge has decided to fire the clerk soon.","It presents Scrooge as strict but fair, since he keeps his own fire small as well.","It reveals Scrooge's stinginess and power over the clerk through one small habit."],"option_sids":null,"answer":3,"highlight":["S21"],"target":"Scrooge kept the coal-box in his own room; and so surely as the clerk came in with the shovel, the master predicted that it would be necessary for them to part.","evidence":["S21","S20"],"why_en":"With only small arrangements, where the coal-box is kept and Scrooge's habit of hinting at dismissal, the narrator shows his stinginess and his power over the clerk without explaining either.","method":"kg","spec":"v1","no":2},{"item_id":"gen1-a-christmas--L1P2-raw-Craft","uid":"2c6c720972","book":"a-christmas-carol","level":1,"page":2,"pkey":"a-christmas-carol|L1:P2","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["By comparing the two fires, it shows Scrooge is even stingier toward his clerk.","By showing both small fires, it suggests Scrooge is too poor to buy more coal.","By showing a tiny fire, it mainly adds to the cold, gloomy mood of the day.","By showing both small fires, it suggests Scrooge and his clerk suffer the cold equally."],"option_sids":null,"answer":0,"highlight":["S20"],"target":"the clerk's fire was so very much smaller that it looked like one coal","evidence":["S20","S21"],"why_en":"Setting Scrooge's 'very small fire' beside the clerk's even smaller one, which looks like a single coal, makes his stinginess and the gap between the two men visible, so this is a good spot for sixth graders to read the effect of a comparison built on one object.","method":"raw","spec":"v1","no":3},{"item_id":"gen1-a-christmas--L1P3-raw-Analysis","uid":"e5366bba7b","book":"a-christmas-carol","level":1,"page":3,"pkey":"a-christmas-carol|L1:P3","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Scrooge dislikes Christmas mainly because it reminds him that he is growing older.","Scrooge is joking, using playful threats to tease his cheerful nephew.","Scrooge is mostly angry at his nephew for arguing with him about Christmas.","Scrooge judges Christmas only by money, so people's joy seems silly to him."],"option_sids":null,"answer":3,"highlight":["S18","S19","S20","S21","S22","S23"],"target":null,"evidence":["S18","S21"],"why_en":"Scrooge's values are laid bare all at once as he speaks of Christmas only in terms of bills, books, and profit and loss, so students must read the yardstick underlying his exaggerated anger.","method":"raw","spec":"v1","no":4},{"item_id":"gen1-a-christmas--L1P3-kg-Analysis","uid":"28739bdf6c","book":"a-christmas-carol","level":1,"page":3,"pkey":"a-christmas-carol|L1:P3","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["The nephew says Christmas makes poor people open their hearts to those above them.","The nephew loves Christmas for the kindness it brings, though it earns him nothing.","The nephew says Christmas reminds people they will die, so they learn to fear the grave.","The nephew loves Christmas mainly for its holy origin, more than for how people act."],"option_sids":null,"answer":1,"highlight":["S31","S32","S33"],"target":null,"evidence":["S32","S33"],"why_en":"The nephew answers right after Scrooge has measured Christmas solely in bills and account books. His rebuttal, that some things do good even when they bring no profit, is the core of the clash between the two men's values, so students must read its focus precisely.","method":"kg","spec":"v1","no":5},{"item_id":"gen1-a-christmas--L1P4-kg-Vocab","uid":"52f5ecc407","book":"a-christmas-carol","level":1,"page":4,"pkey":"a-christmas-carol|L1:P4","type":"Vocab","question":"As used in this excerpt, \"situation\" most nearly means","options":["circumstances","wages","freedom","job"],"option_sids":null,"answer":3,"highlight":["S2"],"target":"situation","evidence":["S2"],"why_en":"If students pass over the word in its common sense, \"circumstance,\" Scrooge's threat to fire the clerk blurs; they must read the precise sense, \"job.\"","method":"kg","spec":"v1","no":6},{"item_id":"gen1-a-christmas--L1P5-kg-Vocab","uid":"f1a7593e07","book":"a-christmas-carol","level":1,"page":5,"pkey":"a-christmas-carol|L1:P5","type":"Vocab","question":"As used in this excerpt, \"Want\" most nearly means","options":["loneliness","desire","greed","poverty"],"option_sids":null,"answer":3,"highlight":["S12"],"target":"Want","evidence":["S12","S11"],"why_en":"Read in the common sense, \"to desire,\" the word breaks its pairing with Abundance; only by reading the parallel structure do students arrive at the sense \"destitution.\"","method":"kg","spec":"v1","no":7},{"item_id":"gen1-a-christmas--L1P5-raw-Vocab","uid":"927f66deaa","book":"a-christmas-carol","level":1,"page":5,"pkey":"a-christmas-carol|L1:P5","type":"Vocab","question":"As used in this excerpt, \"Want\" most nearly means","options":["greed","desire","poverty","loneliness"],"option_sids":null,"answer":2,"highlight":["S12"],"target":"Want","evidence":["S11","S12"],"why_en":"Read in its familiar sense, \"to desire\" or \"a wish,\" the word distorts the gentleman's reason for collecting; the sense \"destitution\" emerges only from the contrast with Abundance immediately after, which is why the item is asked here.","method":"raw","spec":"v1","no":8},{"item_id":"gen1-a-christmas--L1P5-kg-Analysis","uid":"87dfe72c95","book":"a-christmas-carol","level":1,"page":5,"pkey":"a-christmas-carol|L1:P5","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Scrooge is too busy with his own business to keep talking today.","Scrooge honestly does not know how badly off the poor really are.","Scrooge refuses to feel responsible for the poor people who are suffering.","Scrooge complains that the workhouses he supports cost him too much money."],"option_sids":null,"answer":2,"highlight":["S19","S20","S21","S22","S23","S24","S25"],"target":null,"evidence":["S19","S21","S24","S25"],"why_en":"Students must see that the surface statements (\"I pay toward the workhouses,\" \"I don't know,\" \"It's not my business\") are all excuses that push the suffering of the poor outside Scrooge's own responsibility.","method":"kg","spec":"v1","no":9},{"item_id":"gen1-a-christmas--L1P6-raw-Evidence","uid":"90fd6814b5","book":"a-christmas-carol","level":1,"page":6,"pkey":"a-christmas-carol|L1:P6","type":"Evidence","question":"Which sentence from the passage best supports the claim that the clerk's lack of money does not spoil his delight in the holiday?","options":["The Lord Mayor, in the stronghold of the mighty Mansion House, gave orders to his fifty cooks and butlers to keep Christmas as a Lord Mayor's household should; and even the little tailor, whom he had fined five shillings on the previous Monday for being drunk and blood-thirsty in the streets, stirred up to-morrow's pudding in his garret, while his lean wife and the baby sallied out to buy the beef.","With an ill-will Scrooge dismounted from his stool, and tacitly admitted the fact to the expectant clerk in the tank, who instantly snuffed his candle out, and put on his hat.","\"A poor excuse for picking a man's pocket every twenty-fifth of December!\" said Scrooge, buttoning his great-coat to the chin.","The office was closed in a twinkling, and the clerk, with the long ends of his white comforter dangling below his waist (for he boasted no great-coat), went down a slide on Cornhill, at the end of a lane of boys, twenty times, in honour of its being Christmas-eve, and then ran home to Camden Town as hard as he could pelt, to play at blindman's buff."],"option_sids":["S2","S9","S17","S21"],"answer":3,"highlight":["S2","S9","S17","S21"],"target":null,"evidence":["S21"],"why_en":"The poor clerk enjoying Christmas to the full is the key contrast with the stingy Scrooge on this page. The item asks whether students can identify evidence that shows \"having no money\" and \"joy\" together in one sentence.","method":"raw","spec":"v1","no":10},{"item_id":"gen1-a-christmas--L1P6-kg-Evidence","uid":"ed00d8d96e","book":"a-christmas-carol","level":1,"page":6,"pkey":"a-christmas-carol|L1:P6","type":"Evidence","question":"Which sentence from the passage best supports the claim that Scrooge's meanness shows in what he does to people, not only in what he says?","options":["Scrooge seized the ruler with such energy of action, that the singer fled in terror, leaving the keyhole to the fog, and even more congenial frost.","\"It's not convenient,\" said Scrooge, \"and it's not fair.","\"A poor excuse for picking a man's pocket every twenty-fifth of December!\" said Scrooge, buttoning his great-coat to the chin.","The clerk promised that he would; and Scrooge walked out with a growl."],"option_sids":["S7","S12","S17","S20"],"answer":0,"highlight":["S7","S12","S17","S20"],"target":null,"evidence":["S7"],"why_en":"Students must separate the reading that Scrooge's harshness goes beyond words to actions that actually push others away from sentences in which he merely grumbles, or which show a gesture not directed at anyone else.","method":"kg","spec":"v1","no":11},{"item_id":"gen1-a-christmas--L1P8-raw-Vocab","uid":"78db6a4cb9","book":"a-christmas-carol","level":1,"page":8,"pkey":"a-christmas-carol|L1:P8","type":"Vocab","question":"As used in this excerpt, \"obliged\" most nearly means","options":["eager","allowed","forced","grateful"],"option_sids":null,"answer":2,"highlight":["S20"],"target":"obliged","evidence":["S19","S20"],"why_en":"Read in its common sense, \"grateful,\" obliged throws the sentence off; read together with the preceding sentence about how very small the fire is, as \"had no choice but to sit close,\" it reveals the predicament Scrooge's thrift with fuel puts him in.","method":"raw","spec":"v1","no":12},{"item_id":"gen1-a-christmas--L1P8-kg-Vocab","uid":"0daba76541","book":"a-christmas-carol","level":1,"page":8,"pkey":"a-christmas-carol|L1:P8","type":"Vocab","question":"As used in this excerpt, \"attitude\" most nearly means","options":["location","temper","posture","opinion"],"option_sids":null,"answer":2,"highlight":["S14"],"target":"attitude","evidence":["S14"],"why_en":"It is easy to pass over the word in its common sense, \"attitude, frame of mind,\" but it must be read as \"bodily posture, bearing\" for the scene to come alive: to the frightened Scrooge, the hanging dressing-gown looks suspiciously like a person.","method":"kg","spec":"v1","no":13},{"item_id":"gen1-a-christmas--L1P8-raw-Craft","uid":"cf8da27957","book":"a-christmas-carol","level":1,"page":8,"pkey":"a-christmas-carol|L1:P8","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It hints that Scrooge is too poor to pay for candles.","It shows that Scrooge is brave and not bothered by the dark.","It makes the gloomy house seem warm and cozy to Scrooge.","It jokes that Scrooge likes the dark because it saves him money."],"option_sids":null,"answer":3,"highlight":["S8"],"target":"Darkness is cheap, and Scrooge liked it.","evidence":["S8"],"why_en":"A single short sentence ties liking the darkness to its being cheap, exposing Scrooge's stinginess as a joke in the middle of an eerie scene; students must read how it does this.","method":"raw","spec":"v1","no":14},{"item_id":"gen1-a-christmas--L1P8-kg-Craft","uid":"b9fff5375f","book":"a-christmas-carol","level":1,"page":8,"pkey":"a-christmas-carol|L1:P8","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It jokes that Scrooge likes the dark mainly because it costs him nothing.","It adds to the gloomy, spooky mood of the old house at night.","It shows that Scrooge is brave enough to climb the dark stairs alone.","It shows that Scrooge cares little about comfort, even in his own home."],"option_sids":null,"answer":0,"highlight":["S8"],"target":"Darkness is cheap, and Scrooge liked it.","evidence":["S8"],"why_en":"A short, dry sentence slyly reveals that even Scrooge's fondness for darkness comes down to money, a comic summary of his stinginess, which makes this a good spot to check whether students read effect rather than meaning.","method":"kg","spec":"v1","no":15},{"item_id":"gen1-a-christmas--L1P9-raw-Craft","uid":"7da11dea25","book":"a-christmas-carol","level":1,"page":9,"pkey":"a-christmas-carol|L1:P9","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It makes the chain seem built from Marley's money and business, a weight he must drag.","It suggests that Marley still treasures his money and keeps it close as a ghost.","It shows that Marley was a rich man who cared a great deal about money.","It shows that Marley's wealth is still locked up safely, guarded even after his death."],"option_sids":null,"answer":0,"highlight":["S20"],"target":"cash-boxes, keys, padlocks, ledgers, deeds, and heavy purses wrought in steel","evidence":["S19","S20"],"why_en":"The list of objects forming the chain turns the goods of money and trade into a heavy burden wound around the body. At the Junior track, this spot separates students who read the detail as factual information from those who also read its effect.","method":"raw","spec":"v1","no":16},{"item_id":"gen1-a-christmas--L1P11-raw-Evidence","uid":"a0cdbfc907","book":"a-christmas-carol","level":1,"page":11,"pkey":"a-christmas-carol|L1:P11","type":"Evidence","question":"Which sentence from the passage best supports the claim that Scrooge at first takes the Ghost's talk about his own chain as describing a real object in the room?","options":["\"Or would you know,\" pursued the Ghost, \"the weight and length of the strong coil you bear yourself?","It is a ponderous chain!\"","Scrooge glanced about him on the floor, in the expectation of finding himself surrounded by some fifty or sixty fathoms of iron cable, but he could see nothing.","\"You must have been very slow about it, Jacob,\" Scrooge observed in a business-like manner, though with humility and deference."],"option_sids":["S11","S14","S15","S27"],"answer":2,"highlight":["S11","S14","S15","S27"],"target":null,"evidence":["S15"],"why_en":"The reading that Scrooge takes the Ghost's figurative talk of 'your chain' as a real, visible iron chain must be inferred one step from his actions in the sentence. That makes this a good spot to measure weighing of evidence rather than sentence-finding.","method":"raw","spec":"v1","no":17},{"item_id":"gen1-a-christmas--L1P12-kg-Analysis","uid":"5347eae365","book":"a-christmas-carol","level":1,"page":12,"pkey":"a-christmas-carol|L1:P12","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Marley teaches that kindness to people is the smartest way to succeed in trade.","Marley admits his trade was very small, and wishes he had worked harder at it.","Marley rejects Scrooge's praise because he now sees he ignored his real duty to people.","Marley is angry at Scrooge's praise and throws down his chain to frighten him."],"option_sids":null,"answer":2,"highlight":["S6","S7","S8","S9","S10","S11"],"target":null,"evidence":["S6","S8","S9","S10","S11"],"why_en":"Marley takes 'business', which Scrooge meant as praise, and turns it into \"caring for people\" as he voices his regret, so the item requires reading the gap between word and meaning.","method":"kg","spec":"v1","no":18},{"item_id":"gen1-a-christmas--L1P12-raw-Analysis","uid":"d5d2152838","book":"a-christmas-carol","level":1,"page":12,"pkey":"a-christmas-carol|L1:P12","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Marley says he should have used his trade mainly to earn money for the poor","Marley says caring for people was his real work, and his trade was tiny","Marley says his trade and his care for people were equally important work","Marley admits he was good at business, but says his trading hurt many people"],"option_sids":null,"answer":1,"highlight":["S6","S7","S8","S9","S10","S11"],"target":null,"evidence":["S8","S9","S10"],"why_en":"The Ghost turns 'business', which Scrooge meant as praise, into the work of caring for people. Students need to read precisely the relative weight of trade versus responsibility for others to understand what Marley regrets, which is why the item is asked here.","method":"raw","spec":"v1","no":19},{"item_id":"gen1-a-christmas--L1P13-kg-Craft","uid":"c7e3129551","book":"a-christmas-carol","level":1,"page":13,"pkey":"a-christmas-carol|L1:P13","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shows Scrooge is simply too sleepy to finish speaking.","It shows Scrooge calmly deciding the night's visit was all nonsense.","It adds a small joke that makes the scary ghost scene feel lighter.","It shows Scrooge's usual way of brushing things off starting to fail him."],"option_sids":null,"answer":3,"highlight":["S20"],"target":"He tried to say \"Humbug!\" but stopped at the first syllable.","evidence":["S19","S20"],"why_en":"The form, his usual dismissive word cut off at the first syllable, shows Scrooge's certainty wavering without stating it, so this spot can measure whether students read the effect of a detail.","method":"kg","spec":"v1","no":20},{"item_id":"gen1-a-christmas--L1P17-raw-Craft","uid":"05e581b524","book":"a-christmas-carol","level":1,"page":17,"pkey":"a-christmas-carol|L1:P17","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It lists small, lonely sounds that make Scrooge feel sorry for the house's lost riches.","It lists small, lonely sounds that remind Scrooge of happy games with his old friends.","It lists small, lonely sounds that make Scrooge afraid of being left all alone again.","It lists small, lonely sounds, and each one moves Scrooge until he cries even more."],"option_sids":null,"answer":3,"highlight":["S24"],"target":"Not a latent echo in the house, not a squeak and scuffle from the mice behind the panelling, not a drip from the half-thawed water-spout in the dull yard behind, not a sigh among the leafless boughs of one despondent poplar, not the idle swinging of an empty storehouse door, no, not a clicking in the fire","evidence":["S24","S23"],"why_en":"The structure that lays out small, lonely sounds one by one in a long series of 'not a…' lets the reader feel directly how the once-cold Scrooge breaks down at each trivial sound and weeps all the harder, which is why the item is asked here.","method":"raw","spec":"v1","no":21},{"item_id":"gen1-a-christmas--L1P18-raw-Vocab","uid":"b1067bc8b3","book":"a-christmas-carol","level":1,"page":18,"pkey":"a-christmas-carol|L1:P18","type":"Vocab","question":"As used in this excerpt, \"foreign\" most nearly means","options":["unwelcome","unknown","unusual","overseas"],"option_sids":null,"answer":2,"highlight":["S23"],"target":"foreign","evidence":["S23"],"why_en":"Students will misread the sentence if they take the word in its familiar sense, \"from another country.\" They must read the contextual sense, \"unlike his usual self,\" to see that the heart of this scene is Scrooge's change: laughing, then suddenly weeping, he pities his former self.","method":"raw","spec":"v1","no":22},{"item_id":"gen1-a-christmas--L1P18-kg-Vocab","uid":"0edb88e43e","book":"a-christmas-carol","level":1,"page":18,"pkey":"a-christmas-carol|L1:P18","type":"Vocab","question":"As used in this excerpt, \"business\" most nearly means","options":["job","right","reason","duty"],"option_sids":null,"answer":1,"highlight":["S12"],"target":"business","evidence":["S12"],"why_en":"Reading the word in its common sense, \"business\" as in commerce, throws the sentence off. Students must read the sense in which Scrooge questions whether the groom had any \"right\" to marry the Princess; only then does the scene read, with Scrooge getting angry, like a child, at a character in a story.","method":"kg","spec":"v1","no":23},{"item_id":"gen1-a-christmas--L1P19-raw-Evidence","uid":"9a79903ccf","book":"a-christmas-carol","level":1,"page":19,"pkey":"a-christmas-carol|L1:P19","type":"Evidence","question":"Which sentence from the passage best supports the claim that the boy's family had refused to let him return before this visit?","options":["Father is so much kinder than he used to be, that home's like Heaven!","He spoke so gently to me one dear night when I was going to bed, that I was not afraid to ask him once more if you might come home; and he said Yes, you should; and sent me in a coach to bring you.","And you're to be a man!\" said the child, opening her eyes; \"and are never to come back here; but first we're to be together all the Christmas long, and have the merriest time in all the world.\"","A terrible voice in the hall cried, \"Bring down Master Scrooge's box, there!\" and in the hall appeared the schoolmaster himself, who glared on Master Scrooge with a ferocious condescension, and threw him into a dreadful state of mind by shaking hands with him."],"option_sids":["S7","S8","S9","S13"],"answer":1,"highlight":["S7","S8","S9","S13"],"target":null,"evidence":["S8"],"why_en":"The item asks whether students can infer from the single phrase 'once more' in Fan's excited speech that Scrooge's lonely past included being kept from going home before, and cite it as evidence.","method":"raw","spec":"v1","no":24},{"item_id":"gen1-a-christmas--L1P22-raw-Vocab","uid":"a17c499da1","book":"a-christmas-carol","level":1,"page":22,"pkey":"a-christmas-carol|L1:P22","type":"Vocab","question":"As used in this excerpt, \"light\" most nearly means","options":["pale","bright","quick","easy"],"option_sids":null,"answer":3,"highlight":["S15"],"target":"light","evidence":["S15"],"why_en":"Students easily read this word in its common sense, \"light\" as in brightness; they get the meaning only by seeing that it pairs with 'burdensome' immediately after.","method":"raw","spec":"v1","no":25},{"item_id":"gen1-a-christmas--L1P22-kg-Vocab","uid":"7d052c1025","book":"a-christmas-carol","level":1,"page":22,"pkey":"a-christmas-carol|L1:P22","type":"Vocab","question":"As used in this excerpt, \"signed\" most nearly means","options":["gestured","hinted","wrote","called"],"option_sids":null,"answer":0,"highlight":["S9"],"target":"signed","evidence":["S9"],"why_en":"Read in the common sense, \"to sign one's name,\" the sentence goes wrong; students get the meaning only by following the sequence in which the Ghost signals silently with a gesture before speaking.","method":"kg","spec":"v1","no":26},{"item_id":"gen1-a-christmas--L1P22-raw-Analysis","uid":"7b9f8c7c43","book":"a-christmas-carol","level":1,"page":22,"pkey":"a-christmas-carol|L1:P22","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Scrooge's own words make him uneasy, so he wants to apologize to the Spirit for arguing.","Scrooge's own words about a good master make him uneasy about how he treats his worker.","Scrooge enjoys remembering his youth and wishes he could stay longer in this happy past.","Scrooge stops talking because he fears the Spirit will laugh at his foolish old feelings."],"option_sids":null,"answer":1,"highlight":["S17","S18","S19","S20","S21","S22","S23"],"target":null,"evidence":["S17","S18","S22"],"why_en":"Scrooge's words about the happiness a master can give turn back on himself, but he hides that implication behind 'Nothing particular', so the item requires reading what goes unsaid.","method":"raw","spec":"v1","no":27},{"item_id":"gen1-a-christmas--L1P23-raw-Analysis","uid":"2aa96490a1","book":"a-christmas-carol","level":1,"page":23,"pkey":"a-christmas-carol|L1:P23","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["She angrily lets him go, wanting to punish him for caring so much about money.","She is testing him, hoping he will prove he would still choose her today.","She sadly lets him go, sure that money now matters more to him than she does.","She lets him go because, having no dowry, she feels she is not good enough."],"option_sids":null,"answer":2,"highlight":["S38","S39","S40","S41","S42","S43"],"target":null,"evidence":["S41","S42","S43"],"why_en":"The fiancée never says outright that money has changed him; through her question of whether he would choose a dowerless girl and her statement that she releases him because she loved the man he once was, she conveys both the reason for the parting and her sorrow, so students must read the hidden meaning and the texture of feeling.","method":"raw","spec":"v1","no":28},{"item_id":"gen1-a-christmas--L1P23-kg-Analysis","uid":"b1b502489c","book":"a-christmas-carol","level":1,"page":23,"pkey":"a-christmas-carol|L1:P23","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Her own hopes have changed, so now she would not seek him out again.","His spirit has changed, but with a struggle he proves his love is still the same.","In his heart he has already pulled away from her, and he cannot fully deny it.","She is unsure of his changed nature, so she asks if he would still win her."],"option_sids":null,"answer":2,"highlight":["S32","S33","S34","S35","S36","S37"],"target":null,"evidence":["S32","S33","S34","S35","S36","S37"],"why_en":"Scrooge has not asked for a release in words, but his changed nature has already drawn him away from her, and he himself grudgingly knows it. The item is asked here because it can be answered only by reading this implication, which the passage never states.","method":"kg","spec":"v1","no":29},{"item_id":"gen1-a-christmas--L2P2-kg-Craft","uid":"3df9a6e794","book":"a-christmas-carol","level":2,"page":2,"pkey":"a-christmas-carol|L2:P2","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It mainly tells readers that the bell rang One and no ghost came.","It gently mocks readers who think they would have acted more wisely.","It makes his careful readiness funny, since an empty room scares him most.","It adds humor, but mostly shows that Scrooge no longer fears the spirits."],"option_sids":null,"answer":2,"highlight":["S12"],"target":"being prepared for almost anything, he was not by any means prepared for nothing","evidence":["S12"],"why_en":"Asks whether students see how the wordplay pitting anything against nothing turns into comedy the predicament of a Scrooge who has braced himself for anything, only to be undone by nothing at all.","method":"kg","spec":"v1","no":30},{"item_id":"gen1-a-christmas--L2P4-kg-Vocab","uid":"6c32eb6833","book":"a-christmas-carol","level":2,"page":4,"pkey":"a-christmas-carol|L2:P4","type":"Vocab","question":"As used in this excerpt, \"abroad\" most nearly means","options":["in the far distance","spread all around","high in the sky","in foreign lands"],"option_sids":null,"answer":1,"highlight":["S15"],"target":"abroad","evidence":["S15","S16"],"why_en":"Reading 'abroad' in its common sense of \"overseas\" collapses the contrast between the gloomy city and the cheerfulness spread through its streets, so the heart of this page depends on reading the word precisely.","method":"kg","spec":"v1","no":31},{"item_id":"gen1-a-christmas--L2P7-kg-Vocab","uid":"bbec23d8d9","book":"a-christmas-carol","level":2,"page":7,"pkey":"a-christmas-carol|L2:P7","type":"Vocab","question":"As used in this excerpt, \"brave\" most nearly means","options":["standing proud","dressed up nicely","feeling cheerful","acting fearless"],"option_sids":null,"answer":1,"highlight":["S2"],"target":"brave","evidence":["S2"],"why_en":"'Brave' is easily read in its common sense of \"courageous,\" but in a sentence that sets a worn dress against cheap ribbons it must be read as \"finely dressed.\"","method":"kg","spec":"v1","no":32},{"item_id":"gen1-a-christmas--L2P8-kg-Evidence","uid":"b124988377","book":"a-christmas-carol","level":2,"page":8,"pkey":"a-christmas-carol|L2:P8","type":"Evidence","question":"Which sentence from the passage best supports the claim that going without is so normal for the Cratchits that a mere trace of leftover food feels like a triumph?","options":["Such a bustle ensued that you might have thought a goose the rarest of all birds; a feathered phenomenon, to which a black swan was a matter of course—and, in truth, it was something very like it in that house.","There never was such a goose.","Its tenderness and flavour, size and cheapness, were the themes of universal admiration.","Eked out by apple sauce and mashed potatoes, it was a sufficient dinner for the whole family; indeed, as Mrs. Cratchit said with great delight (surveying one small atom of a bone upon the dish), they hadn't ate it all at last!"],"option_sids":["S8","S12","S14","S15"],"answer":3,"highlight":["S8","S12","S14","S15"],"target":null,"evidence":["S15"],"why_en":"The family rejoices aloud that they could not finish it all, yet only a single bone is left on the plate. This spot measures whether students can make one inferential step from that mismatch to the family's constant scarcity and choose the evidence for it.","method":"kg","spec":"v1","no":33},{"item_id":"gen1-a-christmas--L2P9-kg-Craft","uid":"9dd6583ed8","book":"a-christmas-carol","level":2,"page":9,"pkey":"a-christmas-carol|L2:P9","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It adds warmth to the toast, showing that the family's joy is complete.","It shows Bob calming Tim, who seems frightened by the noisy party.","It openly shows Bob's fear, turning the whole dinner into a sad scene.","It quietly brings worry into the happy toast, showing Bob fears losing Tim."],"option_sids":null,"answer":3,"highlight":["S31"],"target":"Bob held his withered little hand in his","evidence":["S29","S30","S31"],"why_en":"A single wordless gesture, the father clasping a thin little hand, quietly brings his fear into the middle of a cheerful toast. The item asks whether students read this effect.","method":"kg","spec":"v1","no":34},{"item_id":"gen1-a-christmas--L2P10-kg-Analysis","uid":"7bc5f79609","book":"a-christmas-carol","level":2,"page":10,"pkey":"a-christmas-carol|L2:P10","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["The Ghost repeats Scrooge's words to scold him for refusing money to the poor.","The Ghost repeats Scrooge's words to shame him for judging who deserves to live.","The Ghost asks Scrooge to find where the extra people are, and Scrooge looks down.","Scrooge is ashamed because the Ghost proves he is worth less than the poor child."],"option_sids":null,"answer":1,"highlight":["S8","S9","S10","S11","S12","S13"],"target":null,"evidence":["S8","S9","S10","S11"],"why_en":"Students must see that the Ghost's rebuke turns Scrooge's own words back on him to target \"the arrogance of deciding who deserves to live\"; only then does it become clear why Scrooge hangs his head.","method":"kg","spec":"v1","no":35},{"item_id":"gen1-a-christmas--L2P11-kg-Craft","uid":"002640cff6","book":"a-christmas-carol","level":2,"page":11,"pkey":"a-christmas-carol|L2:P11","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shows Scrooge noting each hardship so he can judge the family closely.","It lists the family's hardships one by one so their joy stands out more.","It admits the family is nothing special so readers will trust the narrator.","It shows the family acting cheerful so no one notices how poor they are."],"option_sids":null,"answer":1,"highlight":["S5"],"target":"They were not a handsome family; they were not well dressed; their shoes were far from being waterproof; their clothes were scanty","evidence":["S5"],"why_en":"The item asks about the effect of piling up the signs of poverty one by one and then reversing them with 'But they were happy,' so it can measure the ability to read a detail for its effect rather than its content.","method":"kg","spec":"v1","no":36},{"item_id":"gen1-a-christmas--L2P14-kg-Vocab","uid":"5a88ebd155","book":"a-christmas-carol","level":2,"page":14,"pkey":"a-christmas-carol|L2:P14","type":"Vocab","question":"As used in this excerpt, \"observed\" most nearly means","options":["remarked","agreed","noticed","watched"],"option_sids":null,"answer":0,"highlight":["S10"],"target":"observed","evidence":["S10"],"why_en":"Reading 'observed' in its common sense of \"saw\" makes the words attached to the line of dialogue clash with the flow of the conversation, so this is a good spot to check whether students read the word precisely.","method":"kg","spec":"v1","no":37},{"item_id":"gen1-a-christmas--L2P14-kg-Analysis","uid":"561aeb4c78","book":"a-christmas-carol","level":2,"page":14,"pkey":"a-christmas-carol|L2:P14","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Fred pities Scrooge and believes cheerful yearly visits can slowly change his mind.","Fred mainly hopes his kind visits will earn him some of Scrooge's money.","Fred pities Scrooge but plans to stop visiting if Scrooge stays rude.","The guests share Fred's confidence that his visit has really shaken Scrooge."],"option_sids":null,"answer":0,"highlight":["S32","S33","S34","S35"],"target":null,"evidence":["S32","S33","S34"],"why_en":"This passage gathers the nephew's inner conviction that, out of pity, he keeps visiting his uncle warmly every year despite the mockery and believes he can change him, making it well suited to measuring the ability to read a character's unstated feelings.","method":"kg","spec":"v1","no":38},{"item_id":"gen1-a-christmas--L2P19-kg-Evidence","uid":"b831fff59c","book":"a-christmas-carol","level":2,"page":19,"pkey":"a-christmas-carol|L2:P19","type":"Evidence","question":"Which sentence from the passage best supports the claim that the man's death brings no sadness, even to the men who are talking about him?","options":["\"No,\" said a great fat man with a monstrous chin, \"I don't know much about it either way.","I only know he's dead.\"","\"I thought he'd never die.\"","\"God knows,\" said the first with a yawn."],"option_sids":["S20","S21","S25","S26"],"answer":3,"highlight":["S20","S21","S25","S26"],"target":null,"evidence":["S26"],"why_en":"To measure whether students can read as evidence a gesture (a yawn) that shows boredom rather than grief at news of someone's death, the item has them choose, among similar-seeming lines expressing indifference, plain reporting, or surprise, the sentence that most directly shows the absence of feeling.","method":"kg","spec":"v1","no":39},{"item_id":"gen1-a-christmas--L2P20-kg-Vocab","uid":"2c46ff83ec","book":"a-christmas-carol","level":2,"page":20,"pkey":"a-christmas-carol|L2:P20","type":"Vocab","question":"As used in this excerpt, \"disinterested\" most nearly means","options":["without any curiosity","without close friends","without much money","without selfish motive"],"option_sids":null,"answer":3,"highlight":["S2"],"target":"disinterested","evidence":["S2"],"why_en":"Read as \"indifferent,\" the word does not fit the reason given, that he wants neither gloves nor lunch. Only by reading it correctly as \"without self-interest\" do students catch the merchant's joke that weighs the funeral as a matter of payment.","method":"kg","spec":"v1","no":40},{"item_id":"gen1-a-christmas--L2P20-kg-Analysis","uid":"b914827164","book":"a-christmas-carol","level":2,"page":20,"pkey":"a-christmas-carol|L2:P20","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Scrooge cares little about the Spirit's riddles and waits for them to end.","Scrooge hunts for clues and is shocked to see another man in his corner.","Scrooge hunts for clues but explains away his missing self as a good sign.","Scrooge sees the scenes are about himself and decides to change his life."],"option_sids":null,"answer":2,"highlight":["S29","S30","S31","S32"],"target":null,"evidence":["S29","S31","S32"],"why_en":"Scrooge strains to find a lesson in every scene, yet he puts a favorable spin on the most troubling sign of all, his own absence, reading it as a mark of his new resolve. The item asks whether students read this gap, which the narrator never states.","method":"kg","spec":"v1","no":41},{"item_id":"gen1-a-christmas--L2P22-kg-Vocab","uid":"d2d218013d","book":"a-christmas-carol","level":2,"page":22,"pkey":"a-christmas-carol|L2:P22","type":"Vocab","question":"As used in this excerpt, \"natural\" most nearly means","options":["kind","sincere","relaxed","healthy"],"option_sids":null,"answer":0,"highlight":["S18"],"target":"natural","evidence":["S18","S19"],"why_en":"Reading the word in its common sense of \"natural\" throws the sentence off; it must be read as \"kindly\" to connect with the result in the next sentence, that there was no one to look after him.","method":"kg","spec":"v1","no":42},{"item_id":"gen1-a-christmas--L2P23-kg-Analysis","uid":"e002662792","book":"a-christmas-carol","level":2,"page":23,"pkey":"a-christmas-carol|L2:P23","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Scrooge sees that his own life is heading toward the same lonely, robbed end.","Scrooge believes his life is already like the dead man's and cannot change.","Scrooge mostly pities the dead man for having no friends at his death.","Scrooge is disgusted by the thieves but sees no link to his own life."],"option_sids":null,"answer":0,"highlight":["S32","S33","S34","S35","S36","S37","S38"],"target":null,"evidence":["S33","S37","S38"],"why_en":"After hearing the woman's mockery, Scrooge begins to see the direction of his own life in the dead man's situation. Students must read precisely that his realization goes only as far as \"it could be so; I am heading that way now.\"","method":"kg","spec":"v1","no":43},{"item_id":"gen1-a-christmas--L2P24-kg-Craft","uid":"4c3c34f186","book":"a-christmas-carol","level":2,"page":24,"pkey":"a-christmas-carol|L2:P24","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It suggests the Phantom holds Scrooge back, so even the slightest motion is beyond him.","It shows Scrooge's curiosity, so readers expect him to lift the sheet at any moment.","It stresses the body's neglect, so Scrooge seems to pity the dead man too much to look.","It shows how easy looking would be, so what stops Scrooge must be inside him."],"option_sids":null,"answer":3,"highlight":["S5"],"target":"The cover was so carelessly adjusted that the slightest raising of it, the motion of a finger upon Scrooge's part, would have disclosed the face.","evidence":["S5","S6"],"why_en":"Asks whether students read the effect of the detail that a single finger would be enough to see: it reveals that what stops Scrooge from looking lies not outside him but within his own mind.","method":"kg","spec":"v1","no":44},{"item_id":"gen1-a-christmas--L3P1-kg-Vocab","uid":"ba58a0e086","book":"a-christmas-carol","level":3,"page":1,"pkey":"a-christmas-carol|L3:P1","type":"Vocab","question":"As used in this excerpt, \"started\" most nearly means","options":["set off","began again","turned around","jumped nervously"],"option_sids":null,"answer":3,"highlight":["S1"],"target":"started","evidence":["S1"],"why_en":"Reading 'started' in its common sense of \"began\" erases Caroline's anxious movement, making this a good spot to measure whether students read the word itself precisely.","method":"kg","spec":"v1","no":45},{"item_id":"gen1-a-christmas--L3P1-kg-Analysis","uid":"233faef90d","book":"a-christmas-carol","level":3,"page":1,"pkey":"a-christmas-carol|L3:P1","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["The parents try to hide their relief, so the children never feel any change","They feel relief at first, but worry returns when they think about the debt","The family is glad, and the Ghost shows Scrooge that their gladness is shameful","His death brings relief instead of grief, showing how harshly he had treated them"],"option_sids":null,"answer":3,"highlight":["S19","S20","S21","S22","S23","S24","S25"],"target":null,"evidence":["S20","S23","S24","S25"],"why_en":"The dead man's life is never described; it emerges only through the reaction of those left behind, who feel relief rather than grief.","method":"kg","spec":"v1","no":46},{"item_id":"gen1-a-christmas--L3P2-kg-Vocab","uid":"b72aeb3c58","book":"a-christmas-carol","level":3,"page":2,"pkey":"a-christmas-carol|L3:P2","type":"Vocab","question":"As used in this excerpt, \"comforter\" most nearly means","options":["heavy winter overcoat","source of comfort","woolen neck scarf","warm bed quilt"],"option_sids":null,"answer":2,"highlight":["S25"],"target":"comforter","evidence":["S25"],"why_en":"Reading the word as \"something that consoles\" does not sound odd against the sentences immediately around it, so students must pinpoint its actual meaning here: the item Bob wears wrapped around him as he walks in from outside.","method":"kg","spec":"v1","no":47},{"item_id":"gen1-a-christmas--L3P2-kg-Analysis","uid":"df83525149","book":"a-christmas-carol","level":3,"page":2,"pkey":"a-christmas-carol|L3:P2","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Her eyes ache from the sewing, and she fears her husband will scold her.","She hides her tears for Tiny Tim so her husband will not see her grief.","She cries for Tiny Tim and hopes her husband will come home to comfort her.","She hides her tears for Tiny Tim so the children will not become frightened."],"option_sids":null,"answer":1,"highlight":["S8","S9","S10","S11","S12","S13"],"target":null,"evidence":["S8","S9","S10","S11","S13"],"why_en":"Students must read the gap between the surface claim that \"the color hurts her eyes\" and the narrator's 'Ah, poor Tiny Tim!' to see what Mrs. Cratchit is hiding and whom she is trying to protect.","method":"kg","spec":"v1","no":48},{"item_id":"gen1-a-christmas--L3P2-kg-Craft","uid":"f5f390e355","book":"a-christmas-carol","level":3,"page":2,"pkey":"a-christmas-carol|L3:P2","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shows the children gently comforting their father with a touch instead of words.","It shows the children quietly seeking comfort from their father for their own sadness.","It shows the children quietly urging their father to forget Tiny Tim and be cheerful.","It shows the children hiding the family's sadness from their father, just like their mother."],"option_sids":null,"answer":0,"highlight":["S27","S28"],"target":"laid, each child, a little cheek against his face","evidence":["S27","S28"],"why_en":"The narrator renders the children's wordless gesture of laying their cheeks against his as if it were dialogue, so the effect of the gesture comes through only if students read precisely who is comforting whom, and how.","method":"kg","spec":"v1","no":49},{"item_id":"gen1-a-christmas--L3P3-kg-Vocab","uid":"c314faa111","book":"a-christmas-carol","level":3,"page":3,"pkey":"a-christmas-carol|L3:P3","type":"Vocab","question":"As used in this excerpt, \"situation\" most nearly means","options":["condition","job","mood","home"],"option_sids":null,"answer":1,"highlight":["S19"],"target":"situation","evidence":["S19"],"why_en":"Read in its common sense of \"circumstances,\" the word leaves Bob's remark vague; read as \"job,\" it reveals Bob's hope that the nephew can help with Peter's future.","method":"kg","spec":"v1","no":50},{"item_id":"gen1-a-christmas--L3P3-kg-Analysis","uid":"eda26ba3b5","book":"a-christmas-carol","level":3,"page":3,"pkey":"a-christmas-carol|L3:P3","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Bob is comforted most by feeling that an outsider truly shared his family's sorrow.","Bob is comforted most by proof that the gentleman had long known the family well.","Bob is comforted most by the gentleman's warm praise of his wife's goodness.","Bob is comforted most by the gentleman's offer to help the family in any way."],"option_sids":null,"answer":0,"highlight":["S12","S13","S14","S15","S16","S17","S18"],"target":null,"evidence":["S15","S16"],"why_en":"The passage does not state outright where Bob's joy comes from, so students must infer from his words which matters more to him: the offer of help or the sympathy that shares his grief.","method":"kg","spec":"v1","no":51},{"item_id":"gen1-a-christmas--L3P4-kg-Analysis","uid":"f3782ba37b","book":"a-christmas-carol","level":3,"page":4,"pkey":"a-christmas-carol|L3:P4","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Afraid of the grave, Scrooge begs for hope, and the Spirit's silence shows that it agrees.","Scrooge mainly wants to learn whose grave it is, so he asks before reading the stone.","Afraid of the grave, Scrooge begs to hear that his future can change, but gets no answer.","Scrooge argues that a person's future is fixed, so changing his ways would not help him now."],"option_sids":null,"answer":2,"highlight":["S24","S25","S26","S27","S28","S29","S30"],"target":null,"evidence":["S25","S28","S29","S30"],"why_en":"The item asks about this passage because Scrooge's trembling plea at the grave to be told he can change stands against the Ghost, which never moves, so that hope and fear surface together.","method":"kg","spec":"v1","no":52},{"item_id":"gen1-a-christmas--L3P4-kg-Craft","uid":"45914926c9","book":"a-christmas-carol","level":3,"page":4,"pkey":"a-christmas-carol|L3:P4","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["This first small movement hints that the Spirit is losing patience with Scrooge's questions.","This first small movement hints that the silent Spirit is touched by Scrooge's plea.","This first small movement hints that Scrooge's fear is making him imagine things.","This first small movement hints that the Spirit will finally answer Scrooge in words."],"option_sids":null,"answer":1,"highlight":["S41"],"target":"For the first time the hand appeared to shake.","evidence":["S41","S40","S42","S44"],"why_en":"The item asks about this spot because the Ghost's hand, silent and motionless until now, trembles for the first time right after Scrooge's desperate plea, and that single gesture lets the reader feel that the Ghost has been moved.","method":"kg","spec":"v1","no":53},{"item_id":"gen1-a-christmas--L3P5-kg-Vocab","uid":"97b901eadd","book":"a-christmas-carol","level":3,"page":5,"pkey":"a-christmas-carol|L3:P5","type":"Vocab","question":"As used in this excerpt, \"fluttered\" most nearly means","options":["hurried","nervous","windblown","excited"],"option_sids":null,"answer":3,"highlight":["S21"],"target":"fluttered","evidence":["S21"],"why_en":"Reading the word in its common physical sense of \"flapping\" is wrong; it must be read as a state of mind stirred up by good resolutions.","method":"kg","spec":"v1","no":54},{"item_id":"gen1-a-christmas--L3P5-kg-Evidence","uid":"0fe4bdadcd","book":"a-christmas-carol","level":3,"page":5,"pkey":"a-christmas-carol|L3:P5","type":"Evidence","question":"Which sentence from the passage best supports the claim that Scrooge now sees the dark future he was shown as something that can still be avoided?","options":["Oh, tell me I may sponge away the writing on this stone!\"","Holding up his hands in a last prayer to have his fate reversed, he saw an alteration in the Phantom's hood and dress.","They are here—I am here—the shadows of the things that would have been may be dispelled.","I know they will!\""],"option_sids":["S5","S9","S24","S26"],"answer":2,"highlight":["S5","S9","S24","S26"],"target":null,"evidence":["S24"],"why_en":"The idea that the future can change is scattered across several sentences of praying, hoping, and believing, so students must pick out the one in which Scrooge, now awake, sees that he can avoid that future.","method":"kg","spec":"v1","no":55},{"item_id":"gen1-a-christmas--L3P6-kg-Vocab","uid":"88c762b5da","book":"a-christmas-carol","level":3,"page":6,"pkey":"a-christmas-carol|L3:P6","type":"Vocab","question":"As used in this excerpt, \"transports\" most nearly means","options":["long journeys","bursts of joy","means of travel","deep worries"],"option_sids":null,"answer":1,"highlight":["S11"],"target":"transports","evidence":["S11"],"why_en":"The item asks about this spot because reading the word in its common sense of \"transportation\" throws the sentence off; only by reading it alongside Scrooge's excited shouts of \"Hallo! Whoop!\" just before does its meaning of \"overflowing joy\" come through.","method":"kg","spec":"v1","no":56},{"item_id":"gen1-a-christmas--L3P6-kg-Evidence","uid":"eb6a6bc7df","book":"a-christmas-carol","level":3,"page":6,"pkey":"a-christmas-carol|L3:P6","type":"Evidence","question":"Which sentence from the passage best supports the claim that Scrooge gladly chooses to start fresh instead of holding on to his old grown-up self?","options":["\"I don't know how long I have been among the Spirits.","I'm quite a baby.","I'd rather be a baby.","Whoop!"],"option_sids":["S2","S4","S7","S9"],"answer":2,"highlight":["S2","S4","S7","S9"],"target":null,"evidence":["S7"],"why_en":"Scrooge does not fear the confusion of not even knowing the date but instead embraces it as a fresh start, and only one sentence shows this as a \"choice.\" The item therefore asks students to pick out the true evidence from among sentences that share the word \"baby.\"","method":"kg","spec":"v1","no":57},{"item_id":"gen1-a-christmas--L3P8-kg-Craft","uid":"5d0ae263c4","book":"a-christmas-carol","level":3,"page":8,"pkey":"a-christmas-carol|L3:P8","type":"Craft","question":"What is the effect of the author's use of the highlighted detail?","options":["It shows that facing his own family is harder for Scrooge than greeting strangers","It suggests that Scrooge's happy mood is weak and is already fading away","It shows that Scrooge is too proud to admit to his nephew he was wrong","It creates suspense about whether Fred is at home to receive his uncle"],"option_sids":null,"answer":0,"highlight":["S8"],"target":"He passed the door a dozen times before he had the courage to go up and knock.","evidence":["S6","S8","S9"],"why_en":"Asks whether students read how the detail of Scrooge hesitating at his nephew's door, after he has readily found joy among strangers, complicates his new happiness.","method":"kg","spec":"v1","no":58},{"item_id":"gen1-a-christmas--L3P9-kg-Analysis","uid":"996ce58b30","book":"a-christmas-carol","level":3,"page":9,"pkey":"a-christmas-carol|L3:P9","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Scrooge only pretends to scold Bob, and Bob thinks his kindness means he has gone mad.","Scrooge is truly angry about Bob's lateness, but he calms down and raises his pay.","Scrooge only pretends to scold Bob, and Bob laughs because he sees the joke right away.","Bob is angry about being poked, so he thinks about hitting Scrooge with the ruler."],"option_sids":null,"answer":0,"highlight":["S5","S6","S7","S8","S9","S10"],"target":null,"evidence":["S6","S7","S8","S9"],"why_en":"Scrooge's words, which open in a scolding tone and end with a raise, together with Bob's inability to believe them, show how unexpected Scrooge's change is, so this spot asks students to read the meaning beneath the surface.","method":"kg","spec":"v1","no":59},{"item_id":"gen1-a-christmas--L3P9-kg-Evidence","uid":"7b3c2e1cab","book":"a-christmas-carol","level":3,"page":9,"pkey":"a-christmas-carol|L3:P9","type":"Evidence","question":"Which sentence from the passage best supports the claim that Scrooge's promise to help the Cratchits grew into a bond as close as family?","options":["I'll raise your salary, and endeavour to assist your struggling family, and we will discuss your affairs this very afternoon, over a Christmas bowl of smoking bishop, Bob!","Scrooge was better than his word.","He did it all, and infinitely more; and to Tiny Tim, who did NOT die, he was a second father.","He became as good a friend, as good a master, and as good a man as the good old City knew, or any other good old city, town, or borough in the good old world."],"option_sids":["S12","S14","S15","S16"],"answer":2,"highlight":["S12","S14","S15","S16"],"target":null,"evidence":["S15"],"why_en":"Several candidate sentences could support the interpretation that the change went beyond words into action, so the item can ask students to find the strongest evidence: the one sentence that shows both \"going beyond the promise\" and \"a family-like bond.\"","method":"kg","spec":"v1","no":60},{"item_id":"gen1-the-strange--L1P1-raw-Analysis","uid":"7b748faa1b","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":1,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P1","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Utterson denies himself pleasures, yet he forgives others, so failing men still turn to him.","Utterson is strict with himself, so he expects others to obey the same strict rules.","Utterson secretly loves wrongdoing, so he quietly joins his friends in their misdeeds.","Utterson cares little about others, so he lets troubled men ruin themselves alone."],"option_sids":null,"answer":0,"highlight":["S6","S7","S8","S9"],"target":null,"evidence":["S6","S7","S9"],"why_en":"Utterson's character comes into focus only if students see the mismatch between his strictness toward himself and his tolerance toward others, and recognize that 'Cain's heresy,' a phrase that sounds cold on the surface, actually signals forbearance.","method":"raw","spec":"v1","no":1},{"item_id":"gen1-the-strange--L1P1-kg-Analysis","uid":"b22f995709","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":1,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P1","type":"Analysis","question":"Which best describes the meaning of the highlighted passage?","options":["Failing men turn to Utterson mainly because he is the most reputable man they know.","He denies himself small pleasures but won't scold others, so failing men keep him near.","Utterson drinks gin and skips the theatre because he envies other men's misdeeds.","Utterson lets his brother go to the devil because he will not help troubled men."],"option_sids":null,"answer":1,"highlight":["S6","S7","S8","S9"],"target":null,"evidence":["S6","S7","S9"],"why_en":"This passage brings together Utterson's strictness with himself and leniency toward others, along with his odd remark invoking Cain. Students must read whether this tolerance is indifference or a generosity that helps, and how it shapes his relationships with people on the way down.","method":"kg","spec":"v1","no":2},{"item_id":"gen1-the-strange--L1P3-kg-Vocab","uid":"120042bf26","book":"the-strange-case-of-dr-jekyll-and-mr-hyde","level":1,"page":3,"pkey":"the-strange-case-of-dr-jekyll-and-mr-hyde|L1:P3","type":"Vocab","question":"As used in this excerpt, \"credit\" most nearly means","options":["belief","reputation","praise","loans"],"option_sids":null,"answer":1,"highlight":["S13"],"target":"credit","evidence":["S12","S13"],"why_en":"Reading credit in its common senses of \"financial dealings\" or \"praise\" misses the heart of this scene, in which reputation is used as leverage, so the item asks whether students read it in context as \"social standing.\"","method":"kg","spec":"v1","no":3},{"item_id":"gen1-the-strange--L1P3-raw-Vocab","uid":"cc40d6dc73","book":"the-strange-case-of
